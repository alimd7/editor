<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- أمان: لا اتصال إلا بخادم Roam -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: 'self'; manifest-src 'self'; worker-src 'self' blob:; font-src 'self'; connect-src https://api.roamresearch.com https://*.api.roamresearch.com:*;">
<title>المحرر (جوال)</title>
<link rel="manifest" href="manifest-mobile.webmanifest">
<meta name="theme-color" content="#0f8f7e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f8f7e'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23fff'/%3E%3Crect x='30' y='16' width='24' height='8' rx='4' fill='%23fff'/%3E%3Ccircle cx='20' cy='44' r='5' fill='%23fff'/%3E%3Crect x='30' y='40' width='24' height='8' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--fg:#1c2330;--mut:#7b8794;--line:#e3e7ec;--card:#f4f6f8;--acc:#0f8f7e;--accfg:#fff;--link:#1766b3;--mark:#fff1a6;--code:#eef1f4;--danger:#c0392b;--sel:#e3f4f1;--fs:17px;--lh:1.7}
@media (prefers-color-scheme:dark){:root{--bg:#13171c;--fg:#e2e6ea;--mut:#8b96a3;--line:#2a313a;--card:#1b2128;--acc:#27b3a0;--accfg:#06201c;--link:#74b6f2;--mark:#6a5900;--code:#222a33;--sel:#17332f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overscroll-behavior-y:contain}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;font-size:16px;touch-action:manipulation}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer}
[hidden]{display:none!important}
.scr{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top)}
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);min-height:50px;user-select:none;-webkit-user-select:none}
.ic{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;color:var(--mut);font-size:17px;font-weight:600}
.ic:active,.chip:active,.k:active{background:var(--card)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{height:38px;border:1px solid var(--line);border-radius:19px;padding:0 12px;background:var(--bg);max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
select.chip{appearance:none;-webkit-appearance:none;padding-inline-end:12px;text-align:center}
.chip.view{flex:none;display:flex;align-items:center;gap:5px;padding:0 10px;border-color:var(--acc);color:var(--acc);font-weight:600;max-width:none}
.chip.view svg{width:17px;height:17px}
select.chip{max-width:24vw;padding:0 8px}
#home .bar{gap:4px}
#home .bar .ic{width:36px}
#home .chip.view{padding:0 8px;gap:4px}
#target{padding:0 9px}
.it .act{flex:none;height:34px;padding:0 12px;border:1px solid var(--acc);color:var(--acc);border-radius:17px;font-size:13px;font-weight:600}
.it .act:active{background:var(--sel)}
.chip.grow{flex:1;max-width:none;text-align:start;min-width:0}
.chip .tl{color:var(--mut);font-size:12px}
#prog{position:fixed;top:0;inset-inline:0;height:3px;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:pr 1s linear infinite;z-index:50}
@keyframes pr{from{background-position:140% 0}to{background-position:-40% 0}}

/* ---- الالتقاط ---- */
#ctx{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--sel);font-size:13px;border-bottom:1px solid var(--line)}
#ctx div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctx b{font-weight:600}
#ta{flex:1;min-height:0;width:100%;border:0;outline:0;resize:none;background:var(--bg);padding:12px 14px;font-size:var(--fs);line-height:var(--lh);unicode-bidi:plaintext;text-align:right;white-space:pre-wrap}
#ta.ltr{text-align:left}
#err{flex:none;padding:8px 12px;background:#fdecea;color:#8c1d12;font-size:13px;display:flex;gap:8px;align-items:flex-start}
@media (prefers-color-scheme:dark){#err{background:#3a1b17;color:#f3b4ab}}
#err div{flex:1;word-break:break-word}
.sugg{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px 8px;border-top:1px solid var(--line);scrollbar-width:none}
.sugg::-webkit-scrollbar,.keys .ks::-webkit-scrollbar{display:none}
.sg{flex:none;height:36px;padding:0 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:14px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg.new{border-style:dashed;color:var(--mut)}
.keys{flex:none;display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none}
.keys .ks{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none}
.k{flex:none;min-width:46px;height:48px;padding:0 10px;display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--fg);border-inline-end:1px solid var(--line);direction:ltr}
.k.w{font-size:13px;font-weight:500;direction:rtl}
.send{flex:none;min-width:86px;height:48px;background:var(--acc);color:var(--accfg);font-weight:700;font-size:15px}
.send:disabled{opacity:.55}

/* ---- البحث ---- */
#sq{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:20px;padding:0 14px;background:var(--card);outline:0;font-size:16px}
.hint{flex:none;padding:6px 14px;font-size:12px;color:var(--mut)}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.it{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:48px}
.it:active{background:var(--card)}
.it .t{flex:1;min-width:0;word-break:break-word;unicode-bidi:plaintext}
.it .s{flex:none;font-size:12px;color:var(--mut)}
.it.sp .t{color:var(--acc);font-weight:600}
.sec{padding:8px 14px 4px;font-size:12px;color:var(--mut);background:var(--card)}

/* ---- الصفحة ---- */
.ttl{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.3;max-height:2.6em;overflow:hidden;unicode-bidi:plaintext}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 96px 10px;font-size:var(--fs);line-height:var(--lh)}
.blk{margin:0}
.row{display:flex;align-items:flex-start;border-radius:6px}
.row.sel{background:var(--sel)}
.bul{flex:none;width:22px;align-self:stretch;position:relative}
.bul::before{content:"";position:absolute;top:calc(var(--fs)*var(--lh)/2 - 3px);inset-inline-start:8px;width:6px;height:6px;border-radius:50%;background:var(--mut);opacity:.55}
.bul.has::before{opacity:1;background:var(--fg)}
.bul.closed::before{box-shadow:0 0 0 4px var(--line)}
.bul.wait::before{animation:bl .6s linear infinite alternate}
@keyframes bl{to{opacity:.2}}
.txt{flex:1;min-width:0;padding:1px 2px;word-break:break-word;white-space:pre-wrap}
.txt.h1{font-size:1.36em;font-weight:700;line-height:1.4}
.txt.h2{font-size:1.2em;font-weight:700;line-height:1.45}
.txt.h3{font-size:1.07em;font-weight:700}
.kids{margin-inline-start:10px;padding-inline-start:2px;border-inline-start:1px solid var(--line)}
.txt strong,.txt em,.txt code,.txt a,.txt mark{unicode-bidi:isolate}
.txt code{background:var(--code);border-radius:4px;padding:0 4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;direction:ltr}
.txt pre{background:var(--code);border-radius:8px;padding:8px 10px;margin:4px 0;overflow-x:auto;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em;line-height:1.5;white-space:pre}
.txt mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
a.pl{color:var(--link);text-decoration:none}
a.pl .br{opacity:.35;font-size:.85em}
a.ext{color:var(--link);text-decoration:underline;word-break:break-all}
.bref{border-bottom:1px dashed var(--mut)}
.pmsg{padding:28px 16px;text-align:center;color:var(--mut);font-size:15px}
.pmsg button{display:inline-block;margin-top:12px;padding:8px 18px;border:1px solid var(--line);border-radius:18px;color:var(--fg)}
.refs{margin-top:22px;border-top:2px solid var(--line);padding-top:6px}
.rh{display:flex;align-items:center;gap:8px;padding:8px 4px;font-size:14px;color:var(--mut);font-weight:600;user-select:none}
.rh .n{background:var(--card);border-radius:10px;padding:0 8px;font-size:12px}
.rg{margin:6px 0 12px}
.rgt{display:block;padding:4px 6px;font-size:.82em;font-weight:700;background:var(--card);border-radius:6px;margin-bottom:2px;unicode-bidi:plaintext}
.selbar{position:fixed;inset-inline:8px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;background:var(--fg);color:var(--bg);border-radius:14px;padding:6px;box-shadow:0 6px 22px rgba(0,0,0,.3);z-index:20}
.selbar button{flex:1;height:42px;border-radius:10px;font-size:14px;font-weight:600;color:inherit}
.selbar button:active{background:rgba(127,127,127,.3)}
.selbar button:disabled{opacity:.35}
.selbar .x{flex:none;width:42px}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;box-shadow:0 5px 16px rgba(0,0,0,.28);z-index:15}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}

/* ---- الخط ---- */
#fontPop{position:fixed;top:calc(56px + env(safe-area-inset-top));inset-inline-end:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:10px;z-index:40;width:236px;user-select:none}
#fontPop .r{display:flex;align-items:center;gap:8px;margin:4px 0}
#fontPop .r span{flex:1;font-size:13px;color:var(--mut)}
#fontPop button{width:44px;height:40px;border:1px solid var(--line);border-radius:10px;font-size:18px;font-weight:700}
#fontPop b{min-width:34px;text-align:center;font-size:14px}
#fontPop .seg{display:flex;flex:2}
#fontPop .seg button{flex:1;width:auto;font-size:12px;font-weight:500;border-radius:0}
#fontPop .seg button:first-child{border-start-start-radius:10px;border-end-start-radius:10px}
#fontPop .seg button:last-child{border-start-end-radius:10px;border-end-end-radius:10px}
#fontPop .seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}

/* ---- الإعدادات ---- */
.set{flex:1;overflow-y:auto;padding:10px 14px 40px}
.set h3{font-size:13px;color:var(--mut);margin:18px 0 6px;font-weight:600}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card .gn{font-weight:700;direction:ltr;text-align:right;unicode-bidi:plaintext}
.card .gs{font-size:12px;color:var(--mut);margin-top:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--bg)}
.btn.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.btn.d{color:var(--danger)}
.f{display:block;margin:10px 0 0;font-size:13px;color:var(--mut)}
.f input[type=text],.f input[type=password],.f select{display:block;width:100%;height:44px;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:16px;color:var(--fg);direction:ltr;text-align:left}
.f select{direction:rtl;text-align:right}
.ck{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.ck input{width:22px;height:22px;accent-color:var(--acc)}
.note{font-size:12px;color:var(--mut);line-height:1.6;margin-top:6px}
#toast{position:fixed;inset-inline:0;bottom:calc(72px + env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:88vw;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;text-align:center}
#toast.show{opacity:.96}

/* ---- إضافات: بحث موحّد، كتابة في الموضع، نسخة محلية ---- */
#sq{font-size:var(--fs)}
.it .pi{flex:none;width:20px;height:20px;color:var(--mut);display:grid;place-items:center}
.it .pi svg{width:17px;height:17px}
.it .pen{flex:none;width:42px;height:38px;border:1px solid var(--acc);color:var(--acc);border-radius:19px;display:grid;place-items:center}
.it .pen svg{width:18px;height:18px}
.it .pen:active{background:var(--sel)}
.it.bk{align-items:flex-start}
.it.bk .t{font-size:calc(var(--fs) - 2px);line-height:1.6}
.it.bk .sn b{background:var(--mark);font-weight:inherit;border-radius:3px}
.it.bk .pg{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.it .dot{flex:none;width:20px;height:1.6em;position:relative}
.it .dot::before{content:"";position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--mut)}
.row.unsent>.txt{opacity:.6}
.row.unsent>.bul::after{content:"";position:absolute;top:calc(var(--fs)*var(--lh)/2 - 6px);inset-inline-start:5px;width:10px;height:10px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:sp .9s linear infinite}
.row.fail>.txt{color:var(--danger)}
@keyframes sp{to{transform:rotate(360deg)}}
.row.tgt{background:var(--sel)}
mark.hit{background:#ffd54a;color:#000;border-radius:3px}
mark.hit.cur{outline:2px solid var(--acc)}
.more{display:block;margin:6px 22px;padding:6px 14px;border:1px solid var(--line);border-radius:16px;font-size:13px;color:var(--mut)}
.comp{margin:4px 0 4px 0;margin-inline-start:22px;border:2px solid var(--acc);border-radius:10px;background:var(--bg)}
.comp textarea{display:block;width:100%;text-align:right;min-height:calc(var(--fs)*var(--lh) + 12px);max-height:46vh;border:0;outline:0;resize:none;background:transparent;padding:6px 8px;font-size:var(--fs);line-height:var(--lh);unicode-bidi:plaintext}
#pEdit{flex:none}
#hitNav{position:fixed;inset-inline-start:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:2px;background:var(--fg);color:var(--bg);border-radius:22px;padding:3px;z-index:18;font-size:13px}
#hitNav button{width:40px;height:38px;color:inherit;font-size:18px}
#hitNav span{min-width:44px;text-align:center}
.selbar button{font-size:13px}
.syncbox{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.hint{display:flex;align-items:center;gap:10px;min-height:0}
.mchip{flex:none;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:15px;font-size:13px;color:var(--mut)}
.mchip.on{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.k svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sg.rf{max-width:82vw;border-radius:10px;unicode-bidi:plaintext}
.sg.rf b{background:var(--mark);font-weight:inherit;border-radius:3px}
.sg.dt{min-width:52px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;height:44px;border-radius:12px}
.sg.dt small{font-size:11px;color:var(--mut)}
.sg.dt.today{border-color:var(--acc);color:var(--acc);font-weight:700}
.selbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.selbar .x.arm{background:var(--danger);color:#fff;width:auto;padding:0 10px}
#dpick{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none}
@font-face{font-family:"Vazirmatn";src:local("Vazirmatn"),url("fonts/Vazirmatn.woff2") format("woff2"),url("fonts/Vazirmatn.ttf") format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:"Noto Naskh Arabic";src:local("Noto Naskh Arabic"),url("fonts/NotoNaskhArabic.woff2") format("woff2"),url("fonts/NotoNaskhArabic.ttf") format("truetype");font-weight:400 700;font-display:swap}
#ta,.body,.comp textarea,#sList{font-family:var(--ff,inherit)}
::highlight(root-matches){color:#DC2626}
</style>

<body>

<!-- ============ البحث الموحّد ============ -->
<div id="search" class="scr" hidden>
  <header class="bar">
    <select id="graphS" class="chip gsel" aria-label="الغراف"></select>
    <input id="sq" type="search" enterkeyhint="search" placeholder="ابحث…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="sWrite" class="ic" aria-label="شاشة الكتابة"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button>
    <button class="ic bSet" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <div id="sInfo" class="hint"><button id="sMode" class="mchip" hidden>مجرّد</button><span id="sMsg"></span></div>
  <div id="sList" class="list"><div id="sPages"></div><div id="sBlocks"></div></div>
</div>

<!-- ============ الكتابة ============ -->
<div id="home" class="scr" hidden>
  <header class="bar">
    <select id="graphC" class="chip gsel" aria-label="الغراف"></select>
    <button id="target" class="chip grow"><b id="targetName">اليوم</b></button>
    <button id="bSearch" class="ic" aria-label="البحث"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="ic bFont" aria-label="حجم الخط">Aa</button>
    <button class="ic bSet" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <textarea id="ta" dir="rtl" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
  <div id="err" hidden><div></div><button id="errX" aria-label="إخفاء">✕</button></div>
  <div id="sugg" class="sugg" hidden></div>
  <div id="keys" class="keys"></div>
</div>

<!-- ============ العرض (صفحة أو كتلة مع أبيها) ============ -->
<div id="page" class="scr" hidden>
  <header class="bar">
    <button class="ic back" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <div id="pTitle" class="ttl"></div>
    <button id="pFold" class="ic" aria-label="طيّ الكل ونشره"><svg viewBox="0 0 24 24"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg></button>
    <button class="ic bFont" aria-label="حجم الخط">Aa</button>
    <button id="pReload" class="ic" aria-label="تحديث"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
  </header>
  <div id="pBody" class="body"><div id="pTree"></div><div id="pRefs"></div></div>
  <div id="pEdit" hidden><div id="psugg" class="sugg" hidden></div><div id="pkeys" class="keys"></div></div>
  <div id="pSel" class="selbar" hidden>
    <button data-a="mom">＋أم</button>
    <button data-a="kid">＋بنت</button>
    <button data-a="sis">＋أخت</button>
    <button data-a="edit" class="x" aria-label="تعديل"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button>
    <button data-a="del" class="x" aria-label="حذف"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
  </div>
  <div id="hitNav" hidden><button data-h="-1" aria-label="السابق">‹</button><span></span><button data-h="1" aria-label="التالي">›</button></div>
  <button id="pAdd" class="fab" aria-label="اكتب في آخر الصفحة"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<script>
"use strict";
/* ============================================================
   أدوات عامة
   ============================================================ */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AR = n => Number(n).toLocaleString("ar-EG");
function norm(s){
  return s.toLowerCase().replace(/[ً-ْٰـ]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي");
}
let toastTimer;
function toast(msg, ms=2400){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms); }
let busyN = 0;
function busy(on){ busyN = Math.max(0, busyN + (on ? 1 : -1)); $("#prog").hidden = busyN === 0; }

/* ---- التاريخ (صفحات Roam اليومية) ---- */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const p2 = n => String(n).padStart(2,"0");
function ord(d){ const r = d%10; if (d>=11 && d<=13) return d+"th"; return d+(r===1?"st":r===2?"nd":r===3?"rd":"th"); }
function dailyTitle(dt=new Date()){ return MONTHS[dt.getMonth()]+" "+ord(dt.getDate())+", "+dt.getFullYear(); }
function dailyUid(dt=new Date()){ return p2(dt.getMonth()+1)+"-"+p2(dt.getDate())+"-"+dt.getFullYear(); }
function dailyUidFromTitle(t){                       // "November 15th, 2026" ← "11-15-2026"
  const m = t.match(/^([A-Z][a-z]+) (\d{1,2})(?:st|nd|rd|th), (\d{4})$/); if (!m) return null;
  const mi = MONTHS.indexOf(m[1]); if (mi < 0) return null;
  return p2(mi+1)+"-"+p2(+m[2])+"-"+m[3];
}
const timeStr = (dt=new Date()) => p2(dt.getHours())+":"+p2(dt.getMinutes());
const isoStr = (dt=new Date()) => dt.getFullYear()+"-"+p2(dt.getMonth()+1)+"-"+p2(dt.getDate());

/* ============================================================
   الإعدادات (مشتركة الصيغة مع نسخة الحاسوب: rq-cfg)
   ============================================================ */
const HEADER_TPL = "[[{date}]] at {time}";
let RAW;
function loadCfg(){
  try { RAW = JSON.parse(store.get("rq-cfg") || "null"); } catch(e){ RAW = null; }
  if (!RAW || typeof RAW !== "object") RAW = {dest:"roam", dir:"rtl", wide:false};
  if (!RAW.roam || !Array.isArray(RAW.roam.graphs)) RAW.roam = {current:"", graphs:[]};
  RAW.roam.graphs = RAW.roam.graphs.filter(g => g && g.name);
  RAW.roam.graphs.forEach(g => { if (g.header == null) g.header = true; if (!g.tpl) g.tpl = HEADER_TPL; if (!g.pageMode) g.pageMode = "today"; });
}
function saveCfg(){
  const c = JSON.parse(JSON.stringify(RAW));
  c.roam.graphs.forEach(g => { if (!g.saveToken) g.token = ""; });      // الرمز لا يُحفظ إلا إن طلبت
  store.set("rq-cfg", JSON.stringify(c));
}
const graphs = () => RAW.roam.graphs;
const G = () => graphs().find(g => g.name === RAW.roam.current) || graphs()[0] || null;

const PREFS = {fs:17, lh:1.7, autoRefs:true, start:"search", defGraph:"", font:"", roots:false};
const FONTS = {"":"", vazir:'"Vazirmatn",system-ui,sans-serif', naskh:'"Noto Naskh Arabic",serif'};
function loadPrefs(){ try { Object.assign(PREFS, JSON.parse(store.get("rqm-prefs") || "{}")); } catch(e){} applyFont(); }
function savePrefs(){ store.set("rqm-prefs", JSON.stringify(PREFS)); }
function applyFont(){
  PREFS.fs = Math.min(28, Math.max(12, +PREFS.fs || 17));
  document.documentElement.style.setProperty("--fs", PREFS.fs+"px");
  document.documentElement.style.setProperty("--lh", PREFS.lh);
  if (FONTS[PREFS.font]) document.documentElement.style.setProperty("--ff", FONTS[PREFS.font]); else document.documentElement.style.removeProperty("--ff");
  $("#fsVal").textContent = AR(PREFS.fs);
  document.querySelectorAll("#fontPop [data-l]").forEach(b => b.classList.toggle("on", +b.dataset.l === +PREFS.lh));
}

/* ---- قائمة الصفحات والأخيرة (لكل غراف) ---- */
let PAGES = [], PAGESN = [];
function loadPages(){
  const g = G(), raw = g ? store.get("rq-pages:"+g.name) : null;
  PAGES = raw ? raw.split("\n").filter(Boolean) : [];
  PAGESN = PAGES.map(norm);
}
function recents(){ const g = G(); if (!g) return []; try { return JSON.parse(store.get("rqm-recent:"+g.name) || "[]"); } catch(e){ return []; } }
function addRecent(title){
  const g = G(); if (!g || !title) return;
  const r = recents().filter(x => x !== title); r.unshift(title);
  store.set("rqm-recent:"+g.name, JSON.stringify(r.slice(0, 14)));
}
function findPages(q, limit=60){
  const nq = norm(q.trim()); if (!nq) return [];
  const r0 = [], r1 = [], r2 = [], r3 = [];
  for (let i=0;i<PAGESN.length;i++){
    const s = PAGESN[i], p = s.indexOf(nq); if (p < 0) continue;
    if (s.length === nq.length) r0.push(i);
    else if (p === 0) r1.push(i);
    else {
      const c = s[p-1];
      if (c==="/" || c===" " || c==="-" || c==="_" || c===":") (p+nq.length === s.length ? r1 : r2).push(i);
      else if (r3.length < limit) r3.push(i);
    }
  }
  const byLen = (a,b) => PAGESN[a].length - PAGESN[b].length;
  return r0.concat(r1.sort(byLen), r2.sort(byLen), r3).slice(0, limit).map(i => PAGES[i]);
}

/* ============================================================
   الاتصال بـ Roam
   ============================================================ */
const API = "https://api.roamresearch.com";
const peers = {};                                    // عنوان الخادم الفعلي لكل غراف (يوفّر تحويلة في كل طلب)
function peerOf(name){ if (!(name in peers)) peers[name] = store.get("rqm-peer:"+name) || ""; return peers[name]; }
function setPeer(name, v){ peers[name] = v || ""; if (v) store.set("rqm-peer:"+name, v); else store.del("rqm-peer:"+name); }

async function roam(kind, body, opt={}){
  const g = opt.graph || G();
  if (!g) throw new Error("أضف غرافاً من الإعدادات أولاً");
  if (!g.token) throw new Error("لا رمز لهذا الغراف — أضفه من الإعدادات");
  const path = "/api/graph/"+encodeURIComponent(g.name)+"/"+kind;
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), opt.timeout || 40000);
  const init = {method:"POST", headers:{"X-Authorization":"Bearer "+g.token, "Content-Type":"application/json"}, body:JSON.stringify(body), signal:ctrl.signal};
  let r, usedPeer = peerOf(g.name);
  busy(true);
  try {
    try { r = await fetch((usedPeer || API)+path, init); }
    catch(e){ if (usedPeer && e.name !== "AbortError"){ setPeer(g.name, ""); usedPeer = ""; r = await fetch(API+path, init); } else throw e; }
    if (usedPeer && !r.ok && ![400,401,403,429].includes(r.status)){   // عنوان محفوظ قديم: أعد عبر العنوان الأصلي
      setPeer(g.name, ""); usedPeer = ""; r = await fetch(API+path, init);
    }
    try { const u = new URL(r.url); if (r.ok && u.origin !== API && u.origin !== usedPeer) setPeer(g.name, u.origin); } catch(e){}
    const text = await r.text();
    if (opt.soft) return {ok:r.ok, status:r.status, text};
    if (!r.ok){
      let m = "خطأ من Roam ("+r.status+")";
      if (r.status === 401 || r.status === 403) m = "الرمز غير صالح أو لا يملك الصلاحية ("+r.status+")";
      else if (r.status === 429) m = "تجاوزت حدّ الطلبات، انتظر قليلاً ثم أعد";
      else if (r.status >= 500) m = "خادم Roam لا يستجيب ("+r.status+")";
      const d = text.replace(/\s+/g," ").slice(0,140);
      throw new Error(m + (d ? " — "+d : ""));
    }
    try { return text ? JSON.parse(text) : {}; } catch(e){ throw new Error("ردّ غير مفهوم من Roam: "+text.slice(0,140)); }
  } catch(e){
    if (e.name === "AbortError") throw new Error("انتهت المهلة — الشبكة بطيئة أو منقطعة");
    if (e instanceof TypeError) throw new Error("تعذّر الاتصال — تحقق من الشبكة");
    throw e;
  } finally { clearTimeout(timer); busy(false); }
}

/* مفاتيح الردّ قد تأتي ":block/uid" أو "block/uid" أو "uid" */
const K = (o,k) => o == null ? undefined : (o[":"+k] !== undefined ? o[":"+k] : (o[k] !== undefined ? o[k] : o[k.split("/")[1]]));
const BP = "[:block/uid :block/string :block/order :block/heading :block/open {:block/children ...}]";
function mkNode(o){
  return Object.assign({uid:null, s:"", order:0, h:0, open:true, parent:null, pn:null, g:null, kids:[], lazy:false, loaded:true, more:false, loc:false}, o);
}
const hasKids = n => n.kids.length > 0 || n.lazy;
function nb(o, pn){                                  // كتلة Roam ← كتلتنا
  const n = mkNode({uid:K(o,"block/uid"), s:K(o,"block/string") || "", order:K(o,"block/order") || 0, h:K(o,"block/heading") || 0,
             open:K(o,"block/open") !== false, parent:pn ? pn.uid : null, pn:pn || null});
  const ch = K(o,"block/children");
  if (Array.isArray(ch)) n.kids = ch.filter(c => K(c,"block/uid")).map(c => nb(c, n)).sort((a,b) => a.order - b.order);
  return n;
}
async function pullPage(title){
  const q = "[:find (pull ?p [:block/uid :node/title {:block/children "+BP+"}]) :in $ ?t :where [?p :node/title ?t]]";
  const res = await roam("q", {query:q, args:[title]});
  const row = res && res.result && res.result[0], o = row && row[0];
  if (!o) return null;
  const root = nb(o, null); root.isPage = true; root.g = root.uid;
  return root;
}
async function pullRefs(title){
  const q = "[:find (pull ?b [:block/uid :block/string :block/heading :block/order :block/children {:block/page [:node/title]}]) :in $ ?t :where [?p :node/title ?t] [?b :block/refs ?p]]";
  const res = await roam("q", {query:q, args:[title]});
  const groups = new Map();
  for (const row of (res.result || [])){
    const o = row[0]; if (!o || !K(o,"block/uid")) continue;
    const pg = K(K(o,"block/page"),"node/title") || "؟";
    if (pg === title) continue;                      // إشارة الصفحة إلى نفسها
    const ch = K(o,"block/children");
    const n = mkNode({uid:K(o,"block/uid"), s:K(o,"block/string") || "", order:K(o,"block/order") || 0, h:K(o,"block/heading") || 0,
               lazy:Array.isArray(ch) && ch.length > 0, loaded:!(Array.isArray(ch) && ch.length > 0)});
    if (!groups.has(pg)) groups.set(pg, []);
    groups.get(pg).push(n);
  }
  const out = [...groups.entries()].map(([page, blocks]) => ({page, blocks:blocks.sort((a,b) => a.order - b.order)}));
  out.sort((a,b) => norm(a.page) < norm(b.page) ? -1 : 1);
  return out;
}
async function pullSubtrees(nodes){                  // يملأ ما تحت كتل المراجع
  const want = nodes.filter(n => n.lazy); if (!want.length) return;
  const q = "[:find (pull ?b "+BP+") :in $ [?u ...] :where [?b :block/uid ?u]]";
  const res = await roam("q", {query:q, args:[want.map(n => n.uid)]});
  const by = new Map(); for (const row of (res.result || [])){ const o = row[0]; if (o) by.set(K(o,"block/uid"), o); }
  for (const n of want){ const o = by.get(n.uid); n.kids = o ? nb(o, null).kids : []; n.kids.forEach(k => { k.pn = n; k.parent = n.uid; }); n.loaded = true; n.lazy = false; }
}
async function pageUid(title, create){
  const res = await roam("q", {query:"[:find ?u :in $ ?t :where [?e :node/title ?t] [?e :block/uid ?u]]", args:[title]});
  let uid = res.result && res.result[0] && res.result[0][0];
  if (!uid && create){
    uid = dailyUidFromTitle(title) || newUid();
    const c = await roam("write", {action:"create-page", page:{title, uid}}, {soft:true});
    if (!c.ok && c.status !== 400) throw new Error("إنشاء الصفحة فشل ("+c.status+"): "+c.text.slice(0,120));
  }
  return uid || null;
}
const UID_CH = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-";
function newUid(){ const a = crypto.getRandomValues(new Uint8Array(9)); return [...a].map(x => UID_CH[x%64]).join(""); }
function toActions(nodes, parent, order, out){
  let k = typeof order === "number" ? order : null;
  for (const n of nodes){
    const uid = newUid(), b = {uid, string:n.string};
    if (n.heading) b.heading = n.heading;
    out.push({action:"create-block", location:{"parent-uid":parent, order:k == null ? "last" : k++}, block:b});
    toActions(n.children, uid, "last", out);
  }
  return out;
}
async function writeBlocks(acts){
  let i = 0, size = 50;
  while (i < acts.length){
    const part = acts.slice(i, i+size);
    const w = await roam("write", {action:"batch-actions", actions:part}, {soft:true});
    if (!w.ok){
      if (w.status === 401 || w.status === 403) throw new Error("الرمز لا يملك صلاحية الكتابة ("+w.status+")");
      if (size > 10){ size = Math.max(10, Math.floor(size/2)); continue; }
      throw new Error("الكتابة فشلت ("+w.status+") بعد "+i+" كتلة: "+w.text.slice(0,120));
    }
    i += part.length;
  }
}
async function fetchPages(){
  const g = G(); if (!g) throw new Error("لا غراف");
  const res = await roam("q", {query:"[:find ?t :where [?e :node/title ?t]]"}, {timeout:90000});
  const list = (res.result || []).map(x => x[0]).filter(Boolean);
  if (!store.set("rq-pages:"+g.name, list.join("\n"))) throw new Error("لم تُحفظ القائمة (مساحة المتصفح ممتلئة)");
  store.set("rqm-pagesAt:"+g.name, String(Date.now()));
  loadPages();
  return list.length;
}

/* ============================================================
   نص الالتقاط ← كتل (كل سطر كتلة، والإزاحة تداخل)
   ============================================================ */
function parseOutline(text){
  const root = {children:[]}, stack = [{lvl:-1, node:root}];
  const lines = text.replace(/\r\n?/g,"\n").split("\n");
  for (let i=0;i<lines.length;i++){
    const raw = lines[i]; if (!raw.trim()) continue;
    const lvl = Math.floor(raw.match(/^[ \t]*/)[0].replace(/\t/g,"  ").length / 2);
    let s = raw.trim(), heading = 0;
    if (/^```/.test(s)){                             // كتلة كود: كتلة واحدة حتى الإغلاق
      const buf = [s]; i++;
      while (i < lines.length){ buf.push(lines[i]); if (/^\s*```\s*$/.test(lines[i])) break; i++; }
      s = buf.join("\n");
    } else {
      s = s.replace(/^[-*•][ \t]+/, "");
      const hm = s.match(/^(#{1,6})[ \t]+(.*)$/);
      if (hm){ heading = Math.min(3, hm[1].length); s = hm[2]; }
    }
    if (!s) continue;
    const node = {string:s, children:[]}; if (heading) node.heading = heading;
    while (stack.length > 1 && stack[stack.length-1].lvl >= lvl) stack.pop();
    stack[stack.length-1].node.children.push(node);
    stack.push({lvl, node});
  }
  return root.children;
}
const countBlocks = list => list.reduce((a,n) => a + 1 + countBlocks(n.children), 0);

/* ============================================================
   العرض: نص Roam ← HTML
   ============================================================ */
const LAT_TOK = "[^\\s\\u0600-\\u06FF]*[A-Za-z0-9][^\\s\\u0600-\\u06FF]*";
const LAT_RUN = new RegExp(LAT_TOK+"(?:[ \\t]+"+LAT_TOK+")*", "g");
function isoTok(s){                                  // عزل الجمل اللاتينية داخل النص العربي لئلا تنقلب
  return s.replace(LAT_RUN, w => { const m = w.match(/^(.*?)([.,;:!?،؛؟]*)$/); return m[1] ? "⁦"+m[1]+"⁩"+m[2] : w; });
}
const PROTECT = /(\[\[[^\[\]\n]+\]\]|\(\([\w-]+\)\)|!?\[[^\[\]\n]*\]\([^)\s]+\)|https?:\/\/[^\s<>]+|\{\{[^{}\n]*\}\})/;
const stripIso = s => s.replace(/[‎⁦-⁩]/g, "");
function pl(t, label, br){
  return '<a class="pl" data-p="'+stripIso(t)+'">'+(br ? '<span class="br">[[</span>' : "")+label+(br ? '<span class="br">]]</span>' : "")+'</a>';
}
function fmt(s){
  let h = esc(s);
  h = h.replace(/!\[([^\[\]\n]*)\]\((https?:[^)\s]+)\)/g, (m,a,u) => '<a class="ext" href="'+u+'" target="_blank" rel="noopener">🖼 '+(a || "صورة")+'</a>');
  h = h.replace(/\[([^\[\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a class="ext" href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/#\[\[([^\[\]\n]+)\]\]/g, (m,t) => pl(t, "#"+t));
  h = h.replace(/\[\[([^\[\]\n]+)\]\]/g, (m,t) => pl(t, t, true));
  h = h.replace(/\(\(([\w-]{6,})\)\)/g, '<span class="bref" data-uid="$1">((…))</span>');
  h = h.replace(/(^|[\s(،؛,;⁦])#([^\s#\[\](){}<>&.,،؛!?:"]+)/g, (m,a,t) => a+pl(t, "#"+t));
  h = h.replace(/(^|\s)(https?:\/\/[^\s<>"]+)/g, '$1<a class="ext" href="$2" target="_blank" rel="noopener">$2</a>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/__([^_\n]+)__/g, "<em>$1</em>");
  h = h.replace(/\^\^([^\^\n]+)\^\^/g, "<mark>$1</mark>");
  h = h.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  h = h.replace(/\{\{(?:\[\[)?TODO(?:\]\])?\}\}/g, "☐").replace(/\{\{(?:\[\[)?DONE(?:\]\])?\}\}/g, "☑");
  h = h.replace(/^([^:\n<>]{1,60})::/, "<strong>$1:</strong>");
  return h;
}
function inl(text){
  if (/^\s*---\s*$/.test(text)) return '<hr>';
  const parts = text.split(/(```[\s\S]*?```)/);
  if (parts.length > 1){
    return parts.map(p => (/^```[\s\S]*```$/.test(p) && p.length >= 6)
      ? '<pre>'+esc(p.replace(/^```[^\n]*\n?/,"").replace(/\n?```$/,""))+'</pre>'
      : (p.trim() ? inl(p) : "")).join("");
  }
  const ar = /[؀-ۿ]/.test(text);
  return text.split(/(`[^`\n]+`)/).map((p,i) => {
    if (i % 2) return "<code>"+esc(p.slice(1,-1))+"</code>";
    if (!ar) return fmt(p);
    return p.split(PROTECT).map((x,j) => fmt(j % 2 ? x : isoTok(x))).join("");
  }).join("").replace(/\n/g, "<br>");
}


/* ============================================================
   النسخة المحلية للغراف (IndexedDB) وفهرس البحث (في عامل خلفي)
   ============================================================ */
/* طيّ الحرف إلى بايت واحد: بلا تشكيل، والهمزات على الألف، واللاتيني صغير. -1 = يُحذف */
function foldCode(c){
  if (c < 128){
    if (c >= 65 && c <= 90) return c + 32;
    if (c === 10 || c === 13 || c === 9) return 32;
    return (c < 32 || c === 127) ? -1 : c;
  }
  if ((c >= 0x64B && c <= 0x65F) || c === 0x670 || c === 0x640 || (c >= 0x6D6 && c <= 0x6ED) ||
      (c >= 0x200B && c <= 0x200F) || (c >= 0x202A && c <= 0x202E) || (c >= 0x2066 && c <= 0x2069) || c === 0xFEFF) return -1;
  if (c === 0x622 || c === 0x623 || c === 0x625 || c === 0x671) return 134;      // ا
  if (c === 0x649 || c === 0x6CC) return 169;                                    // ي
  if (c === 0x6A9) return 162;                                                   // ك
  if (c >= 0x621 && c <= 0x64A) return 128 + (c - 0x621);
  if (c >= 0x660 && c <= 0x669) return 48 + (c - 0x660);
  if (c >= 0x6F0 && c <= 0x6F9) return 48 + (c - 0x6F0);
  if (c === 0x67E) return 180; if (c === 0x686) return 181; if (c === 0x698) return 182; if (c === 0x6AF) return 183;
  if (c === 0x60C) return 44; if (c === 0x61B) return 59; if (c === 0x61F) return 63;
  if (c === 0xA0) return 32; if (c === 0xAB || c === 0xBB) return 34;
  return 127;
}

/* ---- تلوين كلمات الجذر في صفحات «ج/…» فقط ---- */
const ROOTHL = (function(){
  const NAME = "root-matches", PREFIX = "ج/", ARABIC = /[ؠ-ۿ]/;
  if (!window.CSS || !CSS.highlights || typeof Highlight === "undefined") return {set(){}};
  const hl = new Highlight(); CSS.highlights.set(NAME, hl);
  let vars = [], obs = null, timer = 0, pending = new Set(), nodeRanges = new WeakMap();
  function fold(c){
    if ((c >= 0x064B && c <= 0x065F) || c === 0x0670 || c === 0x0640 || (c >= 0x06D6 && c <= 0x06ED)) return 0;
    switch (c){ case 0x0622: case 0x0623: case 0x0625: case 0x0671: return 0x0627; case 0x0624: return 0x0648; case 0x0626: return 0x064A; }
    return c;
  }
  const isWord = c => (c >= 0x0610 && c <= 0x061A) || (c >= 0x0620 && c <= 0x065F) || c === 0x0670 || (c >= 0x066E && c <= 0x06D3) || (c >= 0x06D5 && c <= 0x06ED) || (c >= 0x06FA && c <= 0x06FF);
  function proc(node){
    const old = nodeRanges.get(node); if (old){ for (const r of old) hl.delete(r); nodeRanges.delete(node); }
    if (!vars.length || !node.isConnected) return;
    const text = node.nodeValue; if (!text || text.length < 2 || !ARABIC.test(text)) return;
    const par = node.parentElement; if (!par || par.tagName === "TEXTAREA" || par.closest("code,pre,textarea")) return;
    const n = text.length, nv = vars.length, ks = new Array(nv); let ranges = null, i = 0;
    while (i < n){
      while (i < n && !isWord(text.charCodeAt(i))) i++;
      if (i >= n) break;
      const start = i; ks.fill(0);
      while (i < n){ const c = text.charCodeAt(i); if (!isWord(c)) break; const f = fold(c);
        if (f) for (let v=0; v<nv; v++){ const a = vars[v]; if (ks[v] < a.length && f === a[ks[v]]) ks[v]++; }
        i++; }
      let hit = false; for (let v=0; v<nv; v++) if (ks[v] === vars[v].length){ hit = true; break; }
      if (hit){ const r = new Range(); r.setStart(node, start); r.setEnd(node, i); hl.add(r); (ranges || (ranges = [])).push(r); }
    }
    if (ranges) nodeRanges.set(node, ranges);
  }
  function collect(c){
    if (!c) return;
    if (c.nodeType === 3){ if (ARABIC.test(c.nodeValue)) pending.add(c); return; }
    if (c.nodeType !== 1 && c.nodeType !== 11) return;
    const w = document.createTreeWalker(c, NodeFilter.SHOW_TEXT); for (let x; (x = w.nextNode());) if (ARABIC.test(x.nodeValue)) pending.add(x);
  }
  function run(){
    timer = 0; const t0 = performance.now(), it = pending.values();
    for (let x = it.next(); !x.done; x = it.next()){ pending.delete(x.value); proc(x.value); if (performance.now() - t0 > 8) break; }
    if (pending.size) timer = setTimeout(run, 16);
    else if (hl.size > 4000){ const dead = []; for (const r of hl) if (r.collapsed || !r.startContainer.isConnected) dead.push(r); for (const r of dead) hl.delete(r); }
  }
  const kick = () => { if (!timer && pending.size) timer = setTimeout(run, 60); };
  return {set(title, host, on){                         // عنوان الصفحة، والعنصر الذي يُلوَّن ما بداخله
    if (obs){ obs.disconnect(); obs = null; } clearTimeout(timer); timer = 0; pending.clear(); hl.clear(); vars = [];
    if (!on || !host || !title || !title.startsWith(PREFIX)) return;
    let r = ""; for (const ch of title.slice(PREFIX.length).trim()){ const f = fold(ch.charCodeAt(0)); if (f && isWord(f)) r += String.fromCharCode(f); }
    if (r.length === 3 && r[1] === r[2]) r = r.slice(0, 2);          // المضعّف: بالحرفين الأولين
    if (r.length < 2) return;
    const list = [r]; if (r.length >= 3 && "ويا".includes(r[0])) list.push(r.slice(1));   // المعتلّ الأول: وصف ← صفة
    vars = list.map(x => Array.from(x, ch => ch.charCodeAt(0)));
    collect(host); kick();
    obs = new MutationObserver(recs => { for (const m of recs){ if (m.type === "characterData") pending.add(m.target); else for (const a of m.addedNodes) collect(a); } kick(); });
    obs.observe(host, {childList:true, subtree:true, characterData:true});
  }};
})();

const Q_BATCH = "[:find ?pu (pull ?b [:block/uid :block/string :block/order :block/heading :block/open]) :in $ [?u ...] :where [?b :block/uid ?u] [?par :block/children ?b] [?par :block/uid ?pu]]";
async function syncGraph(full, scope){               // scope: معرّف صفحة لمزامنتها وحدها
  const g = G(); if (!g || SYNC.running) return;
  if (!g.token){ toast("أضف رمز الغراف أولاً"); return; }
  SYNC.running = true; SYNC.stop = false; const t0 = Date.now(); let lastReq = 0, fetched = 0;
  const paced = async (q, args, timeout) => {                       // لا نتجاوز حدّ الطلبات في الدقيقة
    for (let tries = 0;; tries++){
      const wait = 1300 - (Date.now() - lastReq); if (wait > 0) await sleep(wait); lastReq = Date.now();
      let r; try { r = await roam("q", args ? {query:q, args} : {query:q}, {graph:g, soft:true, timeout:timeout || 120000}); }
      catch(e){ if (tries >= 3) throw e; syncMsg("انقطاع، يعيد المحاولة…"); await sleep(4000); continue; }
      if (r.status === 429){ if (tries >= 8) throw new Error("حدّ الطلبات — أعد لاحقاً، وسيُستأنف من حيث توقف"); syncMsg("حدّ الطلبات؛ ينتظر قليلاً…"); await sleep(20000); continue; }
      if (r.status === 401 || r.status === 403) throw new Error("الرمز غير صالح ("+r.status+")");
      return r;
    }
  };
  const parse = r => { try { return JSON.parse(r.text).result || []; } catch(e){ throw new Error("ردّ غير مفهوم من Roam"); } };
  try {
    const first = !isLocal(g.name); if (first){ full = true; scope = null; } if (scope) full = false;
    await openLocal();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    let r;
    if (!scope){
    syncMsg("يجلب أسماء الصفحات…");
    r = await paced(Q_PAGES); if (!r.ok) throw new Error("جلب الصفحات فشل ("+r.status+")");
    const pages = parse(r).filter(x => x[0] && x[1]);
    { const t = DB.transaction("pages", "readwrite"), P = t.objectStore("pages"); P.clear(); for (const x of pages) P.put({u:x[0], t:x[1]}); await txDone(t); }
    PT.clear(); for (const x of pages) PT.set(x[0], x[1]);
    store.set("rq-pages:"+g.name, pages.map(x => x[1]).join("\n")); store.set("rqm-pagesAt:"+g.name, String(Date.now())); loadPages();

    }
    let need = [], pmap = null; SYNC.stats = null;
    if (full || scope){
      let rows, only = null;
      if (scope){                                    // صفحة واحدة: تحقّق مما عندنا منها (حُذف؟ نُقل؟ تغيّر طوله؟)
        syncMsg("يزامن الصفحة…"); only = await W("pageUids", {g:scope}); rows = [];
        for (let k = 0; k < only.length; k += 800){ r = await paced(Q_CHECK, [only.slice(k, k + 800)]); if (!r.ok) throw new Error("مزامنة الصفحة فشلت ("+r.status+")"); rows = rows.concat(parse(r)); }
      } else {
        syncMsg("يجلب فهرس الكتل…");
        r = await paced(Q_MAN, null, 180000);
        if (r.ok) rows = parse(r);
        else { r = await paced(Q_MAN2, null, 180000); if (!r.ok) throw new Error("جلب فهرس الكتل فشل ("+r.status+")"); rows = parse(r).map(x => [x[0], null, x[1], x[2]]); }
        pmap = new Map(); for (const x of rows) pmap.set(x[0], x[2]);
        syncMsg("يقارن بما على الجهاز…");
      }
      const d = await W("diff", {rows, keep:[...PEND], only});
      SYNC.stats = d.stats;
      if (d.del.length || d.moved.length){
        const t = DB.transaction(["blocks","tree"], "readwrite"), B = t.objectStore("blocks"), T = t.objectStore("tree");
        for (const u of d.del){ B.delete(u); T.delete(u); }
        for (const m of d.moved) T.put({u:m[0], p:m[1], o:m[2]});
        await txDone(t);
      }
      need = d.fetch;
    }
    if (!full){
      const since = (await kvGet("since")) || 0;
      r = await paced(Q_CHANGED, [since]); if (!r.ok) throw new Error("جلب التغييرات فشل ("+r.status+")");
      const have = new Set(need.map(x => x[0])); for (const x of parse(r)) if (!have.has(x[0])) need.push([x[0], null]);
    }
    const total = need.length, queue = [];
    { let cur = [], size = 0;
      for (const [u, n] of need){ const len = n == null ? 800 : n;
        if (cur.length && (cur.length >= 800 || size + len > 1200000)){ queue.push(cur); cur = []; size = 0; }
        cur.push(u); size += len; }
      if (cur.length) queue.push(cur); }
    SYNC.missing = [];
    let skipped = 0, nb = 0; const nmap = new Map(need), missing = [];
    const pageOf = async recs => {                    // صفحة كل كتلة: بالصعود في الآباء حتى معرّف صفحة
      const local = new Map(recs.map(x => [x.u, x.p])), ask = [];
      for (const x of recs){ let y = x.p, k = 0;
        while (!PT.has(y) && k++ < 500){ const nx = pmap && pmap.has(y) ? pmap.get(y) : local.get(y); if (nx === undefined) break; y = nx; }
        if (PT.has(y)) x.g = y; else { x._y = y; ask.push(x); } }
      if (ask.length){ const res = await W("gof", {uids:ask.map(x => x._y)}); ask.forEach((x, k) => { x.g = PT.has(res[k]) ? res[k] : ""; delete x._y; }); }
    };
    while (queue.length){
      if (SYNC.stop) throw new Error("أُوقف — يُستأنف من حيث توقف عند الطلب التالي");
      syncMsg("ينزّل الكتل: " + AR(fetched) + " من " + AR(total) + (total ? " (" + AR(Math.floor(fetched * 100 / total)) + "٪)" : ""));
      const batch = queue.shift();
      r = await paced(Q_BATCH, [batch]);
      if (!r.ok){
        if (batch.length > 1){ const h = batch.length >> 1; queue.unshift(batch.slice(0, h), batch.slice(h)); continue; }
        skipped++; fetched++; continue;
      }
      const recs = [];
      for (const row of parse(r)){ const o = row[1]; if (!o) continue; const u = K(o,"block/uid"); if (!u) continue;
        const rec = {u, s:K(o,"block/string") || "", p:row[0], g:"", o:K(o,"block/order") || 0}; if (nmap.get(u) != null) rec.n = nmap.get(u);
        const h = K(o,"block/heading"); if (h) rec.h = h; if (K(o,"block/open") === false) rec.c = 1; recs.push(rec); }
      if (recs.length){ await pageOf(recs); await lPutRecs(recs, true); }
      const got = new Set(recs.map(x => x.u)), miss = batch.filter(u => !got.has(u));      // الخادم قد يقتطع الردّ: أعد طلب ما لم يرجع
      if (miss.length && recs.length && miss.length < batch.length){ const h = Math.ceil(miss.length / 2); queue.unshift(miss.slice(0, h)); if (miss.length > h) queue.unshift(miss.slice(h)); }
      else if (miss.length){ skipped += miss.length; if (missing.length < 20) missing.push(...miss.slice(0, 5)); }
      fetched += batch.length - (miss.length && recs.length && miss.length < batch.length ? miss.length : 0);
      if (++nb % 25 === 0) await W("persist");
    }
    SYNC.missing = missing;
    syncMsg("يحفظ الفهرس…");
    await W("persist");
    if (!scope){ await kvSet("since", t0 - 600000); if (full){ await kvSet("fullAt", t0); store.set("rqm-fullv:"+g.name, "3"); }
      store.set("rqm-local:"+g.name, "1"); store.set("rqm-syncAt:"+g.name, String(Date.now())); }
    if (G() === g) LOC = true;
    const st = await W("stats");
    syncMsg("تمّت ✓ " + AR(st.n) + " كتلة · " + AR(Math.round((Date.now() - t0) / 1000)) + " ث" + (total ? " · جُلب " + AR(total) : "") + (skipped ? " · لم يرجع من الخادم " + AR(skipped) : "") + (SYNC.stats && full ? " · في الخادم " + AR(SYNC.stats.uniq) + " (جديد " + AR(SYNC.stats.fresh) + "، متغيّر " + AR(SYNC.stats.mism) + ")" : ""));
    pageCache.clear();
    return true;
  } catch(e){ syncMsg("توقف: " + e.message); return false; }
  finally { SYNC.running = false; if (ROUTE.name === "settings") renderSettings(); if (ROUTE.name === "search") drawSearch(); }
}
async function diagnose(){
  const g = G(), out = [];
  const q = async (query, args) => { try { await sleep(1300); const r = await roam("q", args ? {query, args} : {query}, {graph:g, timeout:120000}); return r.result; } catch(e){ return "ERR " + e.message; } };
  out.push("strings: " + JSON.stringify(await q("[:find (count ?b) . :where [?b :block/string]]")));
  out.push("with page: " + JSON.stringify(await q("[:find (count ?b) . :where [?b :block/string] [?b :block/page]]")));
  out.push("with parent: " + JSON.stringify(await q("[:find (count ?b) . :where [?b :block/string] [?p :block/children ?b]]")));
  out.push("with uid: " + JSON.stringify(await q("[:find (count ?b) . :where [?b :block/string] [?b :block/uid]]")));
  out.push("pages: " + JSON.stringify(await q("[:find (count ?b) . :where [?b :node/title]]")));
  try { out.push("local: " + JSON.stringify(await W("stats")) + " last: " + JSON.stringify(SYNC.stats || null)); } catch(e){}
  const miss = (SYNC.missing || []).slice(0, 3); out.push("missing: " + JSON.stringify(miss));
  if (miss.length){
    const cut = (k, v) => typeof v === "string" && v.length > 60 ? v.slice(0, 60) + "…" : v;
    out.push("pull: " + JSON.stringify(await q("[:find (pull ?b [*]) :in $ [?u ...] :where [?b :block/uid ?u]]", [miss]), cut).slice(0, 2500));
    out.push("parent: " + JSON.stringify(await q("[:find ?u ?pu :in $ [?u ...] :where [?b :block/uid ?u] [?par :block/children ?b] [?par :block/uid ?pu]]", [miss])));
  }
  return out.join("\n");
}

/* ============================================================
   طابور الإرسال: ما يُكتب يظهر فوراً ويُرسل في الخلفية
   ============================================================ */
let QUEUE = []; const PEND = new Set(); let flushing = false;
const qKey = () => "rqm-queue:" + (G() ? G().name : "");
function loadQueue(){ try { QUEUE = JSON.parse(store.get(qKey()) || "[]"); } catch(e){ QUEUE = []; } PEND.clear(); for (const it of QUEUE) for (const u of it.uids || []) PEND.add(u); }
function saveQueue(){ store.set(qKey(), JSON.stringify(QUEUE)); }
function enqueue(body, uids){ QUEUE.push({id:newUid(), body, uids:uids || [], tries:0}); for (const u of uids || []) PEND.add(u); saveQueue(); flush(); }
function markRows(uids, cls, on){ for (const u of uids) document.querySelectorAll('.blk[data-u="'+u+'"] > .row').forEach(r => r.classList.toggle(cls, on)); }
async function flush(){
  if (flushing || !QUEUE.length) return; flushing = true; const g = G(), key = qKey();
  try {
    while (QUEUE.length && G() === g){
      const it = QUEUE[0]; let r;
      try { r = await roam("write", it.body, {graph:g, soft:true, timeout:30000}); }
      catch(e){ it.tries++; saveQueue(); break; }
      if (!r.ok){
        const benign = r.status === 400 && (it.tries > 0 || it.body.action === "create-page");
        if (!benign && r.status === 400){ markRows(it.uids, "fail", true); toast("رفض Roam كتابةً: " + r.text.replace(/\s+/g," ").slice(0, 90), 5000); }
        else if (!benign){ it.tries++; saveQueue(); break; }
      }
      QUEUE.shift(); for (const u of it.uids) PEND.delete(u); markRows(it.uids, "unsent", false);
      store.set(key, JSON.stringify(QUEUE));
    }
  } finally { flushing = false; }
}
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ flush(); } });

/* خطة إضافة: كتل النص ← أوامر Roam + سجلات محلية + كتل للعرض */
function plan(blocks, pn, parentUid, pageUid, base, numeric){
  const acts = [], recs = [], tops = [];
  (function walk(list, pu, pnode, start, num, top){
    list.forEach((b, i) => {
      const uid = newUid(), o = start + i;
      const node = mkNode({uid, s:b.string, order:o, h:b.heading || 0, parent:pu, pn:pnode, g:pageUid, loc:LOC, _open:b.children.length > 0});
      const blk = {uid, string:b.string}; if (b.heading) blk.heading = b.heading;
      acts.push({action:"create-block", location:{"parent-uid":pu, order:num ? o : "last"}, block:blk});
      const rec = {u:uid, s:b.string, p:pu, g:pageUid, o}; if (b.heading) rec.h = b.heading; recs.push(rec);
      if (top) tops.push(node); else pnode.kids.push(node);
      walk(b.children, uid, node, 0, false, false);
    });
  })(blocks, parentUid, pn, base, numeric, true);
  return {acts, recs, tops};
}

const SCREENS = ["search","home","page","settings"];
let ROUTE = {name:""}, PREV = "";
const startHash = () => PREFS.start === "write" ? "c" : "s";
function parseHash(){
  const h = location.hash.slice(1);
  if (h === "s") return {name:"search"};
  if (h === "c") return {name:"home"};
  if (h === "set") return {name:"settings"};
  if (h.startsWith("p=")){ let t = h.slice(2); try { t = decodeURIComponent(t); } catch(e){} return {name:"page", kind:"page", title:t === "@today" ? dailyTitle() : t}; }
  if (h.startsWith("b=")){ const m = h.slice(2).split("&q="); let q = m[1] || ""; try { q = decodeURIComponent(q); } catch(e){}
    const words = m[0].endsWith("&m=2"); return {name:"page", kind:"block", uid:words ? m[0].slice(0, -4) : m[0], q:words ? q.split(" ") : q}; }
  return {name:""};
}
const depth = () => (history.state && history.state.d) || 0;
function go(h){ if (location.hash.slice(1) !== h) history.pushState({d:depth()+1}, "", "#"+h); route(); }
function goReplace(h){ history.replaceState(history.state, "", (h ? "#"+h : location.pathname + location.search)); route(); }
function back(){ if (depth() > 0) history.back(); else goReplace(startHash()); }
const pageHash = t => "p="+encodeURIComponent(t);
function route(){
  leavePage();
  PREV = ROUTE.name; ROUTE = parseHash();
  $("#fontPop").hidden = true;
  if (!G() && ROUTE.name !== "settings"){ goReplace("set"); return; }
  if (!ROUTE.name){ goReplace(startHash()); return; }
  SCREENS.forEach(s => $("#"+s).hidden = s !== ROUTE.name);
  if (ROUTE.name === "home") enterHome();
  else if (ROUTE.name === "search") enterSearch();
  else if (ROUTE.name === "page") enterView();
  else if (ROUTE.name === "settings") renderSettings();
}

function ins(text, selStart, selEnd){
  const ta = ED.ta; ta.focus();
  if (selStart != null) ta.setSelectionRange(selStart, selEnd == null ? selStart : selEnd);
  let ok = false; try { ok = document.execCommand("insertText", false, text); } catch(e){}
  if (!ok){ const s = ta.selectionStart; ta.setRangeText(text, s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input", {bubbles:true})); }
}
function wrapPair(open, close){
  const ta = ED.ta, s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
  ins(open + sel + close);
  const p = sel ? s + open.length + sel.length + close.length : s + open.length;
  ta.setSelectionRange(p, p);
}
function shiftLines(dir){                            // أدخِل / أخرِج: مسافتان في أول السطر
  const ta = ED.ta, v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const ls = v.lastIndexOf("\n", s-1) + 1; let le = v.indexOf("\n", Math.max(e, ls)); if (le < 0) le = v.length;
  const lines = v.slice(ls, le).split("\n"); let d0 = 0, dAll = 0;
  const out = lines.map((ln, i) => {
    if (dir > 0){ if (i === 0) d0 = 2; dAll += 2; return "  " + ln; }
    const m = ln.match(/^( {1,2}|\t)/); const k = m ? m[0].length : 0; if (i === 0) d0 = -k; dAll -= k; return ln.slice(k);
  }).join("\n");
  if (dAll === 0) return;
  ins(out, ls, le);
  const ns = Math.max(ls, s + d0), ne = Math.max(ns, e + dAll);
  ta.setSelectionRange(ns, s === e ? ns : ne);
}

function caretCtx(){
  const ta = ED.ta, c = ta.selectionStart; if (c !== ta.selectionEnd) return null;
  const before = ta.value.slice(0, c), ls = before.lastIndexOf("\n") + 1, line = before.slice(ls);

async function loadRefs(c, seq){

    drawRefs();

function markMatches(root, q){                        // ظلّل مواضع العبارة (أو الكلمات) داخل نص الكتلة، بتجاهل التشكيل
  const terms = (Array.isArray(q) ? q : [q.trim()]).map(foldStr).filter(t => t.length); if (!terms.length) return [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [], offs = [], bytes = []; let t;
  while ((t = w.nextNode())){ const s = t.nodeValue; for (let i=0;i<s.length;i++){ const b = foldCode(s.charCodeAt(i)); if (b >= 0){ bytes.push(b); nodes.push(t); offs.push(i); } } }
  let all = [];
  for (const qb of terms){ const n = qb.length; for (let i=0; i + n <= bytes.length; i++){ let k = 0; while (k < n && bytes[i+k] === qb[k]) k++; if (k === n){ all.push([i, n]); i += n - 1; } } }
  all.sort((a, b) => a[0] - b[0]); const fl = []; let endAt = 0;
  for (const x of all) if (x[0] >= endAt){ fl.push(x); endAt = x[0] + x[1]; }
  const found = fl.map(x => x[0]), lens = fl.map(x => x[1]);
  for (let f = found.length - 1; f >= 0; f--){
    let z = found[f] + lens[f] - 1;
    while (z >= found[f]){
      let a = z; while (a > found[f] && nodes[a-1] === nodes[z]) a--;
      const r = document.createRange(); r.setStart(nodes[z], offs[a]); r.setEnd(nodes[z], offs[z] + 1);
      const m = document.createElement("mark"); m.className = "hit"; if (a === found[f]) m.dataset.first = "1";
      try { r.surroundContents(m); } catch(e){}
      z = a - 1;
    }
  }
  return [...root.querySelectorAll('mark.hit[data-first]')];
}

}

   حجم الخط والتباعد
   ============================================================ */
const fontPop = $("#fontPop");
document.querySelectorAll(".bFont").forEach(b => { b.addEventListener("mousedown", e => e.preventDefault()); b.onclick = e => { e.stopPropagation(); fontPop.hidden = !fontPop.hidden; }; });
fontPop.addEventListener("mousedown", e => e.preventDefault());
fontPop.addEventListener("click", e => {
  e.stopPropagation();
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.f) PREFS.fs = (+PREFS.fs || 17) + (b.dataset.f === "+" ? 1 : -1);
  if (b.dataset.l) PREFS.lh = +b.dataset.l;
  applyFont(); savePrefs();
});
document.addEventListener("click", () => { fontPop.hidden = true; });

/* ============================================================
   الإعدادات
   ============================================================ */
let editing = null;                                  // اسم الغراف قيد التعديل، أو "" لجديد
function renderSettings(){
  const box = $("#setBody"); box.innerHTML = "";
  const h3 = t => box.appendChild(el("h3", "", t));
  if (!graphs().length && editing == null) editing = "";
  h3("الغرافات");
  for (const g of graphs()){
    if (editing === g.name){ box.appendChild(graphForm(g)); continue; }
    const c = el("div", "card"), n = store.get("rq-pages:"+g.name), cur = G() === g;
    c.innerHTML = '<div class="gn"></div><div class="gs"></div>';
    c.firstElementChild.textContent = g.name + (cur && graphs().length > 1 ? "  ●" : "");
    c.children[1].textContent = (g.token ? "الرمز موجود" : "بلا رمز") + " · " + (n ? AR(n.split("\n").length)+" صفحة" : "لم تُجلب صفحاته") + " · " + (g.header ? "ترويسة" : "بلا ترويسة") + (isLocal(g.name) ? " · نسخة محلية" : "");
    const bt = el("div", "btns"), e1 = el("button", "btn"); e1.textContent = "تعديل"; e1.onclick = () => { editing = g.name; renderSettings(); };
    bt.appendChild(e1);
    if (!cur){ const u = el("button", "btn"); u.textContent = "استعمله"; u.onclick = () => { useGraph(g.name, true); renderSettings(); }; bt.appendChild(u); }
    c.appendChild(bt);
    if (cur) c.appendChild(localBox(g));
    box.appendChild(c);
  }
  if (editing === "") box.appendChild(graphForm(null));
  else { const add = el("button", "btn"); add.textContent = "＋ إضافة غراف"; add.onclick = () => { editing = ""; renderSettings(); }; box.appendChild(add); }

  h3("عند فتح التطبيق");
  const sel = (label, opts, val, on) => { const l = el("label", "f"), s = el("select"); opts.forEach(o => { const x = el("option"); x.value = o[0]; x.textContent = o[1]; s.appendChild(x); }); s.value = val; s.onchange = () => on(s.value); l.append(label, s); box.appendChild(l); };
  sel("الشاشة الأولى ومكان المؤشر", [["search","البحث (المؤشر في خانة البحث)"],["write","الكتابة (المؤشر في صندوق الكتابة)"]], PREFS.start === "write" ? "write" : "search", v => { PREFS.start = v; savePrefs(); });
  sel("الغراف الافتراضي", [["","بلا افتراضي — آخر غراف استعملته"]].concat(graphs().map(g => [g.name, g.name])), graphs().some(g => g.name === PREFS.defGraph) ? PREFS.defGraph : "", v => { PREFS.defGraph = v; savePrefs(); });

  h3("العرض");
  sel("الخط", [["","خط النظام"],["vazir","Vazirmatn"],["naskh","Noto Naskh Arabic"]], FONTS[PREFS.font] ? PREFS.font : "", v => { PREFS.font = v; savePrefs(); applyFont(); });
  { const ckr = el("label", "ck"), cbr = el("input"); cbr.type = "checkbox"; cbr.checked = !!PREFS.roots; cbr.onchange = () => { PREFS.roots = cbr.checked; savePrefs(); }; ckr.append(cbr, "تلوين كلمات الجذر في صفحات الجذور (ج/…)"); box.appendChild(ckr); }
  h3("القراءة");
  const ck = el("label", "ck"), cb = el("input"); cb.type = "checkbox"; cb.checked = !!PREFS.autoRefs;
  cb.onchange = () => { PREFS.autoRefs = cb.checked; savePrefs(); };
  ck.append(cb, "جلب المراجع المرتبطة تلقائياً (للغراف غير المحمَّل)");
  box.appendChild(ck);
  box.appendChild(el("div", "note", "حجم الخط والتباعد من زر <b>Aa</b> في شاشتي الكتابة والعرض."));

  h3("عن التطبيق");
  box.appendChild(el("div", "note", "الرمز والنسخة المحلية يُحفظان في متصفح هذا الجهاز وحده، بلا تشفير، ولا يُرسل شيء إلا إلى خادم Roam. ما تكتبه يظهر فوراً ويُرسل في الخلفية؛ وما لم يصل بعدُ يبقى معلَّماً ويُعاد إرساله تلقائياً."));
}
function localBox(g){
  const b = el("div", "syncbox"), msg = el("div", "note"); msg.id = "syncMsg"; const bt = el("div", "btns");
  const btn = (t, cls, fn) => { const x = el("button", "btn" + (cls ? " "+cls : "")); x.textContent = t; x.onclick = fn; bt.appendChild(x); return x; };
  const loc = isLocal(g.name), at = +store.get("rqm-syncAt:"+g.name) || 0;
  if (SYNC.running){ msg.textContent = SYNC.msg; btn("إيقاف", "d", () => { SYNC.stop = true; }); }
  else {
    msg.textContent = SYNC.msg || (loc ? "نسخة محلية كاملة على هذا الجهاز" + (at ? " · آخر مزامنة " + new Date(at).toLocaleString("ar-EG", {dateStyle:"short", timeStyle:"short"}) : "") : "لا نسخة محلية. تحميل الغراف يتيح البحث الحي داخل النصوص، وفتح الصفحات فوراً وبلا شبكة.");
    if (!loc) btn("تحميل الغراف إلى الجهاز", "p", () => { syncGraph(true); renderSettings(); });
    else {
      btn("مزامنة", "p", () => { syncGraph(false); renderSettings(); });
      btn("مزامنة كاملة", "", () => { syncGraph(true); renderSettings(); });
      const d = btn("حذف النسخة", "d", async () => { if (d.dataset.arm !== "1"){ d.dataset.arm = "1"; d.textContent = "اضغط ثانية للتأكيد"; setTimeout(() => { d.dataset.arm = ""; d.textContent = "حذف النسخة"; }, 2500); return; } await dropLocal(); SYNC.msg = ""; renderSettings(); });
      W("stats").then(s => { if (!SYNC.running && !SYNC.msg && msg.isConnected && s.n) msg.textContent += " · " + AR(s.n) + " كتلة · فهرس البحث " + AR(Math.round(s.bytes / 1048576)) + " م.ب"; }).catch(() => {});
    }
    if (loc) btn("تشخيص", async () => { msg.textContent = "يشخّص…"; const t = await diagnose(); const a = el("textarea"); a.readOnly = true; a.value = t; a.style.cssText = "width:100%;height:160px;direction:ltr;font-size:11px"; b.appendChild(a); msg.textContent = "انسخ النص التالي وأرسله:"; });
    if (QUEUE.length){ const q = el("div", "note"); q.textContent = "في انتظار الإرسال: " + AR(QUEUE.length); b.appendChild(q); btn("أرسل الآن", "", () => flush()); }
    if (!loc) btn(refreshing ? "يجلب…" : "تحديث أسماء الصفحات فقط", "", () => { refreshPages(false); renderSettings(); });
  }
  b.prepend(msg); b.appendChild(bt); return b;
}
function graphForm(g){
  const c = el("div", "card"), isNew = !g;
  const f = (label, input) => { const l = el("label", "f"); l.append(label, input); c.appendChild(l); return input; };
  const name = f("اسم الغراف (كما في عنوان Roam)", Object.assign(el("input"), {type:"text", value:g ? g.name : "", autocapitalize:"off", autocomplete:"off", spellcheck:false}));
  const tok = f("الرمز (API token)", Object.assign(el("input"), {type:"password", value:g ? (g.token || "") : "", autocomplete:"off"}));
  const show = el("label", "ck"), sh = el("input"); sh.type = "checkbox"; sh.onchange = () => tok.type = sh.checked ? "text" : "password"; show.append(sh, "إظهار الرمز"); c.appendChild(show);
  const sv = el("label", "ck"), svc = el("input"); svc.type = "checkbox"; svc.checked = g ? !!g.saveToken : true; sv.append(svc, "حفظ الرمز على هذا الجهاز"); c.appendChild(sv);
  const hd = el("label", "ck"), hdc = el("input"); hdc.type = "checkbox"; hdc.checked = g ? !!g.header : true; hd.append(hdc, "ترويسة فوق كل إدخال من شاشة الكتابة"); c.appendChild(hd);
  const tpl = f("نص الترويسة ({date} التاريخ، {time} الوقت)", Object.assign(el("input"), {type:"text", value:g ? (g.tpl || HEADER_TPL) : HEADER_TPL}));
  const md = el("select"); md.innerHTML = '<option value="today">صفحة اليوم دائماً</option><option value="last">آخر صفحة كتبت فيها</option>'; md.value = g ? (g.pageMode || "today") : "today";
  f("وجهة شاشة الكتابة عند الفتح", md);
  const bt = el("div", "btns");
  const save = el("button", "btn p"); save.textContent = "حفظ";
  const test = el("button", "btn"); test.textContent = "اختبار الاتصال";
  const cancel = el("button", "btn"); cancel.textContent = "إلغاء";
  bt.append(save, test); if (graphs().length || !isNew) bt.appendChild(cancel);
  if (!isNew){ const del = el("button", "btn d"); del.textContent = "حذف";
    del.onclick = () => { if (del.dataset.arm !== "1"){ del.dataset.arm = "1"; del.textContent = "اضغط ثانية للتأكيد"; setTimeout(() => { del.dataset.arm = ""; del.textContent = "حذف"; }, 2500); return; }
      RAW.roam.graphs = graphs().filter(x => x !== g); if (RAW.roam.current === g.name) RAW.roam.current = graphs()[0] ? graphs()[0].name : "";
      saveCfg(); editing = null; if (G()) useGraph(G().name, true); renderSettings(); };
    bt.appendChild(del); }
  c.appendChild(bt);
  const out = el("div", "note"); c.appendChild(out);
  const read = () => ({name:name.value.trim(), token:tok.value.trim(), saveToken:svc.checked, header:hdc.checked, tpl:tpl.value.trim() || HEADER_TPL, pageMode:md.value});
  save.onclick = () => {
    const v = read();
    if (!v.name){ out.textContent = "اكتب اسم الغراف."; return; }
    if (graphs().some(x => x !== g && x.name === v.name)){ out.textContent = "يوجد غراف بهذا الاسم."; return; }
    if (g){ const was = g.name; Object.assign(g, v); if (RAW.roam.current === was) RAW.roam.current = v.name; }
    else { graphs().push(Object.assign({lastPage:{kind:"today", title:""}}, v)); if (!RAW.roam.current || graphs().length === 1) RAW.roam.current = v.name; }
    saveCfg(); editing = null; useGraph(G().name, true); renderSettings(); toast("حُفظ");
    if (v.token && !store.get("rq-pages:"+v.name) && G() && G().name === v.name) refreshPages(true);
  };
  test.onclick = async () => {
    const v = read(); if (!v.name || !v.token){ out.textContent = "اكتب الاسم والرمز أولاً."; return; }
    out.textContent = "يتصل…";
    try { const r = await roam("q", {query:"[:find (count ?e) . :where [?e :node/title]]"}, {graph:v});
      out.textContent = "نجح الاتصال ✓ — عدد الصفحات: " + AR(r.result || 0); }
    catch(e){ out.textContent = "فشل: " + e.message; }
  };
  cancel.onclick = () => { editing = null; renderSettings(); };
  return c;
}

/* ============================================================
   المشاركة من تطبيقات أندرويد (share target)
   ============================================================ */
function takeShared(){
  const p = new URLSearchParams(location.search);
  const text = (p.get("text") || "").trim(), url = (p.get("url") || "").trim(), title = (p.get("title") || "").trim();
  if (!text && !url && !title) return;
  let out = "";
  const onlyUrl = /^https?:\/\/\S+$/.test(text) ? text : (!text ? url : "");
  if (onlyUrl) out = title ? "["+title.replace(/[\[\]]/g,"")+"]("+onlyUrl+")" : onlyUrl;
  else { out = text || title; if (url && !out.includes(url)) out += "\n" + url; }
  const cur = ta.value.replace(/\s+$/,"");
  ta.value = (cur ? cur + "\n" : "") + out; store.set("rqm-draft", ta.value);
  history.replaceState(history.state, "", location.pathname + "#c");
}

/* ============================================================
   البدء
   ============================================================ */
loadCfg(); loadPrefs();
if (PREFS.defGraph && graphs().some(g => g.name === PREFS.defGraph) && RAW.roam.current !== PREFS.defGraph){ RAW.roam.current = PREFS.defGraph; saveCfg(); }
loadPages(); initTarget(); loadQueue(); setGraphLocal(); takeShared(); route();
flush(); setTimeout(autoSync, 1500);
