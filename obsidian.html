  else if (!OBS.ready){ OBS.ready = await vaultPerm(OBS.handle, true); obsUI(); }
  if (!OBS.ready){ toast("لم يُمنح إذن الوصول إلى الخزنة"); return; }
  await scanVault(); obsStatus(); toast("تمت الفهرسة: "+OBS.notes.length+" ملف");
}

/* ---- الوسوم ---- */
function splitInlineList(rest, spaceSplit){
  let inner = rest.trim(); if (inner.startsWith("[")) inner = inner.replace(/^\[|\]$/g,"").trim();
  const parts = inner.includes(",") ? inner.split(",") : (spaceSplit ? inner.split(/\s+/) : [inner]);
  return parts.map(cleanTag).filter(Boolean);
}
function fmTags(fm){
  const lines = fm.split("\n"); const out = [];
  for (let i=0;i<lines.length;i++){
    const m = lines[i].match(/^tags\s*:(.*)$/i); if (!m) continue;
    const rest = m[1].trim();
    if (rest){ out.push(...splitInlineList(rest, true)); }
    else { for (let j=i+1;j<lines.length;j++){ const mm = lines[j].match(/^\s*-\s+(.+?)\s*$/); if (!mm) break; out.push(cleanTag(mm[1])); } }
    break;
  }
  return out.filter(Boolean);
}
function extractTags(tx){
  const tags = [], add = t => { t = cleanTag(t); if (t && /\D/.test(t) && !tags.some(x => normKey(x)===normKey(t))) tags.push(t); };
  let body = tx.replace(/\r/g,"");
  const fm = body.match(/^---\n([\s\S]*?)\n---[ \t]*(\n|$)/);
  if (fm){ fmTags(fm[1]).forEach(add); body = body.slice(fm[0].length); }
  body = body.replace(/```[\s\S]*?```/g,"").replace(/`[^`\n]*`/g,"");
  const re = /(?:^|[\s(])#([\p{L}\p{N}_\/\-]+)/gu; let m;
  while ((m = re.exec(body))) add(m[1]);
  return tags;
}

/* ---- الفهرسة (تزايدية بحسب وقت التعديل) ---- */
async function scanVault(){
  if (OBS.scanning || !OBS.handle) return;
  OBS.scanning = true;
  const name = curVault().name, root = OBS.handle;
  const cache = (await idbGet("scan:"+name)) || {};
  const folders = [], notes = [], seen = {}; let n = 0, dirty = false;
  async function walk(dir, rel){
    for await (const [nm, eh] of dir.entries()){
      if (nm.startsWith(".")) continue;
      const r = rel ? rel+"/"+nm : nm;
      if (eh.kind==="directory"){ folders.push(r); await walk(eh, r); }
      else if (/\.md$/i.test(nm)){
        const f = await eh.getFile(); n++;
        let c = cache[r];
        if (!c || c[0]!==f.lastModified || c[1]!==f.size){ c = [f.lastModified, f.size, extractTags(await f.text())]; cache[r] = c; dirty = true; }
        seen[r] = 1; notes.push({path:r, dir:rel, name:nm.slice(0,-3), tags:c[2]});
        if (n % 40 === 0){ OBS.status = "جارٍ الفهرسة… "+n; obsUI(); }
      }
    }
  }
  try { await walk(root, ""); }
  catch(e){ OBS.scanning = false; OBS.status = "تعذّرت الفهرسة: "+e.message; obsUI(); return; }
  for (const k of Object.keys(cache)) if (!seen[k]){ delete cache[k]; dirty = true; }
  if (dirty) await idbSet("scan:"+name, cache);
  OBS.folders = folders.sort((a,b) => a.localeCompare(b,"ar")); OBS.notes = notes;
  rebuildIndex(); OBS.scanning = false;
  OBS.indexTime = Date.now(); await saveIndex();
  OBS.status = indexInfo();
  obsUI(); loadPages(); obsStatus();
}
function rebuildIndex(){
  OBS.folderMap = new Map(OBS.folders.map(f => [normKey(f), f]));
  OBS.noteMap = new Map(OBS.notes.map(x => [normKey(x.dir)+"|"+normKey(x.name), x]));
  OBS.names = [...new Set(OBS.notes.map(x => x.name))]; OBS.namesN = null;
  const cnt = new Map();
  OBS.notes.forEach(x => (x.tags||[]).forEach(t => cnt.set(t, (cnt.get(t)||0)+1)));
  OBS.tagList = [...cnt.entries()].sort((a,b) => b[1]-a[1]).map(([t,c]) => ({t,c}));
  OBS.tagKey = new Map(OBS.tagList.map(x => [normKey(x.t), x.t]));
}

/* ---- مسار الهدف: المجلد والملف ---- */
function resolveFolderSync(text){
  let rel = "", created = false; const newParts = [];
  for (const seg0 of String(text).replace(/\\/g,"/").split("/")){
    const seg = cleanName(seg0); if (!seg) continue;
    const cand = rel ? rel+"/"+seg : seg, hit = OBS.folderMap.get(normKey(cand));
    if (hit && !created){ rel = hit; }
    else { created = true; newParts.push(seg); rel = cand; }
  }
  return {rel, created, newParts:newParts.join("/")};
}
function resolveNoteSync(rel, text){
  const clean = cleanName(String(text).replace(/\.md$/i,"")); if (!clean) return {name:"", exists:false};
  const hit = OBS.noteMap.get(normKey(rel)+"|"+normKey(clean));
  return {name: hit ? hit.name : clean, exists: !!hit};
}
function obsStatus(){

  const fr = resolveFolderSync(f);

  if (nr.name) parts.push(nr.exists ? "سيُضاف إلى ملف موجود: "+nr.name+".md" : "ملف جديد: "+nr.name+".md");

/* ---- مربع اقتراحات للحقول ---- */
function attachSuggest(input, getItems){
  const wrap = input.closest(".field"), box = el("ul","sbox"); wrap.appendChild(box);
  let items = [], sel = -1;
  const close = () => { box.classList.remove("open"); sel = -1; };
  const draw = () => {
    box.innerHTML = "";
    items.forEach((it,k) => {
      const li = el("li", k===sel ? "sel" : "");
      li.innerHTML = "<span>"+esc(it.label)+"</span>"+(it.sub ? "<small>"+esc(it.sub)+"</small>" : "");
      li.onmousedown = e => { e.preventDefault(); it.apply(); close(); input.dispatchEvent(new Event("rqchange")); };
      box.appendChild(li);
    });
    box.classList.toggle("open", items.length>0);
    const s = box.querySelector(".sel"); if (s) s.scrollIntoView({block:"nearest"});
  };
  const refresh = () => { items = getItems(input.value) || []; sel = -1; draw(); };
  input.addEventListener("input", refresh); input.addEventListener("focus", refresh);
  input.addEventListener("blur", () => setTimeout(close, 130));
  input.addEventListener("keydown", e => {
    if (!box.classList.contains("open")) return;
    if (e.key==="ArrowDown"){ e.preventDefault(); sel = (sel+1) % items.length; draw(); }
    else if (e.key==="ArrowUp"){ e.preventDefault(); sel = (sel-1+items.length) % items.length; draw(); }
    else if ((e.key==="Enter" || e.key==="Tab") && sel>=0){ e.preventDefault(); items[sel].apply(); close(); input.dispatchEvent(new Event("rqchange")); }
    else if (e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(); }
  });
}
function rankFilter(list, q, get, limit=12){
  const nq = normKey(q), pre = [], mid = [];
  for (const x of list){
    if (!nq){ pre.push(x); }
    else { const p = normKey(get(x)).indexOf(nq); if (p===0) pre.push(x); else if (p>0) mid.push(x); }
    if (pre.length >= limit && !nq) break;
  }
  return pre.concat(mid).slice(0, limit);
}

/* ---- YAML ---- */
function yamlScalar(v){
  if (v !== "" && !/^[\s\-?]|\s$|[:#\[\]{},&*!|>'"%@]/.test(v)) return v;
  return '"'+v.replace(/\\/g,"\\\\").replace(/"/g,'\\"')+'"';
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function mergeList(text, key, values){
  const nl = text.includes("\r\n") ? "\r\n" : "\n", lines = text.split(/\r?\n/);
  if (!/^---\s*$/.test(lines[0])) return text;
  let end = -1; for (let i=1;i<lines.length;i++) if (/^---\s*$/.test(lines[i])){ end = i; break; }
  if (end<0) return text;
  const isTags = key==="tags", fmt = v => isTags ? v : yamlScalar(v);
  const kre = new RegExp("^"+escRe(key)+"\\s*:","i"); let ki = -1;
  for (let i=1;i<end;i++) if (kre.test(lines[i])){ ki = i; break; }
  const notIn = ex => values.filter(v => !ex.some(e => normKey(e)===normKey(v)));
  if (ki<0){ lines.splice(end, 0, key+":", ...values.map(v => "  - "+fmt(v))); }
  else {
    const rest = lines[ki].replace(kre,"").trim();
    if (rest){
      const ex = splitInlineList(rest, isTags), add = notIn(ex); if (!add.length) return text;
      lines[ki] = key+": ["+ex.concat(add).map(fmt).join(", ")+"]";
    } else {
      let last = ki, indent = "  ", j = ki+1; const ex = [];
      while (j<end){ const m = lines[j].match(/^(\s*)-\s+(.+?)\s*$/); if (!m) break; ex.push(cleanTag(m[2])); indent = m[1]; last = j; j++; }
      const add = notIn(ex); if (!add.length) return text;
      lines.splice(last+1, 0, ...add.map(v => indent+"- "+fmt(v)));
    }
  }
  return lines.join(nl);
}
function buildFm(fields, nl){
  const out = ["---"];
  fields.forEach(f => { out.push(f.key+":"); f.values.forEach(v => out.push("  - "+(f.key==="tags" ? v : yamlScalar(v)))); });
  out.push("---"); return out.join(nl)+nl;
}
function applyFields(text, fields){
  if (!fields.length) return text;
  const nl = text.includes("\r\n") ? "\r\n" : "\n";
  const has = /^---[ \t]*\r?\n[\s\S]*?\r?\n---[ \t]*(\r?\n|$)/.test(text);
  if (!has) return buildFm(fields, nl) + nl + text;
  fields.forEach(f => { text = mergeList(text, f.key, f.values); });
  return text;
}
function filledFields(){
  const out = [];
  metaFields().forEach(f => {
    const raw = (OBS.vals[f.key] || "").trim(); if (!raw) return;
    let vals = raw.split(/[,،؛;]/).map(s => s.trim()).filter(Boolean);
    if (f.key==="tags") vals = vals.map(s => cleanTag(s).replace(/\s+/g,"_")).filter(Boolean).map(t => OBS.tagKey.get(normKey(t)) || t);
    const uniq = []; vals.forEach(v => { if (!uniq.some(u => normKey(u)===normKey(v))) uniq.push(v); });
    if (uniq.length) out.push({key:f.key, values:uniq});
  });
  return out;
}

/* ---- تحويل الكتل (صيغة المحرر/Roam) إلى Markdown لـ Obsidian ---- */
function oblInline(s){
  const keep = [];
  s = s.replace(/`[^`\n]+`/g, m => { keep.push(m); return "\u0000"+(keep.length-1)+"\u0000"; });
  s = s.replace(/__(?=\S)([^_\n]+?)(?<=\S)__/g, "*$1*");                 // مائل Roam → *x*
  s = s.replace(/\^\^(?=\S)([^\^\n]+?)(?<=\S)\^\^/g, "==$1==");          // تمييز
  s = s.replace(/\u0000(\d+)\u0000/g, (m,i) => keep[+i]);
  return s;
}
let OBS_TIGHT = false;     // فقرات متلاصقة بسطر واحد بينها (كما يلصق Obsidian) بدل سطر فارغ
const LIST_LINE = /^\s*([-*+]|\d+[.)])\s|^\s*\|/;
function obsEmit(nodes, depth, para, out, forceList){
  const blank = () => { if (out.length && out[out.length-1] !== "" && !/^#{1,6} /.test(out[out.length-1])) out.push(""); };   // لا سطر فارغ بعد العنوان (كما في Obsidian)
  for (const n of nodes){
    let s = n.string;
    const task = s.match(/^\{\{\[\[(TODO|DONE)\]\]\}\}\s*([\s\S]*)$/);
    if (task) s = (task[1]==="DONE" ? "[x] " : "[ ] ") + task[2];
    const trs = tableRows(n.string);
    const pad = "    ".repeat(depth);
    if (n.heading && depth===0 && !forceList){
      if (out.length && out[out.length-1] !== "") out.push(""); out.push("#".repeat(n.heading)+" "+oblInline(s));
      obsEmit(n.children, 0, para, out, false); continue;
    }
    if (trs){ blank(); n.string.split("\n").forEach(l => out.push(pad+oblInline(l))); blank(); obsEmit(n.children, depth+((depth||forceList) ? 1 : 0), para, out, true); continue; }
    if (s.trim()==="---"){ blank(); out.push("---"); blank(); obsEmit(n.children, 0, para, out, true); continue; }
    s = oblInline(s);
    const listy = depth>0 || !para || n.li || forceList || !!task;
    const lines = s.split("\n");
    if (listy){
      const ordered = /^\d+[.)]\s/.test(lines[0]);
      if (OBS_TIGHT && depth===0 && out.length && out[out.length-1]!=="" && !LIST_LINE.test(out[out.length-1])) out.push("");
      const mark = ordered ? "" : "- ", cont = pad + (ordered ? "   " : "  ");
      out.push(pad + mark + (n.heading ? "#".repeat(n.heading)+" " : "") + lines[0]);
      for (let i=1;i<lines.length;i++) out.push(lines[i]==="" ? "" : cont + lines[i]);
      obsEmit(n.children, depth+1, para, out, true);
    } else {
      if (!OBS_TIGHT) blank();
      else if (out.length && out[out.length-1]!=="" && LIST_LINE.test(out[out.length-1])) out.push("");
      lines.forEach(l => out.push(l));
      if (!OBS_TIGHT) blank();
      obsEmit(n.children, 0, para, out, true);
    }
  }
}
function toObsidian(tree, tight){
  OBS_TIGHT = !!tight;
  const out = []; obsEmit(tree, 0, CFG.obs.paragraphs, out, false); OBS_TIGHT = false;
  return out.join("\n").replace(/^\n+/,"").replace(/\n{3,}/g,"\n\n").replace(/\s+$/,"");
}
function stampStr(d=new Date()){ return isoStr(d)+" "+timeStr(d); }

/* ---- الكتابة في الخزنة ---- */
async function sendToObsidian(body){
  const root = OBS.handle;
  if (!root) throw new Error("لا توجد خزنة مختارة (أضفها من +)");
  if (!(await vaultPerm(root, true))) throw new Error("لم يُمنح إذن الكتابة في الخزنة");
  const fr = resolveFolderSync($("#oFolder").value), nr = resolveNoteSync(fr.rel, $("#oName").value);
  if (!nr.name) throw new Error("اكتب اسماً للملف");
  let dir = root;
  for (const seg of fr.rel.split("/").filter(Boolean)) dir = await dir.getDirectoryHandle(seg, {create:true});
  const fname = nr.name+".md"; let fh, existing = "", isNew = false;
  try { fh = await dir.getFileHandle(fname); existing = await (await fh.getFile()).text(); }
  catch(e){ if (e.name!=="NotFoundError") throw e; isNew = true; fh = await dir.getFileHandle(fname, {create:true}); }
  const fields = filledFields();
  let text;
  if (isNew){
    text = (fields.length ? buildFm(fields, "\n") + "\n" : "") + body + "\n";
  } else {
    const nl = existing.includes("\r\n") ? "\r\n" : "\n";
    let base = applyFields(existing, fields);
    if (base.trim()!==""){
      const m = base.match(/(\r?\n)*$/)[0].replace(/\r/g,"").length;
      base += "\n".repeat(Math.max(0, 2-m)) + "<!-- "+stampStr()+" -->\n\n";
    }
    text = base + body + "\n";
    if (nl==="\r\n") text = text.replace(/\r?\n/g,"\r\n");
  }
  const w = await fh.createWritable(); await w.write(text); await w.close();
  if (isNew){                                          // تحديث الفهرس في الذاكرة
    let acc = ""; fr.rel.split("/").filter(Boolean).forEach(p => { acc = acc ? acc+"/"+p : p; if (!OBS.folderMap.has(normKey(acc))){ OBS.folders.push(acc); OBS.folderMap.set(normKey(acc), acc); } });
    OBS.notes.push({path:(fr.rel ? fr.rel+"/" : "")+fname, dir:fr.rel, name:nr.name, tags:fields.filter(f => f.key==="tags").flatMap(f => f.values)});
    rebuildIndex(); loadPages(); saveIndex();
  }
  CFG.obs.lastFolder = fr.rel; saveCfg();
  return {file:(fr.rel ? fr.rel+"/" : "")+fname, isNew};
}

/* ============================================================
   نواة النسخة المحلية والبحث والمزامنة (مشتركة مع نسخة الجوال)
   ============================================================ */
const RQ = (function(OUT){
  const $ = s => document.querySelector(s);
  const AR = n => Number(n).toLocaleString("ar-EG");
  const store = {get:OUT.store.get, set:OUT.store.set, del(k){ try { localStorage.removeItem(k); } catch(e){} }};
  const toast = OUT.toast, newUid = OUT.newUid, norm = OUT.norm;
  const G = () => OUT.graph();
  const busy = () => {}, mkNode = o => o, pullSubtrees = async () => {};
  const hooks = {onSync(){}, onQueue(){}};
  const loadPages = () => {}, pageCache = {clear(){}}, ROUTE = {name:""}, renderSettings = () => {}, drawSearch = () => {};
  const PAGES = {includes:() => true}, PAGESN = [];
const API = "https://api.roamresearch.com";
const peers = {};                                    // عنوان الخادم الفعلي لكل غراف (يوفّر تحويلة في كل طلب)
function peerOf(name){ if (!(name in peers)) peers[name] = store.get("rqm-peer:"+name) || ""; return peers[name]; }
function setPeer(name, v){ peers[name] = v || ""; if (v) store.set("rqm-peer:"+name, v); else store.del("rqm-peer:"+name); }

async function roam(kind, body, opt={}){
  const g = opt.graph || G();
  if (!g) throw new Error("أضف غرافاً من الإعدادات أولاً");
  if (!g.token) throw new Error("لا رمز لهذا الغراف — أضفه من الإعدادات");
  const path = "/api/graph/"+encodeURIComponent(g.name)+"/"+kind;
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), opt.timeout || 40000);
  const init = {method:"POST", headers:{"X-Authorization":"Bearer "+g.token, "Content-Type":"application/json"}, body:JSON.stringify(body), signal:ctrl.signal};
  let r, usedPeer = peerOf(g.name);
  busy(true);
  try {
    try { r = await fetch((usedPeer || API)+path, init); }
    catch(e){ if (usedPeer && e.name !== "AbortError"){ setPeer(g.name, ""); usedPeer = ""; r = await fetch(API+path, init); } else throw e; }
    if (usedPeer && !r.ok && ![400,401,403,429].includes(r.status)){   // عنوان محفوظ قديم: أعد عبر العنوان الأصلي
      setPeer(g.name, ""); usedPeer = ""; r = await fetch(API+path, init);
    }
    try { const u = new URL(r.url); if (r.ok && u.origin !== API && u.origin !== usedPeer) setPeer(g.name, u.origin); } catch(e){}
    const text = await r.text();
    if (opt.soft) return {ok:r.ok, status:r.status, text};
    if (!r.ok){
      let m = "خطأ من Roam ("+r.status+")";
      if (r.status === 401 || r.status === 403) m = "الرمز غير صالح أو لا يملك الصلاحية ("+r.status+")";
      else if (r.status === 429) m = "تجاوزت حدّ الطلبات، انتظر قليلاً ثم أعد";
      else if (r.status >= 500) m = "خادم Roam لا يستجيب ("+r.status+")";
      const d = text.replace(/\s+/g," ").slice(0,140);

}

const K = (o,k) => o == null ? undefined : (o[":"+k] !== undefined ? o[":"+k] : (o[k] !== undefined ? o[k] : o[k.split("/")[1]]));
function foldCode(c){
  if (c < 128){
    if (c >= 65 && c <= 90) return c + 32;
    if (c === 10 || c === 13 || c === 9) return 32;
    return (c < 32 || c === 127) ? -1 : c;
  }
  if ((c >= 0x64B && c <= 0x65F) || c === 0x670 || c === 0x640 || (c >= 0x6D6 && c <= 0x6ED) ||
      (c >= 0x200B && c <= 0x200F) || (c >= 0x202A && c <= 0x202E) || (c >= 0x2066 && c <= 0x2069) || c === 0xFEFF) return -1;
  if (c === 0x622 || c === 0x623 || c === 0x625 || c === 0x671) return 134;      // ا
  if (c === 0x649 || c === 0x6CC) return 169;                                    // ي
  if (c === 0x6A9) return 162;                                                   // ك
  if (c >= 0x621 && c <= 0x64A) return 128 + (c - 0x621);
  if (c >= 0x660 && c <= 0x669) return 48 + (c - 0x660);
  if (c >= 0x6F0 && c <= 0x6F9) return 48 + (c - 0x6F0);
  if (c === 0x67E) return 180; if (c === 0x686) return 181; if (c === 0x698) return 182; if (c === 0x6AF) return 183;
  if (c === 0x60C) return 44; if (c === 0x61B) return 59; if (c === 0x61F) return 63;
  if (c === 0xA0) return 32; if (c === 0xAB || c === 0xBB) return 34;
  return 127;
}
function foldStr(s){ const out = []; for (let i=0;i<s.length;i++){ const b = foldCode(s.charCodeAt(i)); if (b >= 0) out.push(b); } return out; }

function openDB(name){
  return new Promise((res, rej) => {
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore("blocks", {keyPath:"u"});                 // {u, s, g, h?, c?}  النص
      d.createObjectStore("tree", {keyPath:"u"}).createIndex("po", ["p","o"]);   // {u, p, o}  الموضع
      d.createObjectStore("pages", {keyPath:"u"}).createIndex("t", "t");         // {u, t}
      d.createObjectStore("kv");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error || new Error("تعذّر فتح التخزين"));
  });
}

/* ---- العامل الخلفي: يحمل نسخة البحث المضغوطة في الذاكرة ---- */
function workerMain(){

  function reset(){ T = new Uint8Array(1 << 22); tl = 0; U = []; P = []; G = []; O = []; L = []; S = []; E = []; A = []; M = new Map(); dead = 0; }

    close(){ reset(); if (db){ try { db.close(); } catch(e){} db = null; } return true; },
    add(m){ for (const r of m.rows) add(r); return M.size; },
    upd(m){ const i = M.get(m.u); if (i === undefined) return false; add({u:m.u, s:m.s, p:P[i], g:G[i], o:O[i]}); return true; },
    del(m){ for (const u of m.uids) del(u); return M.size; },
    move(m){ for (const r of m.rows){ const i = M.get(r[0]); if (i !== undefined){ P[i] = r[1]; O[i] = r[2]; } } return true; },
    has(m){ return m.uids.filter(u => M.has(u)); },
    pageUids(m){ const out = []; for (const [u, i] of M) if (G[i] === m.g) out.push(u); return out; },
    gof(m){ return m.uids.map(x => { let k = 0; while (M.has(x) && k++ < 500) x = P[M.get(x)]; return x; }); },   // اصعد في الآباء حتى الصفحة

    },
    search(m){

    searchAll(m){                                    // كتل فيها كل الكلمات، ولو متفرقة

      const inBlock = (t, a, z) => { let p = a; for (;;){ p = T.indexOf(t[0], p); if (p < 0 || p + t.length > z) return false; let k = 1; while (k < t.length && T[p+k] === t[k]) k++; if (k === t.length) return true; p++; } };

    },
    refs(m){

      scan(encQ("#" + m.title), i => set.add(i), end => { const b = T[end]; return b === 0 || b === 32 || (b < 48 && b !== 45) || b === 58 || b === 59 || b === 63 || b === 93; });

    },
    stats(){ return {n:M.size, bytes:tl, dead}; },
    async persist(){

      const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(ix, "index"); t.objectStore("kv").put([], "tail"); t.objectStore("kv").put([], "gone");
      await new Promise((res, rej) => { t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error || new Error("حفظ الفهرس فشل")); });

}
let wk = null, wid = 0; const wcb = new Map();
function W(op, data){

    wk = new Worker(URL.createObjectURL(new Blob([src], {type:"text/javascript"})));
    wk.onmessage = e => { const m = e.data, c = wcb.get(m.id); if (!c) return; wcb.delete(m.id); if (m.ok) c[0](m.res); else c[1](new Error(m.err)); };

const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

const isLocal = name => store.get("rqm-local:"+name) === "1";

  const g = G(); if (!g) return Promise.reject(new Error("لا غراف"));
  const name = "rqm-" + g.name;
  if (DBNAME === name && readyP) return readyP;
  DBNAME = name; if (DB){ try { DB.close(); } catch(e){} } DB = null; PT.clear();
  readyP = (async () => {

    const r = await W("open", {name});

const kvGet = async k => rq(DB.transaction("kv").objectStore("kv").get(k));

  if (!uids.length) return [];
  const t = DB.transaction(["blocks","tree"]), B = t.objectStore("blocks"), T = t.objectStore("tree"), I = T.index("po");
  const res = await Promise.all(uids.map(u => Promise.all([rq(B.get(u)), rq(T.get(u)), rq(I.count(kidRange(u)))])));
  return res.filter(x => x[0] && x[1]).map(([b, tr, cnt]) => mkNode({uid:b.u, s:b.s || "", h:b.h || 0, open:!b.c, g:b.g, parent:tr.p, order:tr.o,
    pn:pn || null, loc:true, lazy:cnt > 0, loaded:cnt === 0}));

const KPAGE = 60;
async function lLoadKids(n){                         // الدفعة التالية من أولاد كتلة أو صفحة
  const have = new Set(n.kids.map(k => k.uid)); if (n.added) n.added.forEach(u => have.add(u));
  const last = n.kids.length ? n.kids[n.kids.length-1].order : -Infinity;
  const recs = await rq(DB.transaction("tree").objectStore("tree").index("po").getAll(IDBKeyRange.bound([n.uid, last], [n.uid, Infinity]), KPAGE + have.size + 1));
  const fresh = recs.filter(r => !have.has(r.u)), more = fresh.length > KPAGE;
  const nodes = await lNodes(fresh.slice(0, KPAGE).map(r => r.u), n);

async function lPutRecs(recs, viaSync){              // recs: {u,s,p,g,o,h?,c?}

  for (const r of recs){ const b = {u:r.u, s:r.s, g:r.g}; if (r.h) b.h = r.h; if (r.c) b.c = 1; if (r.ct) b.ct = r.ct; if (r.et) b.et = r.et; B.put(b); T.put({u:r.u, p:r.p, o:r.o}); }

async function lShift(p, from, by){                  // أزح إخوة الموضع (سجلات صغيرة، بلا نصوص)

async function fixPages(recs){                 // كتل بلا صفحة معروفة: اصعد إلى جذرها واجلب عنوانه من Roam
  const bad = recs.filter(b => b && !PT.has(b.g)); if (!bad.length) return 0;
  await openLocal(); const roots = await W("gof", {uids:bad.map(b => b.u)});
  const unk = [...new Set(roots.filter(y => y && !PT.has(y)))];
  if (unk.length && navigator.onLine){
    try { const r = await roam("q", {query:Q_TITLES, args:[unk.slice(0, 200)]});
      for (const x of (r && r.result) || []) if (x[0] && x[1]){ await lPutPage(x[0], x[1]); addPageTitle(x[1]); } } catch(e){}
  }
  const fix = []; bad.forEach((b, k) => { if (PT.has(roots[k])){ b.g = roots[k]; fix.push(b); } });
  if (fix.length){ const t = DB.transaction("blocks", "readwrite"), B = t.objectStore("blocks"); for (const b of fix) B.put(b); await txDone(t); }
  return fix.length;
}
async function lRenameRefs(old, nw){                 // محلياً: حدّث نصوص الكتل التي تشير إلى الصفحة (Roam يفعل ذلك عنده)
  const r = await W("refs", {title:old, limit:50000}), ex = old.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re1 = new RegExp("\\[\\[" + ex + "\\]\\]", "g"), re2 = /\s/.test(old) ? null : new RegExp("#" + ex + "(?=$|[\\s.,،؛:;!?\\])])", "g"), tag = /\s/.test(nw) ? "#[[" + nw + "]]" : "#" + nw, ch = [];

    for (const u of us.slice(i, i + 400)){ const g = B.get(u); g.onsuccess = () => { const b = g.result; if (!b || !b.s) return; let s2 = b.s.replace(re1, "[[" + nw + "]]"); if (re2) s2 = s2.replace(re2, tag);

    await txDone(t); }

}

/* ---- تلوين كلمات الجذر في صفحات «ج/…» فقط ---- */
const ROOTHL = (function(){
  const NAME = "root-matches", PREFIX = "ج/", ARABIC = /[ؠ-ۿ]/;
  if (!window.CSS || !CSS.highlights || typeof Highlight === "undefined") return {set(){}};
  const hl = new Highlight(); CSS.highlights.set(NAME, hl);
  let vars = [], obs = null, timer = 0, pending = new Set(), nodeRanges = new WeakMap();
  function fold(c){
    if ((c >= 0x064B && c <= 0x065F) || c === 0x0670 || c === 0x0640 || (c >= 0x06D6 && c <= 0x06ED)) return 0;
    switch (c){ case 0x0622: case 0x0623: case 0x0625: case 0x0671: return 0x0627; case 0x0624: return 0x0648; case 0x0626: return 0x064A; }
    return c;
  }
  const isWord = c => (c >= 0x0610 && c <= 0x061A) || (c >= 0x0620 && c <= 0x065F) || c === 0x0670 || (c >= 0x066E && c <= 0x06D3) || (c >= 0x06D5 && c <= 0x06ED) || (c >= 0x06FA && c <= 0x06FF);
  function proc(node){
    const old = nodeRanges.get(node); if (old){ for (const r of old) hl.delete(r); nodeRanges.delete(node); }
    if (!vars.length || !node.isConnected) return;
    const text = node.nodeValue; if (!text || text.length < 2 || !ARABIC.test(text)) return;
    const par = node.parentElement; if (!par || par.tagName === "TEXTAREA" || par.closest("code,pre,textarea")) return;
    const n = text.length, nv = vars.length, ks = new Array(nv); let ranges = null, i = 0;
    while (i < n){
      while (i < n && !isWord(text.charCodeAt(i))) i++;
      if (i >= n) break;
      const start = i; ks.fill(0);
      while (i < n){ const c = text.charCodeAt(i); if (!isWord(c)) break; const f = fold(c);
        if (f) for (let v=0; v<nv; v++){ const a = vars[v]; if (ks[v] < a.length && f === a[ks[v]]) ks[v]++; }
        i++; }
      let hit = false; for (let v=0; v<nv; v++) if (ks[v] === vars[v].length){ hit = true; break; }
      if (hit){ const r = new Range(); r.setStart(node, start); r.setEnd(node, i); hl.add(r); (ranges || (ranges = [])).push(r); }
    }
    if (ranges) nodeRanges.set(node, ranges);
  }
  function collect(c){
    if (!c) return;
    if (c.nodeType === 3){ if (ARABIC.test(c.nodeValue)) pending.add(c); return; }
    if (c.nodeType !== 1 && c.nodeType !== 11) return;
    const w = document.createTreeWalker(c, NodeFilter.SHOW_TEXT); for (let x; (x = w.nextNode());) if (ARABIC.test(x.nodeValue)) pending.add(x);
  }
  function run(){
    timer = 0; const t0 = performance.now(), it = pending.values();
    for (let x = it.next(); !x.done; x = it.next()){ pending.delete(x.value); proc(x.value); if (performance.now() - t0 > 8) break; }
    if (pending.size) timer = setTimeout(run, 16);
    else if (hl.size > 4000){ const dead = []; for (const r of hl) if (r.collapsed || !r.startContainer.isConnected) dead.push(r); for (const r of dead) hl.delete(r); }
  }
  const kick = () => { if (!timer && pending.size) timer = setTimeout(run, 60); };
  return {set(title, host, on){                         // عنوان الصفحة، والعنصر الذي يُلوَّن ما بداخله
    if (obs){ obs.disconnect(); obs = null; } clearTimeout(timer); timer = 0; pending.clear(); hl.clear(); vars = [];
    if (!on || !host || !title || !title.startsWith(PREFIX)) return;
    let r = ""; for (const ch of title.slice(PREFIX.length).trim()){ const f = fold(ch.charCodeAt(0)); if (f && isWord(f)) r += String.fromCharCode(f); }
    if (r.length === 3 && r[1] === r[2]) r = r.slice(0, 2);          // المضعّف: بالحرفين الأولين
    if (r.length < 2) return;
    const list = [r], weak = "وياى";
    if (r.length >= 3 && weak.includes(r[0])) list.push(r.slice(1));                    // weak first radical
    if (r.length >= 3 && weak.includes(r[r.length-1])) list.push(r.slice(0, -1));        // weak last radical
    vars = list.map(x => Array.from(x, ch => ch.charCodeAt(0)));
    collect(host); kick();
    obs = new MutationObserver(recs => { for (const m of recs){ if (m.type === "characterData") pending.add(m.target); else for (const a of m.addedNodes) collect(a); } kick(); });
    obs.observe(host, {childList:true, subtree:true, characterData:true});
  }};
})();

async function syncGraph(full, scope){               // scope: معرّف صفحة لمزامنتها وحدها

      catch(e){ if (tries >= 3) throw e; syncMsg("انقطاع، يعيد المحاولة…"); await sleep(4000); continue; }

    { const t = DB.transaction("pages", "readwrite"), P = t.objectStore("pages"); P.clear(); for (const x of pages) P.put({u:x[0], t:x[1]}); await txDone(t); }

    }

        pmap = new Map(); for (const x of rows) pmap.set(x[0], x[2]);

      }
      const d = await W("diff", {rows, keep:[...PEND], only});

      if (d.del.length || d.moved.length){

        const unk = [...new Set(res.filter(y => y && !PT.has(y)))];      // جذر لا نعرف عنوانه: صفحة أُنشئت بعد آخر جلب للأسماء

      syncMsg("ينزّل الكتل: " + AR(fetched) + " من " + AR(total) + (total ? " (" + AR(Math.floor(fetched * 100 / total)) + "٪)" : ""));
      const batch = queue.shift();

}

function stem(w){                                    // تجريد خفيف: يوسّع المطابقة ولا يضيّقها
  let s = norm(w).replace(/[^\u0621-\u064Aa-z0-9]/g, ""); if (!/[\u0621-\u064A]/.test(s)) return s;
  let m = s.match(/^(?:[\u0648\u0641])?(?:[\u0628\u0643]|\u0644)?\u0627\u0644(.{3,})$/) || s.match(/^(?:[\u0648\u0641])?\u0644\u0644(.{3,})$/);
  if (m) s = m[1];
  else if ((m = s.match(/^[\u0648\u0641](.{3,})$/))) s = m[1];
  else if ((m = s.match(/^[\u0628\u0644\u0643](.{4,})$/))) s = m[1];
  for (const x of SUF) if (s.length - x.length >= 3 && s.endsWith(x)){ s = s.slice(0, -x.length); break; }

  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [], offs = [], bytes = []; let t;
  while ((t = w.nextNode())){ const s = t.nodeValue; for (let i=0;i<s.length;i++){ const b = foldCode(s.charCodeAt(i)); if (b >= 0){ bytes.push(b); nodes.push(t); offs.push(i); } } }
  let all = [];
  for (const qb of terms){ const n = qb.length; for (let i=0; i + n <= bytes.length; i++){ let k = 0; while (k < n && bytes[i+k] === qb[k]) k++; if (k === n){ all.push([i, n]); i += n - 1; } } }
  all.sort((a, b) => a[0] - b[0]); const fl = []; let endAt = 0;
  for (const x of all) if (x[0] >= endAt){ fl.push(x); endAt = x[0] + x[1]; }
  const found = fl.map(x => x[0]), lens = fl.map(x => x[1]);
  for (let f = found.length - 1; f >= 0; f--){
    let z = found[f] + lens[f] - 1;
    while (z >= found[f]){
      let a = z; while (a > found[f] && nodes[a-1] === nodes[z]) a--;
      const r = document.createRange(); r.setStart(nodes[z], offs[a]); r.setEnd(nodes[z], offs[z] + 1);
      const m = document.createElement("mark"); m.className = "hit"; if (a === found[f]) m.dataset.first = "1";
      try { r.surroundContents(m); } catch(e){}
      z = a - 1;
    }
  }
  return [...root.querySelectorAll('mark.hit[data-first]')];
}

  /* ---------- الإرسال إلى Roam ---------- */
  function dayOf(n){                                   // صفحة اليوم: يوم التسجيل (إن كانت ساعة المسجّل معقولة) أو يوم الإرسال
    let d = new Date(); if (store.get("rq-vc-day") !== "send"){ const r = new Date(n.rec * 1000); if (r.getFullYear() >= 2024 && r.getTime() <= Date.now() + 864e5) d = r; }

  async function send(id){
    const n = note(id); if (!n || V.sending[id]) return false;
    if (!n.blocks || !n.blocks.length){ toast("لا نصّ يُرسل"); return false; }
    const g = CFG.roam.graphs.find(x => x.name === n.dest.graph);
    if (!g || !g.token){ toast("لا رمز للغراف «" + n.dest.graph + "» — أضفه من إعدادات المحرر"); return false; }
    V.sending[id] = true; drawBar(id);
    try {
      const call = (kind, body) => roamFetch(g.name, g.token, kind, body);
      let pageUid, title;
      if (n.dest.page.kind === "page"){ title = n.dest.page.title;
        const q = await call("q", {query:"[:find ?u . :in $ ?t :where [?e :node/title ?t] [?e :block/uid ?u]]", args:[title]});
        if (!q.ok) throw new Error("استعلام الصفحة فشل (" + q.status + ")");
        pageUid = JSON.parse(q.text).result || null;
        if (!pageUid){ pageUid = newUid(); const c = await call("write", {action:"create-page", page:{title, uid:pageUid}}); if (!c.ok) throw new Error("إنشاء الصفحة فشل (" + c.status + ")"); }
      } else { const d = dayOf(n); pageUid = d.uid; title = d.title; await ensurePage(call, pageUid, title); }
      const acts = [], tops = [];
      (function f(list, parent, top){ for (const b of list){ const uid = newUid(); if (top) tops.push(uid);
        acts.push({action:"create-block", location:{"parent-uid":parent, order:"last"}, block:{uid, string:b.text}}); f(b.kids || [], uid, false); } })(n.blocks, pageUid, true);
      if (n.sent && n.sent.uids)                        // استبدال: يُحذف ما أُرسل قبلُ ثم يُكتب الجديد
        for (const u of n.sent.uids){ const gg = CFG.roam.graphs.find(x => x.name === n.sent.graph) || g; await roamFetch(gg.name, gg.token, "write", {action:"delete-block", block:{uid:u}}); }
      const w = await call("write", {action:"batch-actions", actions:acts});
      if (!w.ok) throw new Error("الكتابة فشلت (" + w.status + "): " + w.text.slice(0, 120));
      const again = !!n.sent;
      await op(id, {op:"sent", sent:{graph:g.name, pageUid, title, uids:tops, at:Math.floor(Date.now() / 1000)}});
      toast((again ? "استُبدل في: " : "أُرسل إلى: ") + title); return true;
    } catch(e){ toast("تعذّر الإرسال: " + e.message); return false; }
    finally { delete V.sending[id]; drawBar(id); }
  }

  /* ---------- الوجهة ---------- */

  /* ---------- قائمة العناوين في الوارد: عند «[[» أو «#»، وعند تحديد كلمات ---------- */

    const pages = (store.get("rq-pages:" + g) || "").split("\n").filter(Boolean);
    if (isRoot){ const k = fold(q); return pages.filter(t => fold(t).startsWith(k)).slice(0, 40); }

  function refDraw(){

  function refPick(t){

    const rg = R.range(); rg.deleteContents(); const tn = document.createTextNode(txt + " "); rg.insertNode(tn);

  function refScan(box){                                // أكتبتَ «[[» أو «#» قبل المؤشّر؟
    const sel = getSelection(); if (!sel.rangeCount || !sel.isCollapsed){ return; } const nd = sel.anchorNode; if (!nd || nd.nodeType !== 3 || !box.contains(nd)){ if (V.ref && !V.ref.fromSel) refClose(); return; }

  function selBar(){                                    // حدّدتَ كلمات: زرّا «[[ ]]» و«#» يفتحان القائمة عليها

  /* ---------- البطاقة ---------- */
  function readIn(box){                                // نصّ كل جملة كما عُدّل (وما كُتب خارج الجمل يُلحق بما قبله)
    const n = note(box.closest(".vcc").dataset.id), out = n.segs.map(() => ""); let last = 0;
    box.childNodes.forEach(c => { if (c.nodeType === 1 && c.classList.contains("pm")) return;

    return out.map(t => t.replace(/\s+/g, " ").trim());
  }
  function accept(id){                                 // أوّل اقتراح: ضع الإحالة مكان العبارة
    const n = note(id); if (!n || !n.sugg.length) return false; const s = n.sugg[0]; let done = false;

  function gone(id){ if (V.st){ V.st.notes = V.st.notes.filter(x => x.id !== id); V.st.log = V.st.log.filter(x => x.id !== id); } }

  function del(id){                                     // من الأرشيف والمسجّل معاً: لا يُستردّ، فله خمس ثوانٍ للتراجع بلا سؤال

  function drawBar(id){ const c = card(id), n = note(id); if (c && n){ const b = c.querySelector(".vcbar"); if (b) b.innerHTML = barHtml(n); } }

function taskFromSug(n, t, start, end){              // «[[مهمة»: مربع مهمة، ثم تاريخ اختياري يُلحق رابطاً إلى صفحة اليوم
  let v = t.value; if (v.slice(end, end + 2) === "]]") end += 2;
  v = (v.slice(0, start) + v.slice(end)).replace(/^\s+/, ""); pushHist();
  const pre = isOb() ? "- [ ] " : "{{[[TODO]]}} ";
  n.text = (isOb() ? v.replace(/^[-*+] (\[.\] )?/, "") : v.replace(/^\{\{(?:\[\[)?(?:TODO|DONE)(?:\]\])?\}\} ?/, "")); n.text = pre + n.text; n.auto = false;
  startEdit(n.id, n.text.length); if (ACTIVE === "page") docTouch(); else draftTouch();
  const nt = $('textarea[data-id="' + n.id + '"]'); if (nt){ calOpen(nt); CAL.todo = null; CAL.append = n.id; }
}
function todoKey(n, t){                              // لا شيء ← TODO ← DONE ← لا شيء
  const v = t.value, s = t.selectionStart, T = "{{[[TODO]]}} ", Dn = "{{[[DONE]]}} "; pushHist();
  let nv, delta, add = false;
  if (v.startsWith(T)){ nv = Dn + v.slice(T.length); delta = 0; }
  else if (v.startsWith(Dn)){ nv = v.slice(Dn.length); delta = -Dn.length; }
  else { nv = T + v; delta = T.length; add = true; }
  n.text = nv; n.auto = false; startEdit(n.id, Math.max(0, s + delta));
  if (add){ const nt = $('textarea[data-id="' + n.id + '"]'); if (nt){ calOpen(nt); CAL.todo = n.id; } }
}

  $("#rpX").onmousedown = e => { e.preventDefault(); e.stopPropagation(); };

  q.addEventListener("focus", qxMark); setInterval(() => { if ($("#rpX").hidden === !!q.value) qxMark(); }, 500);
  q.addEventListener("search", () => { if (!q.value) barMark(); });
  q.onfocus = () => { barMark(); rpDraw(); };
  q.onclick = () => { if ($("#rpRes").hidden) rpDraw(); };
  q.onkeydown = e => {
    if (e.key === "ArrowDown"){ e.preventDefault(); RP.sel = Math.min(RP.items.length - 1, RP.sel + 1); rpMark(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); RP.sel = Math.max(0, RP.sel - 1); rpMark(); }
    else if (e.key === "Enter"){ e.preventDefault(); const dr = !!TABS.cur && TABS.cur.kind === "draft"; rpPick(RP.sel, dr ? !e.ctrlKey : e.ctrlKey); }
    else if (e.key === "Escape"){ e.preventDefault(); if (!$("#rpRes").hidden) $("#rpRes").hidden = true; else { q.blur(); } }
  };

/* ---- ما يُنقر في Roam يُنقر هنا: روابط الصفحات، الوسوم، مراجع الكتل، الروابط الخارجية ---- */
function roamClick(e){
  const a = e.target.closest(".link,.bref,.ext"); if (!a || (obDest() && !e.target.closest("#rpDoc"))) return false;
  if (a.classList.contains("ext")){ if (a.dataset.h){ window.open(a.dataset.h, "_blank", "noopener"); return true; } return false; }

const brefCache = new Map();
async function brefFill(root){                       // أظهر نص الكتلة المشار إليها بدل ((المعرّف))
  const els = [...root.querySelectorAll(".bref:not(.ok)")]; if (!els.length || !RQ.loc()) return;
  try {
    await RQ.openLocal(); const need = [...new Set(els.map(x => x.dataset.u))].filter(u => !brefCache.has(u));
    if (need.length){ const B = RQ.db().transaction("blocks").objectStore("blocks"); (await Promise.all(need.map(u => RQ.rq(B.get(u))))).forEach((b, i) => brefCache.set(need[i], b ? b.s || "" : null)); }
    for (const x of els){ const t = brefCache.get(x.dataset.u); if (t == null) continue; x.classList.add("ok"); x.innerHTML = renderInline(t.length > 300 ? t.slice(0, 300) + "…" : t).replace(/class="bref"/g, 'class="bref ok"'); }
  } catch(e){}
}
function rpMark(){ document.querySelectorAll("#rpRes .rpi").forEach((d, k) => { d.classList.toggle("sel", k === RP.sel); if (k === RP.sel) d.scrollIntoView({block:"nearest"}); }); }
function rpGraph(){                                  // عند تغيّر إعدادات الغرافات أو الوجهة (Roam / Obsidian)
  $("#rpBar").hidden = false; $("#rpBox").hidden = obDraft(); $("#rpRes").hidden = true; rpDot(); barMark(); ALLP = null;

  TABS.list = TABS.list.filter(t => t.kind === "draft" || t.kind === "voice" || t === TABS.cur || CFG.roam.graphs.some(g => g.name === t.graph));

}




/* ---- مزامنة الوثيقة المعروضة وحدها (زر ↻ أو Alt+R) ---- */
async function syncDoc(){
  const d = DOC; if (!d || RQ.SYNC.running) return;
  if (!navigator.onLine){ toast("لا شبكة الآن"); return; }
  await saveDoc(); rpState("يزامن…", "dirty");
  const spec = d.kind === "page" ? {kind:"page", title:d.title} : {kind:"block", uid:d.uid};
  const ok = await RQ.sync(false, d.pageUid);
  if (!ok && RQ.SYNC.msg) toast(RQ.SYNC.msg);
  RQ.SYNC.msg = ""; rpSyncUI();
  if (DOC === d) await openDoc(spec, true);
}

/* ============================================================
   مزامنة المسودة بين الأجهزة: كتلة كود واحدة في صفحة «المحرر/المسودة» في Roam
   ============================================================ */
const DSYNC = (function(){
  const TITLE = "المحرر/المسودة", MAIN = "rqDraftMn", PGU = "rqDraftPg";
  const H = () => { try { return parent.ENGHOOK || {}; } catch(e){ return {}; } };
  const st = Object.assign({t:0, h:"", editT:0}, (() => { try { return JSON.parse(store.get("rq-dsync") || "{}"); } catch(e){ return {}; } })());
  let state = "off", timer = 0, busy = false, again = false, page = "", copies = [], gname = "";
  const save = () => store.set("rq-dsync", JSON.stringify(st));
  const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return s.length + ":" + h; };
  const ser = list => list.map(n => { const o = {x:n.text}; if (n.collapsed) o.c = 1; if (n.children.length) o.k = ser(n.children); return o; });
  const de = list => (list || []).map(o => { const n = mk(o.x || "", de(o.k)); if (o.c) n.collapsed = true; return n; });
  const mainModel = () => ACTIVE === "main" ? model : (CTXS.main.model || []);
  const body = m => (m.length === 1 && m[0].hdr) ? m[0].children : m;
  const local = () => ({v:1, dest:CFG.dest, m:ser(body(mainModel()))});
  const enabled = () => !!graphName();
  function graphName(){
    if (EMBED){ const h = H(); return h.dsGraph ? h.dsGraph() : ""; }
    const want = store.get("rq-dsync-graph"); if (want === "-") return "";
    const g = CFG.roam.graphs.find(x => x.name === want && x.token) || CFG.roam.graphs.find(x => x.token); return g ? g.name : "";
  }
  async function call(kind, b){
    if (EMBED){ const h = H(); if (!h.dsCall) throw new Error("لا اتصال"); return await h.dsCall(kind, b); }
    const g = CFG.roam.graphs.find(x => x.name === gname); if (!g || !g.token) throw new Error("لا رمز للغراف");
    const r = await fetch("https://api.roamresearch.com/api/graph/" + encodeURIComponent(g.name) + "/" + kind, {method:"POST", headers:{"X-Authorization":"Bearer " + g.token, "Content-Type":"application/json"}, body:JSON.stringify(b)});
    return {ok:r.ok, status:r.status, text:await r.text()};
  }
  function setState(s){ state = s; if (EMBED){ const h = H(); h.dsState && h.dsState(s); } else if (typeof rpDot === "function") rpDot(); }
  const wrap = o => "```json\n" + JSON.stringify(o) + "\n```";
  const unwrap = s => { try { return JSON.parse(String(s || "").replace(/^\s*```[a-z]*\n?/, "").replace(/\n?```\s*$/, "")); } catch(e){ return null; } };
  function apply(o){                                  // ضع النسخة الواردة في المسودة كما هي
    let nodes = de(o.m);
    if (o.dest !== CFG.dest){
      if (EMBED){ CFG.dest = o.dest === "obsidian" ? "obsidian" : "roam"; saveCfg(); applyDest(); const h = H(); h.mode && h.mode(); }
      else nodes = convertModel(nodes, o.dest === "obsidian" ? "obsidian" : "roam", CFG.dest);
    }
    const m = (!EMBED && S.header && !obDest()) ? [mkHeader(nodes.length ? nodes : [mk("")])] : (nodes.length ? nodes : [mk("")]);
    if (obDest() && !EMBED) OBFD = obsFileDir();
    if (ACTIVE === "main"){ model = m; editingId = null; render(); } else CTXS.main.model = m;
    st.h = hash(JSON.stringify(local().m)); st.editT = o.t; save(); draftSave();
  }
  async function ensurePageUid(){
    if (page) return page;
    const r = await call("q", {query:"[:find ?u . :in $ ?t :where [?e :node/title ?t] [?e :block/uid ?u]]", args:[TITLE]});
    if (!r.ok) throw new Error("Roam (" + r.status + ")");
    let u = null; try { u = JSON.parse(r.text).result; } catch(e){}
    if (!u){ await ensurePage(call, PGU, TITLE); u = PGU; }
    return page = u;
  }
  async function now(force){
    if (!enabled()){ setState("off"); return; }
    if (busy){ again = true; return; }
    if (!navigator.onLine){ setState("pend"); return; }
    busy = true; clearTimeout(timer); gname = graphName(); setState("busy");
    if (gname !== st.g){ page = ""; copies = []; st.t = 0; st.h = ""; st.g = gname; save(); }   // تغيّر غراف المزامنة: صفحته وحالته غير التي قبله
    try {
      const pu = await ensurePageUid();
      const r = await call("q", {query:"[:find ?u ?s :in $ ?p :where [?pg :block/uid ?p] [?pg :block/children ?b] [?b :block/uid ?u] [?b :block/string ?s]]", args:[pu]});
      if (!r.ok) throw new Error("Roam (" + r.status + ")");
      let rows = []; try { rows = JSON.parse(r.text).result || []; } catch(e){}
      let main = null, hasMain = false; copies = [];
      for (const [u, s] of rows){ const o = unwrap(s); if (u === MAIN){ hasMain = true; if (o && o.m) main = o; } else if (o && o.m) copies.push(Object.assign({u}, o)); }
      copies.sort((a, b) => (b.t || 0) - (a.t || 0));
      const loc = local(), lh = hash(JSON.stringify(loc.m)), empty = !JSON.stringify(loc.m).replace(/"x":""/g, "").match(/"x":/), dirty = lh !== st.h && !empty;
      if (main && (main.t || 0) > st.t){
        if (!dirty){ apply(main); st.t = main.t; save(); }
        else {                                       // كُتب في الجهازين: الأحدث يبقى، والأقدم يُحفظ «نسخة لم تُدمج»
          const mine = Object.assign({}, loc, {t:st.editT || Date.now(), dev:EMBED ? "الهاتف" : "الحاسوب", copy:1});
          const older = (st.editT || 0) >= main.t ? Object.assign({}, main, {copy:1}) : mine, cu = newUid();
          const w = await call("write", {action:"create-block", location:{"parent-uid":pu, order:"last"}, block:{uid:cu, string:wrap(older)}});
          if (w.ok) copies.unshift(Object.assign({u:cu}, older));
          if (older === mine){ apply(main); st.t = main.t; save(); }
        }
      }
      const loc2 = local(), lh2 = hash(JSON.stringify(loc2.m));
      if (lh2 !== st.h || !hasMain){
        const o = Object.assign(loc2, {t:st.editT || Date.now(), dev:EMBED ? "الهاتف" : "الحاسوب"});
        const w = hasMain ? await call("write", {action:"update-block", block:{uid:MAIN, string:wrap(o)}})
                          : await call("write", {action:"create-block", location:{"parent-uid":pu, order:0}, block:{uid:MAIN, string:wrap(o)}});
        if (!w.ok) throw new Error("Roam (" + w.status + ")");
        st.t = o.t; st.h = lh2; save();
      }
      setState("ok"); drawNote();
      if (force) toast("زُومنت المسودة");
    } catch(e){ setState("err"); if (force) toast("تعذّرت مزامنة المسودة: " + e.message); }
    finally { busy = false; if (again){ again = false; setTimeout(() => now(false), 300); } }
  }
  function changed(){                                 // تغيّرت المسودة: ارفعها بعد لحظات من التوقف عن الكتابة
    if (!enabled() || !st.t && !JSON.stringify(local().m).replace(/"x":""/g, "").match(/"x":/)) return;
    const h = hash(JSON.stringify(local().m)); if (h === st.h) return;
    st.editT = Date.now(); save(); setState("pend");
    clearTimeout(timer); timer = setTimeout(() => now(false), 3000);
  }

    if (pz && e.touches.length < 2){ pz = null; const h = H(); h.fsDone && h.fsDone(); }
    clearTimeout(T.tm); const m = T.m; T.m = "";
    if (m === "move"){ if (BD.on) bdUp(); else BD.n = null; T.swallow = Date.now(); }
    else if (m === "ext") T.swallow = Date.now();
  };
  document.addEventListener("touchend", end); document.addEventListener("touchcancel", end);
  document.addEventListener("click", e => { if (T.swallow && Date.now() - T.swallow < 450){ e.stopPropagation(); e.preventDefault(); T.swallow = 0; } }, true);
  const oldPaint = bsPaint;
  bsPaint = function(){ oldPaint(); const h = H(); h.bs && h.bs(BS.ids.length > 0); };
  host.addEventListener("contextmenu", e => { if (e.target.closest(".bullet")) e.preventDefault(); });
}

function hdrSwitch(){                                // الكتابة تحت ترويسة التاريخ أو بدونها — يُحفظ في إعدادات الغراف
  if (obDest()) return; const g = curGraph(); if (!g) return;
  const old = S.header; g.header = !old; graphChanged(old);
  toast(g.header ? "الكتابة تحت ترويسة التاريخ" : "الكتابة بلا ترويسة التاريخ");
}
function modeSwitch(){
  RP.mode = RP.mode === 2 ? 1 : 2; store.set("rq-smode", String(RP.mode));
  if ($("#rpQ").value.trim()) rpDraw(); toast(RP.mode === 2 ? "البحث: مجرّد" : "البحث: مطابق");
}

if (EMBED) embedInit(); else {
applyView();
init(); rpInit(); sideInit();
if (draftLoad()) render();
tabsInit();
VC.start();
setTimeout(() => DSYNC.now(false), 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && inDraft()) DSYNC.now(false); });
}
document.addEventListener("keydown", e => {
  if (!e.altKey || e.ctrlKey || e.shiftKey) return;
  if (e.code === "KeyR" && inDraft()){ e.preventDefault(); DSYNC.now(true); }
  else if (e.code === "KeyR" && DOC){ e.preventDefault(); syncDoc(); }
  else if (e.code === "KeyS" && TABS.cur && TABS.cur.kind === "graph"){ e.preventDefault(); $("#btnSplit").click(); }
  else if (e.code === "KeyW"){ e.preventDefault(); $("#btnWide").click(); }
  else if (e.code === "KeyH" && !obDest()){ e.preventDefault(); hdrSwitch(); }
  else if (e.code === "KeyM" && !obDest()){ e.preventDefault(); modeSwitch(); }
});
