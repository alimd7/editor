<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- أمان: لا يُسمح للصفحة بأي اتصال بالشبكة (لا fetch ولا XHR ولا مصادر خارجية) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: 'self'; manifest-src 'self'; worker-src 'self' blob:; connect-src https://api.roamresearch.com https://*.api.roamresearch.com:*;">
<title>المحرر (Roam)</title>
<link rel="manifest" href="manifest.webmanifest">
<script>window.DEST_START="roam";</script>
<meta name="theme-color" content="#1a7fc4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a7fc4'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23fff'/%3E%3Crect x='30' y='16' width='24' height='8' rx='4' fill='%23fff'/%3E%3Ccircle cx='20' cy='44' r='5' fill='%23fff'/%3E%3Crect x='30' y='40' width='24' height='8' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#ffffff; --panel:#f6f8fa; --text:#1f2933; --muted:#7b8794; --line:#d9e0e6;
  --accent:#1a7fc1; --accent-ink:#ffffff; --link:#1a7fc1; --bullet:#3c4a57; --halo:#d5dde3;
  --danger:#d33; --mark:#fff3a3; --code:#eef1f4; --hover:#eef3f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f2428; --panel:#2a3036; --text:#e4e9ee; --muted:#8a96a3; --line:#3b444d;
    --accent:#3b97d3; --accent-ink:#ffffff; --link:#58a9e0; --bullet:#c3ccd5; --halo:#3b444d;
    --danger:#ff6b6b; --mark:#5c5420; --code:#2f363d; --hover:#2f363d;
  }
}
:root[data-theme="dark"]{
  --bg:#1f2428; --panel:#2a3036; --text:#e4e9ee; --muted:#8a96a3; --line:#3b444d;
  --accent:#3b97d3; --accent-ink:#ffffff; --link:#58a9e0; --bullet:#c3ccd5; --halo:#3b444d;
  --danger:#ff6b6b; --mark:#5c5420; --code:#2f363d; --hover:#2f363d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.55}
#app.wide{max-width:none}
#app{max-width:640px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:10px;min-height:100%}
.field{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:flex;align-items:center;min-height:40px}
.field label{color:var(--muted);padding:0 12px;white-space:nowrap;font-size:14px}
.field select,.field .pick{flex:1;border:0;background:transparent;color:var(--text);font:inherit;padding:8px 4px;outline:none;text-align:start;cursor:pointer}
.field .pick{display:flex;justify-content:space-between;gap:8px;align-items:center;padding-inline-end:12px}
.pick .date{color:var(--muted);font-size:14px;direction:ltr}
.field:focus-within{border-color:var(--accent)}
#pagepanel{position:absolute;z-index:20;inset-inline:0;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;flex-direction:column;max-height:320px}
#pagepanel.open{display:flex}
#pq{border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font:inherit;padding:9px 12px;outline:none}
#plist{list-style:none;margin:0;padding:4px;overflow:auto}
#plist li,.sug li{padding:6px 10px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#plist li small,.sug li small{color:var(--muted);direction:ltr}
#plist li.sel,.sug li.sel{background:var(--accent);color:var(--accent-ink)}
#plist li.sel small,.sug li.sel small{color:var(--accent-ink);opacity:.85}
#plist li.empty{color:var(--muted);cursor:default}

#outline{padding:8px 2px 0;flex:1}
.block{margin:0}
.row{display:flex;align-items:flex-start;gap:6px;position:relative;border-radius:4px}
.tg{width:14px;flex:none;color:var(--muted);font-size:11px;line-height:26px;text-align:center;cursor:pointer;opacity:0;user-select:none}
.row:hover .tg{opacity:1}
.bullet{flex:none;width:18px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bullet::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bullet)}
.bullet.collapsed::before{box-shadow:0 0 0 4px var(--halo)}
.content{flex:1;min-width:0;position:relative}
.view,textarea.ed{width:100%;min-height:26px;padding:0 2px;margin:0;font:inherit;line-height:26px;word-break:break-word;white-space:pre-wrap;cursor:text}
textarea.ed{display:block;border:0;outline:0;background:transparent;color:var(--text);resize:none;overflow:hidden;line-height:26px}
.view .ph{display:inline-block;min-width:1px}
.children{margin-inline-start:9px;padding-inline-start:12px;border-inline-start:1px solid var(--line)}
.link{color:var(--link);unicode-bidi:isolate}
.link .br{color:var(--muted)}
.ext{color:var(--link);text-decoration:underline}
.view.h1{font-size:1.45em;font-weight:700}.view.h2{font-size:1.25em;font-weight:700}.view.h3{font-size:1.1em;font-weight:700}
.view.quote{border-inline-start:3px solid var(--line);padding-inline-start:10px;color:var(--muted)}
.view table.mdt{border-collapse:collapse;margin:3px 0}.view table.mdt th,.view table.mdt td{border:1px solid #cfd6dd;padding:3px 10px}.view table.mdt th{background:#eef1f4}
#outline.plain .tg,#outline.plain .bullet{display:none}
#outline.plain .row.hastg .tg{display:block;position:absolute;inset-inline-start:-16px;top:0;line-height:inherit}
#outline.plain .row.col .tg{opacity:1}
.fade{color:var(--muted);font-weight:400}
#outline.plain .row{gap:0}
#outline.plain .view,#outline.plain textarea.ed{padding:0 6px}
.oli{display:flex;gap:.45em}.omk{flex:none;min-width:1.1em;text-align:center;color:var(--muted)}.otx{flex:1;min-width:0}
.otag{color:var(--link)}
#obsWrap{position:relative}#obsWrap[hidden]{display:none}
#obsText{unicode-bidi:plaintext;text-align:right;display:block;width:100%;min-height:38vh;border:0;outline:0;background:transparent;color:var(--text);font:inherit;line-height:1.75;resize:none;overflow:hidden;padding:4px 6px}
.view hr.hr{border:0;border-top:2px solid #cfd6dd;margin:12px 0;width:100%}
.view pre{white-space:pre-wrap;direction:ltr;text-align:left;background:var(--code);padding:6px 10px;border-radius:6px;font-family:Consolas,monospace;font-size:.92em;margin:2px 0}
.view mark{background:var(--mark);color:inherit;border-radius:2px}
.view code{background:var(--code);border-radius:3px;padding:0 4px;font-family:Consolas,monospace;font-size:.92em;direction:ltr;unicode-bidi:isolate}

.sug{position:absolute;z-index:30;list-style:none;margin:2px 0 0;padding:4px;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2);min-width:240px;max-width:100%;max-height:260px;overflow:auto;inset-inline-start:0}

.actions{display:flex;justify-content:flex-start;align-items:center;gap:12px;padding-top:8px;border-top:1px solid var(--line)}
.actions button{white-space:nowrap}
.keys{line-height:1.7}
button{font:inherit;cursor:pointer}
.send{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:6px 26px}
.send:hover{filter:brightness(1.07)}
.ghost{background:transparent;border:0;color:var(--muted);padding:6px 8px;border-radius:4px}
.ghost:hover{background:var(--hover)}
.ghost.danger{color:var(--danger)}
.spacer{flex:1}
.hint{color:var(--muted);font-size:12.5px}

#settings{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;display:none;flex-direction:column;gap:8px;font-size:14px}
#settings.open{display:flex}
#settings label{display:flex;gap:8px;align-items:center}
#settings input[type=text]{flex:1;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);direction:ltr}

#toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#333;color:#fff;padding:8px 14px;border-radius:8px;
  opacity:0;transition:opacity .2s;pointer-events:none;font-size:14px}
#toast.show{opacity:.95}
#out{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#out.open{display:flex}
#outbox{background:var(--bg);border-radius:10px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line)}
#outbox h3{margin:0;font-size:16px}
#outbox textarea{width:100%;height:170px;font-family:Consolas,monospace;font-size:13px;direction:ltr;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px}
#outbox .bar{display:flex;gap:8px;align-items:center}

.view.h4{font-size:1.05em;font-weight:700}.view.h5{font-size:1em;font-weight:700}.view.h6{font-size:.95em;font-weight:700;color:var(--muted)}
#destbar{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#destbar button{flex:1;border:0;background:var(--bg);color:var(--muted);padding:7px 10px}
#destbar button.on{background:var(--accent);color:var(--accent-ink)}
.box{display:flex;flex-direction:column;gap:10px}
.box[hidden]{display:none}
.field input{flex:1;border:0;background:transparent;color:var(--text);font:inherit;padding:8px 4px;outline:none;min-width:0}
.field .ghost{white-space:nowrap}
.sbox{position:absolute;z-index:25;inset-inline:0;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--line);border-radius:6px;margin:0;padding:4px;list-style:none;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none}
.sbox.open{display:block}
.sbox li{padding:5px 9px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sbox li small{color:var(--muted);direction:ltr}
.sbox li.sel,.sbox li:hover{background:var(--hover)}
#oStatus,#oScan{padding:0 4px}
#settings h4{margin:6px 0 0;font-size:13px;color:var(--muted)}
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gform{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.gform label,#settings label{display:flex;gap:8px;align-items:center}
#settings select{font:inherit;padding:4px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text)}
#settings input[type=text],#settings input[type=password]{flex:1;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text)}
.tout{white-space:pre-wrap;font-size:12px;margin:0}

/* ---- لوحة Roam الجانبية ---- */
#rp[hidden],#rpBar[hidden],#rpSyncBox[hidden],#rpRes[hidden],#rpDoc[hidden],#rpDoc [hidden]{display:none!important}
body.docview #outline,body.docview #pagefield,body.docview #btnSend,body.docview #btnClear{display:none}
body.rpopen{padding-left:46vw}
#rp{position:fixed;top:0;bottom:0;left:0;width:46vw;overflow:auto;padding:14px 16px 60px;background:var(--bg);border-right:1px solid var(--line);z-index:20}
#rpBar{display:flex;gap:6px;align-items:center}
#rpQ{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:17px;padding:0 14px;background:var(--bg);color:var(--text);font:inherit;outline:0}
#rpQ:focus{border-color:var(--accent)}
#rpMode.on,#rpSync.on{color:var(--accent)}
#rpMode.on{background:var(--accent);color:var(--accent-ink);border-radius:14px}
#rpSyncBox{padding:4px 6px}
#rpSyncBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#rpRes{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 6px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.rpi{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.rpi.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.rpi .pic{flex:none;width:16px;color:var(--muted);text-align:center}
.rpi .tt{flex:1;min-width:0;word-break:break-word;unicode-bidi:plaintext}
.rpi .sn b{background:#ffe27a;color:#000;font-weight:inherit;border-radius:3px}
.rpi small{display:block;color:var(--muted);font-size:12px}
.rpi .pen{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:12px;padding:0 8px;cursor:pointer;font:inherit}
.rpi .pen:hover{color:var(--accent);border-color:var(--accent)}
.rphd{padding:6px 8px 2px;color:var(--muted);font-size:12px}
#rpDoc{padding:4px 0 40px}
body.docview #docSlot{flex:1}
#rpSplit.on{color:var(--accent)}
.link,.bref,.ext{cursor:pointer}
.bref{border-bottom:1px dashed var(--muted)}
.ext{text-decoration:underline}
#outline2 .bullet{cursor:pointer}
#rpHead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
#rpTitle{flex:1;font-weight:700;font-size:1.15em;unicode-bidi:plaintext;cursor:default}
#rpTitle[title]:not([title=""]){cursor:pointer}
#rpState{flex:none;color:var(--muted);font-size:12px}
#rpState.dirty{color:var(--accent)}
#rpCtx{color:var(--muted);border-inline-start:3px solid var(--line);padding:2px 10px;margin:0 0 6px;cursor:pointer;font-size:.92em}
#outline2{padding:4px 2px 0}
body.pgactive #outline2{outline:0}
#rpRefs{margin-top:18px}
.rfg{margin:6px 0 12px}
.rft{font-weight:700;font-size:.9em;color:var(--accent);cursor:pointer;padding:2px 0}
.rfh{cursor:pointer;font-size:13px}
#rpRefs .block .view{cursor:pointer}
#rpRefs .block .row:hover>.content>.view{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.rfb{border-inline-start:2px solid var(--line);padding:2px 10px;margin:4px 0;cursor:pointer;border-radius:0 4px 4px 0}
.rfb:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
mark.hit{background:#ffd54a;color:#000;border-radius:3px}
.sug.wide{min-width:min(560px,100%)}
.sug.wide li{align-items:flex-start}
.sug.wide li span{unicode-bidi:plaintext}
.sug.wide li small{flex:none;direction:rtl;max-width:30%}
.cal{position:absolute;z-index:31;inset-inline-start:0;margin-top:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:8px;width:238px;user-select:none}
.calh{font-weight:700;text-align:center;margin-bottom:4px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg .wd{color:var(--muted);font-size:12px}
.calg .dy{line-height:28px;border-radius:6px;cursor:pointer}
.calg .dy:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.calg .dy.td{outline:1px solid var(--accent)}
.calg .dy.sel{background:var(--accent);color:var(--accent-ink)}
.calf{color:var(--muted);font-size:11px;text-align:center;margin-top:6px}
@media (max-width:900px){body.rpopen{padding-left:0}#rp{width:100vw}}
</style>
</head>
<body>
<div id="app">
  <div id="destbar"><button data-dest="roam">Roam Research</button><button data-dest="obsidian">Obsidian</button></div>
  <div id="rpBar">
    <input id="rpQ" dir="auto" autocomplete="off" spellcheck="false" placeholder="ابحث في الصفحات والنصوص…" title="Ctrl+Shift+F">
    <button id="rpMode" class="ghost" title="تجريد الكلمات من الزوائد، ووجودها كلها في الكتلة ولو متفرقة">مجرّد</button>
    <button id="rpSync" class="ghost" title="تحميل الغراف والمزامنة">⇅</button>
  </div>
  <div id="rpSyncBox" hidden><div id="syncMsg" class="hint"></div><div id="rpSyncBtns"></div></div>
  <div id="rpRes" hidden></div>

  <div id="roamBox" class="box">
    <div class="field">
      <label for="graph">الغراف:</label>
      <select id="graph"></select>
      <button class="ghost" id="btnPages" title="تحديث قائمة الصفحات من Roam (F9)">↻</button>
      <span class="hint" id="pagesInfo"></span>
    </div>
    <div class="field" id="pagefield">
      <label>الصفحة:</label>
      <div class="pick" id="pagebtn" tabindex="0" role="button" aria-haspopup="listbox">
        <span id="pagelabel">اليوم</span><span class="date" id="pagedate"></span>
      </div>
      <div id="pagepanel">
        <input id="pq" placeholder="اكتب لتصفية الصفحات…" autocomplete="off">
        <ul id="plist"></ul>
      </div>
    </div>
  </div>

  <div id="obsBox" class="box" hidden>
    <div class="field">
      <label for="vault">الخزنة:</label>
      <select id="vault"></select>
      <button class="ghost" id="btnVaultPerm" hidden title="يحتاج المتصفح إذنك مرة بعد كل فتح">تفعيل</button>
      <button class="ghost" id="btnAddVault" title="إضافة خزنة">＋</button>
      <button class="ghost danger" id="btnDelVault" title="إزالة هذه الخزنة من القائمة (لا يحذف ملفاتك)">✕</button>
    </div>
    <div class="srow"><span class="hint" id="oScan"></span><button class="ghost" id="btnRescan" title="إعادة الفهرسة (F9)">↻</button></div>
    <div class="field"><label>المجلد:</label><input id="oFolder" dir="auto" autocomplete="off"></div>
    <div class="field"><label>الملف:</label><input id="oName" dir="auto" autocomplete="off"><button class="ghost" id="oToday" title="ملاحظة اليوم">اليوم</button></div>
    <div class="hint" id="oStatus"></div>
    <div id="oMeta" class="box"></div>
  </div>

  <div id="outline"></div>
  <div id="docSlot"><div id="rpDoc" hidden>
    <div id="rpHead"><button id="rpDraft" class="ghost" title="ارجع إلى المسودة">↩ المسودة</button><span id="rpTitle"></span><span id="rpState"></span><button id="rpSplit" class="ghost" title="اعرض الوثيقة بجانب المسودة، أو مكانها">◫</button></div>
    <div id="rpCtx" hidden></div>
    <div id="outline2"></div>
    <div id="rpMore" class="hint" hidden></div>
    <div id="rpRefs"></div>
  </div></div>
  <div id="obsWrap" hidden></div>

  <div class="actions">
    <button class="send" id="btnSend" title="Ctrl+Enter">إرسال</button>
    <button class="ghost danger" id="btnClear" title="مسح كل ما كتبت">🗑 مسح</button>
    <span class="spacer"></span>
    <button class="ghost" id="btnWide" title="عرض الصفحة كاملاً / عرض محدود">↔</button>
    <button class="ghost" id="btnSettings" title="إعدادات">⚙</button>
  </div>

  <div id="settings"></div>
</div>

<aside id="rp" hidden></aside>
<div id="toast"></div>
<div id="out">
  <div id="outbox">
    <h3>الناتج <span class="hint" id="outnote"></span></h3>
    <div class="hint">Markdown:</div>
    <textarea id="outMd" readonly></textarea>
    <div class="bar"><button class="ghost" data-copy="outMd" style="border:1px solid var(--line)">نسخ Markdown</button></div>
    <div class="hint">JSON (للإرسال البرمجي لاحقاً):</div>
    <textarea id="outJson" readonly></textarea>
    <div class="bar"><button class="ghost" data-copy="outJson" style="border:1px solid var(--line)">نسخ JSON</button>
      <span class="spacer"></span><button class="ghost" id="outClose">إغلاق</button></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   إعدادات يمكنك تعديلها
   ============================================================ */
const CONFIG = {
  graphs: ["Qamos"],                 // أسماء الغرافات (لاحقاً يمررها AutoHotkey)
  defaultHeader: true,
  headerTemplate: "[[{date}]] at {time}",
  demoPages: [                        // قائمة تجريبية حتى تحمّل قائمتك الحقيقية
    "ج/ضرب","ج/ضرع","ج/ضرر","ج/ضبط","ج/كتب","ج/علم","ج/عرب","ج/قول",
    "لسان العرب/1","لسان العرب/2","تاج العروس/1","القاموس المحيط/ض","الصحاح",
    "حاشية ابن بري","مشروع المعاني","أفكار للبحث","November 12th, 2026","November 13th, 2026"
  ]
};

/* ============================================================
   أدوات عامة
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function ord(d){ const r=d%10; if (d>=11&&d<=13) return d+"th"; return d+(r===1?"st":r===2?"nd":r===3?"rd":"th"); }
function dailyTitle(dt=new Date()){ return MONTHS[dt.getMonth()]+" "+ord(dt.getDate())+", "+dt.getFullYear(); }
const p2 = n => String(n).padStart(2,"0");
function timeStr(dt=new Date()){ return p2(dt.getHours())+":"+p2(dt.getMinutes()); }
function isoStr(dt=new Date()){ return dt.getFullYear()+"-"+p2(dt.getMonth()+1)+"-"+p2(dt.getDate()); }
function norm(s){
  return s.toLowerCase().replace(/[ً-ْٰـ]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي");
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600); }

  dest:"roam", dir:"rtl", wide:false,

const curGraph = () => CFG.roam.graphs.find(g => g.name===CFG.roam.current) || CFG.roam.graphs[0];
function syncS(){
  const g = curGraph(); CFG.roam.current = g.name;
  S.graph = g.name; S.tpl = g.tpl || CONFIG.headerTemplate;
  S.header = CFG.dest==="roam" ? !!g.header : false;
  S.page = (g.pageMode==="last" && g.lastPage) ? g.lastPage : {kind:"today",title:""};
  S.dir = CFG.dir; S.wide = CFG.wide;

function loadState(){
  try{
    const o = JSON.parse(store.get("rq-cfg") || "null");
    if (o){
      CFG.dest = o.dest==="obsidian" ? "obsidian" : "roam";
      CFG.dir = o.dir==="auto" ? "auto" : "rtl"; CFG.wide = !!o.wide;
      if (o.roam && Array.isArray(o.roam.graphs) && o.roam.graphs.length){
        CFG.roam.graphs = o.roam.graphs.map(g => Object.assign(DEFAULT_GRAPH(), g));
        CFG.roam.current = o.roam.current;
      }
      if (o.obs) Object.assign(CFG.obs, o.obs);
    } else {                                           // ترحيل من النسخة السابقة
      const old = JSON.parse(store.get("rq-state") || "{}"), g = CFG.roam.graphs[0];
      if (typeof old.header==="boolean") g.header = old.header;
      if (old.tpl) g.tpl = old.tpl;
      if (old.page) g.lastPage = old.page;
      const tk = store.get("rq-token:"+g.name); if (tk){ g.token = tk; g.saveToken = true; }
      if (old.dir==="auto") CFG.dir = "auto";
      if (typeof old.wide==="boolean") CFG.wide = old.wide;
    }
  }catch(e){}
  if (window.DEST_START) CFG.dest = window.DEST_START;     // كل تطبيق مثبّت يفتح على وجهته
  syncS();
}
function saveCfg(){
  const c = JSON.parse(JSON.stringify(CFG));
  c.roam.graphs.forEach(g => { if (!g.saveToken) g.token = ""; });   // الرمز لا يُحفظ إلا إن طلبت
  store.set("rq-cfg", JSON.stringify(c));
}
function saveState(){
  const g = curGraph(); g.lastPage = S.page;
  if (CFG.dest==="roam") g.header = S.header;
  g.tpl = S.tpl; CFG.dir = S.dir; CFG.wide = S.wide; saveCfg();

  if (CFG.dest!=="roam"){ el2.textContent = ""; return; }
  const raw = store.get("rq-pages:"+S.graph);
  el2.textContent = raw ? S.pages.length.toLocaleString("ar-EG")+" صفحة" : "صفحات تجريبية";

async function refreshPages(){
  const g = curGraph(), tok = getToken();
  if (!g){ toast("لا يوجد غراف"); return; }
  if (!tok){ toast("أضف رمز الغراف في ⚙ الإعدادات أولاً"); return; }
  const btn = $("#btnPages"); btn.disabled = true; btn.textContent = "…";
  try {

let nextId = 1;
const mk = (text="", children=[]) => ({id: nextId++, text, children, collapsed:false});
let model = [];
let editingId = null, pendingCaret = null, pendingCaretEnd = null, rendering = false;

/* ---------- التراجع والإعادة ---------- */
const HIST = {past:[], future:[], mark:0};
function snap(){
  const t = document.activeElement, ed = t && t.tagName==="TEXTAREA" && t.classList.contains("ed");
  return {m:JSON.parse(JSON.stringify(model)), n:nextId, id:editingId,
          c: ed ? t.selectionStart : null, e: ed ? t.selectionEnd : null};
}
const HIST_MAX_KB = 6000;                          // سقف ذاكرة التراجع: ٦ م.ب تقريباً
function pushHist(coalesce){                       // الكتابة المتتابعة خطوة واحدة
  const now = Date.now();
  if (coalesce && HIST.past.length && now-HIST.mark < 700){ HIST.mark = now; HIST.future.length = 0; if (ACTIVE === "page") docTouch(); return; }
  HIST.mark = coalesce ? now : 0;
  if (ACTIVE === "page") docTouch();
  const st = snap();
  st.kb = Math.ceil(JSON.stringify(st.m).length/1024);
  HIST.past.push(st);
  let kb = HIST.past.reduce((a,x) => a + (x.kb||1), 0);
  while (HIST.past.length > 1 && (HIST.past.length > 150 || kb > HIST_MAX_KB)) kb -= (HIST.past.shift().kb||1);
  HIST.future.length = 0;
}
function histBreak(){ HIST.mark = 0; }
function applySnap(st){
  model = st.m; nextId = st.n; editingId = st.id;
  pendingCaret = st.c; pendingCaretEnd = st.e; closeSug(); render(); if (ACTIVE === "page") docTouch();
}
function undo(){ if (!HIST.past.length){ toast("لا يوجد ما يُتراجع عنه"); return; } HIST.future.push(snap()); histBreak(); applySnap(HIST.past.pop()); }
function redo(){ if (!HIST.future.length) return; HIST.past.push(snap()); histBreak(); applySnap(HIST.future.pop()); }


/* سياقان للمحرك نفسه: «main» ما تكتبه للإرسال، و«page» وثيقة Roam في اللوحة */
const CTXS = {main:{model:null, hist:null}, page:{model:[], hist:{past:[], future:[], mark:0}}};
let ACTIVE = "main";
const HOST = () => $(ACTIVE === "page" ? "#outline2" : "#outline");
function activate(name){
  if (ACTIVE === name) return;
  if (editingId != null){ editingId = null; closeSug(); render(); }
  const c = CTXS[ACTIVE]; c.model = model; c.hist = {past:HIST.past, future:HIST.future, mark:HIST.mark};
  ACTIVE = name; const x = CTXS[name]; model = x.model || []; const h = x.hist || {past:[], future:[], mark:0};
  HIST.past = h.past; HIST.future = h.future; HIST.mark = h.mark; selAll = false;
  document.body.classList.toggle("pgactive", name === "page");
}
function loc(id, list=model, parent=null){
  for (let i=0;i<list.length;i++){
    if (list[i].id===id) return {list, index:i, parent, node:list[i]};
    const r = loc(id, list[i].children, list[i]); if (r) return r;
  }
  return null;
}
function visible(list=model, out=[]){
  if (typeof isOb==="function" && isOb() && list===model && !out.length) return obsVisible();
  for (const n of list){ out.push(n); if(!n.collapsed) visible(n.children,out);} return out;
}
function depthOf(id){ let d=0, L=loc(id); while(L && L.parent){ d++; L=loc(L.parent.id);} return d; }

function headerText(){
  const now = new Date();
  return S.tpl.replace(/\{date\}/g, dailyTitle(now)).replace(/\{time\}/g, timeStr(now)).replace(/\{iso\}/g, isoStr(now));
}

function freshModel(){

  else { const b = mk(""); model=[b]; editingId = b.id; }

}

/* ============================================================
   العرض
   ============================================================ */
function renderInline(text){
  if (/^\s*---\s*$/.test(text)) return '<hr class="hr">';
  const tr = tableRows(text);
  if (tr){
    const cell = (c,t) => "<"+t+">"+renderInline(mdInline(c))+"</"+t+">";
    return '<table class="mdt"><thead><tr>'+tr[0].map(c=>cell(c,"th")).join("")+'</tr></thead><tbody>'+
      tr.slice(1).map(r => "<tr>"+r.map(c=>cell(c,"td")).join("")+"</tr>").join("")+'</tbody></table>';
  }
  const parts = text.split(/(```[\s\S]*?```)/);
  if (parts.length > 1){
    return parts.map(pt => /^```[\s\S]*```$/.test(pt)
      ? '<pre>' + esc(pt.replace(/^```[^\n]*\n?/,"").replace(/\n?```$/,"")) + '</pre>'
      : (pt ? renderInline(pt) : "")).join("");
  }
  let h = esc(text);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\{\{(?:\[\[)?TODO(?:\]\])?\}\}/g, "☐").replace(/\{\{(?:\[\[)?DONE(?:\]\])?\}\}/g, "☑");
  h = h.replace(/\[([^\[\]\n]+)\]\((https?:[^)\s]+)\)/g, '<span class="ext" data-h="$2">$1</span>');
  h = h.replace(/\[\[([^\[\]\n]+)\]\]/g, '<span class="link" dir="auto" data-t="$1"><span class="br">[[</span>$1<span class="br">]]</span></span>');
  h = h.replace(/(^|[\s(،؛,;])#([^\s#\[\](){}<>&.,،؛!?:"]+)/g, '$1<span class="link tag" dir="auto" data-t="$2">#$2</span>');
  h = h.replace(/\(\(([\w-]{6,})\)\)/g, '<span class="bref" data-u="$1">(($1))</span>');
  h = h.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<span class="ext" data-h="$2">$2</span>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/__([^_\n]+)__/g, "<em>$1</em>");
  h = h.replace(/\^\^([^\^\n]+)\^\^/g, "<mark>$1</mark>");
  h = h.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  h = h.replace(/\{\{\[\[TODO\]\]\}\}/g, "☐").replace(/\{\{\[\[DONE\]\]\}\}/g, "☑").replace(/\{\{\[\[table\]\]\}\}/g, "▦ جدول");
  h = h.replace(/\n/g, "<br>");
  return h || '<span class="ph">&#8203;</span>';
}

/* ============================================================
   Obsidian: محرر حيّ — كل سطر كتلة بلا نقاط، والجدول وكتلة الكود كتلة واحدة
   ============================================================ */
const isOb = () => CFG.dest==="obsidian";
let OBFD = "rtl";                                    // جهة الملف: بأول حرف مكتوب فيه
function obsFileDir(){
  for (const n of model){ const m = n.text.match(/[A-Za-z؀-ۿ]/); if (m) return /[A-Za-z]/.test(m[0]) ? "ltr" : "rtl"; }
  return "rtl";
}
function obsBlockDir(text){
  if (/^\s*```/.test(text)) return "ltr";
  if (OBFD==="ltr") return "auto";
  return /[؀-ۿ]/.test(text) ? "rtl" : (/[A-Za-z]/.test(text) ? "ltr" : "rtl");
}
function splitUnits(text){                           // نص ← وحدات (سطر، أو جدول كامل، أو كتلة كود كاملة)
  const ls = text.split("\n"), out = [];
  for (let i=0;i<ls.length;i++){
    const l = ls[i];
    if (/^\s*```/.test(l)){
      const buf = [l]; i++;
      while (i<ls.length){ buf.push(ls[i]); if (/^\s*```\s*$/.test(ls[i])) break; i++; }
      out.push(buf.join("\n")); continue;
    }
    if (l.includes("|") && i+1<ls.length && isSep(ls[i+1])){
      const buf = [l, ls[i+1]]; i += 2;
      while (i<ls.length && ls[i].trim()!=="" && ls[i].includes("|")){ buf.push(ls[i]); i++; }
      i--; out.push(buf.join("\n")); continue;
    }
    out.push(l);
  }
  return out;
}
const obsText = () => model.map(n => n.text).join("\n");
const headLv = t => { const m = t.match(/^(#{1,6})[ \t]/); return m ? m[1].length : 0; };
const indLv = t => Math.floor((t.match(/^[ \t]*/)[0].replace(/\t/g,"    ").length)/4);
const blankLn = t => t.trim()==="";
/* الطي نوعان: عنوان يطوي ما تحته حتى عنوان بمستواه أو أعلى، وسطرٌ يطوي ما بعده مما هو أكثر إزاحة منه */
function obsVisible(){
  const out = [], stack = [], eff = new Array(model.length);
  let nh = 0, ni = 0;                                // السطر الفارغ يتبع أول سطر غير فارغ بعده
  for (let k=model.length-1;k>=0;k--){
    const t = model[k].text;
    if (!blankLn(t)){ nh = headLv(t); ni = indLv(t); }
    eff[k] = {h:nh, i:ni};
  }
  for (let k=0;k<model.length;k++){
    const n = model[k], e = eff[k];
    while (stack.length){
      const top = stack[stack.length-1];
      if (top.stop && top.stop===n.id){ stack.pop(); continue; }     // سطر كُتب بعد المطويّ
      if (top.h ? (e.h && e.h<=top.h) : (e.h || e.i<=top.i)) stack.pop(); else break;
    }
    if (stack.length) continue;                      // مطويّ
    out.push(n);
    if (n.collapsed){ const h = headLv(n.text); stack.push(h ? {h, stop:n.foldStop} : {i:indLv(n.text), stop:n.foldStop}); }
  }
  return out;
}
function foldEnd(n){                                 // فهرس ما بعد آخر سطر مطويّ تحت هذا السطر
  const k0 = model.indexOf(n); if (k0<0) return model.length;
  const h = headLv(n.text), i = indLv(n.text);
  let last = k0;
  for (let k=k0+1;k<model.length;k++){
    const t = model[k].text;
    if (blankLn(t)) continue;
    if (h ? (headLv(t) && headLv(t)<=h) : (headLv(t) || indLv(t)<=i)) break;
    last = k;
  }
  return last+1;
}
function sibPrefix(txt){                             // بادئة السطر التالي: مثل هذا السطر مستوىً ونوعاً
  if (headLv(txt)) return "";
  const m = txt.match(/^([ \t]*)([-*+]|\d+[.)])([ \t]+)(\[[ xX]\][ \t]+)?/);
  if (m){ let k = m[2]; const num = k.match(/^(\d+)([.)])$/); if (num) k = (+num[1]+1)+num[2];
          return m[1]+k+m[3]+(m[4] ? "[ ] " : ""); }
  return txt.match(/^[ \t]*/)[0];
}
function obsFoldable(n){
  const k0 = model.indexOf(n); if (k0<0 || blankLn(n.text)) return false;
  const h = headLv(n.text);
  for (let k=k0+1;k<model.length;k++){
    const t = model[k].text;
    if (blankLn(t)) continue;
    if (h) return !(headLv(t) && headLv(t)<=h);
    return !headLv(t) && indLv(t) > indLv(n.text);
  }
  return false;
}
/* ---- موضع النقر → موضع المؤشر في النص الخام ---- */
function shownOffset(v, x, y){                       // أقرب حرف إلى نقطة النقر (أدق من caretRangeFromPoint مع الاتجاهين)
  const w = document.createTreeWalker(v, NodeFilter.SHOW_TEXT);
  const RTL = /[\u0590-\u08FF\uFB1D-\uFEFC]/;
  let t, pre = 0, best = null, bestD = Infinity;
  while ((t = w.nextNode())){
    const str = t.nodeValue;
    for (let i=0;i<str.length;i++){
      const r = document.createRange(); r.setStart(t,i); r.setEnd(t,i+1);
      const b = r.getBoundingClientRect();
      if (!b.width && !b.height) continue;
      const dy = y<b.top ? b.top-y : (y>b.bottom ? y-b.bottom : 0);
      const dx = x<b.left ? b.left-x : (x>b.right ? x-b.right : 0);
      const d = dy*2000 + dx;
      if (d < bestD){
        const edge = RTL.test(str[i]) ? b.right : b.left;        // بداية الحرف بحسب اتجاهه
        best = pre + i + (Math.abs(x-edge) > b.width/2 ? 1 : 0);
        bestD = d;
      }
    }
    pre += str.length;
  }
  return best;
}
function rawOffset(raw, shown, off){                 // محاذاة النص المعروض بالنص الخام (الرموز محذوفة)
  let i = 0, j = 0;
  while (j < off && i < raw.length){
    const c = shown[j];
    if (c===undefined) break;
    if (/[\u200e\u2066-\u2069]/.test(c)){ j++; continue; }
    if (raw[i]===c){ i++; j++; continue; }
    const k = raw.indexOf(c, i);
    if (k>=0 && k-i<=40){ i = k+1; j++; } else j++;
  }
  return i;
}
/* ---------- تظليل كل النص (Ctrl+Shift+A) ---------- */
let selAll = false;
function rawAll(){ return isOb() ? obsText() : toMd(prune(model, 6, true)).replace(/\s+$/,""); }
function selectAll(){
  editingId = null; closeSug(); render();
  const host = HOST(), sel = window.getSelection();
  const r = document.createRange(); r.selectNodeContents(host);
  sel.removeAllRanges(); sel.addRange(r);

function clearSelAll(){ if (!selAll) return; selAll = false; const s = window.getSelection(); if (s) s.removeAllRanges(); }

function clickCaret(v, raw, e){
  try {
    const off = shownOffset(v, e.clientX, e.clientY);
    if (off==null) return null;
    return rawOffset(raw, v.textContent || "", off);
  } catch(err){ return null; }
}
function normalizeObs(id, caret){                    // يعيد تقسيم النص إلى وحدات مع حفظ موضع المؤشر
  const texts = model.map(n => n.text), units = splitUnits(texts.join("\n"));
  if (units.length===model.length && units.every((u,i) => u===texts[i])) return [id, caret];
  let off = 0, g = null; const at = new Map();
  for (const n of model){
    if (n.id===id) g = off + Math.min(caret ?? n.text.length, n.text.length);
    at.set(off+"|"+n.text, n); off += n.text.length+1;
  }
  const nm = []; off = 0; let rid = id, rc = caret;
  for (const u of units){
    const node = at.get(off+"|"+u) || mk(u); nm.push(node);
    if (g!=null && g>=off && g<=off+u.length){ rid = node.id; rc = g-off; g = null; }
    off += u.length+1;
  }
  model = nm; return [rid, rc];
}
const LAT_RUN = /[^\s؀-ۿ]*[A-Za-z0-9][^\s؀-ۿ]*(?:[ \t]+[^\s؀-ۿ]*[A-Za-z0-9][^\s؀-ۿ]*)*/g;
function isoTok(s){     // تُعزل الجملة الإنجليزية كاملة، لا كل كلمة وحدها، لئلا ينعكس ترتيب كلماتها
  return s.replace(LAT_RUN, w => {
    const m = w.match(/^(.*?)([.,;:!?،؛؟]*)$/); return m[1] ? "⁦"+m[1]+"⁩"+m[2] : w;
  });
}
function fmtObs(s){
  let h = esc(s);
  h = h.replace(/\[\[([^\[\]\n|]+)(?:\|([^\[\]\n]+))?\]\]/g, (m,a,b) => '<span class="link" dir="auto"><span class="br">[[</span>'+(b||a)+'<span class="br">]]</span></span>');
  h = h.replace(/\[([^\[\]\n]+)\]\((https?:[^)\s]+)\)/g, '<span class="ext">$1</span>');
  h = h.replace(/\*\*\*([^*\n]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(?<![\p{L}\p{N}*])\*(?=[^\s*])([^*\n]+?)(?<=[^\s*])\*(?![\p{L}\p{N}*])/gu, "<em>$1</em>");
  h = h.replace(/(?<![\p{L}\p{N}_])_(?=[^\s_])([^_\n]+?)(?<=[^\s_])_(?![\p{L}\p{N}_])/gu, "<em>$1</em>");
  h = h.replace(/==([^=\n]+)==/g, "<mark>$1</mark>");
  h = h.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  h = h.replace(/(^|[\s(،؛,;⁦])#([^\s#\[\](){}<>&.,،؛!?]+)/g, '$1<span class="otag">#$2</span>');
  return h;
}
function renderObsInline(text){
  const ar = /[؀-ۿ]/.test(text);
  const h = text.split(/(`[^`\n]+`)/).map((p,i) => i%2 ? "<code>"+esc(p.slice(1,-1))+"</code>" : fmtObs(ar ? isoTok(p) : p)).join("");
  return h.replace(/\n/g, "<br>") || '<span class="ph">&#8203;</span>';
}
function renderObs(text){
  if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(text)) return '<hr class="hr">';
  const tr = tableRows(text);
  if (tr){
    const cell = (c,t) => "<"+t+">"+renderObsInline(c)+"</"+t+">";
    return '<table class="mdt"><thead><tr>'+tr[0].map(c=>cell(c,"th")).join("")+'</tr></thead><tbody>'+
      tr.slice(1).map(r => "<tr>"+r.map(c=>cell(c,"td")).join("")+"</tr>").join("")+'</tbody></table>';
  }
  if (/^\s*```/.test(text)) return '<pre>'+esc(text.replace(/^\s*```[^\n]*\n?/,"").replace(/\n?[ \t]*```[ \t]*$/,""))+'</pre>';
  const lm = text.match(/^([ \t]*)([-*+]|\d+[.)])[ \t]+(\[[ xX]\][ \t]+)?([\s\S]*)$/);
  if (lm){
    const lvl = Math.ceil(lm[1].replace(/\t/g,"    ").length/4);
    const mark = /\d/.test(lm[2]) ? esc(lm[2]) : "•";
    const box = lm[3] ? (/\[ \]/.test(lm[3]) ? "☐ " : "☑ ") : "";
    return '<div class="oli" style="padding-inline-start:'+(lvl*1.6)+'em"><span class="omk">'+mark+'</span><span class="otx">'+box+renderObsInline(lm[4])+'</span></div>';
  }
  const im = text.match(/^([ \t]+)(\S[\s\S]*)$/);
  if (im) return '<div class="oin" style="padding-inline-start:'+(indLv(text)*1.6)+'em">'+renderObsInline(im[2])+'</div>';
  return renderObsInline(text);
}
function bidiStrip(t){ return t.replace(/[‎⁦-⁩]/g, ""); }

function renderList(nodes, top){

function renderBlock(n){

    if (isOb()){ v.dir = obsBlockDir(n.text); v.style.textAlign = OBFD==="ltr" ? "left" : "right"; v.innerHTML = (hm || cls!=="view") ? renderObsInline(txt) : renderObs(txt);
      if (hasKids && n.collapsed){ const tail = v.querySelector(".otx") || v.querySelector(".oin") || v; tail.insertAdjacentHTML("beforeend", ' <span class="fade">\u2026</span>'); } }
    else { v.dir = S.dir; v.innerHTML = renderInline(txt); }

    v.onmousedown = e => { if (e.button===0){ suppressBlur = true; downX = e.clientX; downY = e.clientY; } };   // لا نعيد الرسم أثناء التظليل
    v.onclick = e => {
      suppressBlur = false;

      const sel = window.getSelection();

      const c = clickCaret(v, n.text, e);

    };
    content.appendChild(v);
  }
  row.append(tg, bullet, content);
  b.appendChild(row);

}
function render(){
  rendering = true; OBFD = obsFileDir();
  $("#outline").classList.toggle("plain", isOb()); CAL.open = false; CAL.el = null;
  const host = HOST(); host.innerHTML = "";
  host.appendChild(renderList(isOb() ? obsVisible() : model, true));
  rendering = false;
  if (editingId != null){
    const t = host.querySelector('textarea[data-id="'+editingId+'"]');
    if (t){
      t.focus();
      const c = Math.min(pendingCaret ?? t.value.length, t.value.length);
      const ce = Math.min(pendingCaretEnd ?? c, t.value.length);
      t.setSelectionRange(c, ce); autosize(t);
    }

}
function obsDir(t){

  const m = t.value.match(/[A-Za-z\u0600-\u06FF]/);
  const d = m ? (/[A-Za-z]/.test(m[0]) ? "ltr" : "rtl") : (CFG.dir==="auto" ? "rtl" : "rtl");
  if (t.dir !== d){ t.dir = d; t.style.textAlign = d==="ltr" ? "left" : "right"; }
}
function autosize(t){ if (t.id==="obsText") obsDir(t); t.style.height="0"; t.style.height = Math.max(26,t.scrollHeight)+"px"; }
function startEdit(id, caret, caretEnd){
  if (isOb() && id != null){ const r = normalizeObs(id, caret); if (r[0]!==id || r[1]!==caret){ id = r[0]; caret = r[1]; caretEnd = caret; } }
  editingId = id; pendingCaret = caret; pendingCaretEnd = caretEnd ?? caret; render(); }
function onBlur(n,t){
  if (rendering) return;
  setTimeout(()=>{
    if (document.activeElement !== t && editingId === n.id && !suppressBlur){ editingId = null; closeSug(); if (isOb()) normalizeObs(null, 0); render(); }
  },0);
}
let suppressBlur = false;
document.addEventListener("mouseup", () => { setTimeout(() => { suppressBlur = false; }, 0); }, true);
function onInput(n,t){
  n.text = t.value; n.auto = false; if (ACTIVE === "page") docTouch();                  // ما كتبتَ فيه لم يعد رأساً تلقائياً
  if (isOb()){ OBFD = obsFileDir(); t.dir = obsBlockDir(n.text); t.style.textAlign = OBFD==="ltr" ? "left" : "right"; }
  autosize(t); checkSug(n,t);

const OPEN = {"[":"]","(":")","{":"}"};
const CLOSE = "])}";
function insertText(t, str, caretFromStart){
  pushHist(true);
  const s = t.selectionStart;
  t.focus();
  document.execCommand("insertText", false, str);
  if (caretFromStart != null) t.setSelectionRange(s+caretFromStart, s+caretFromStart);
}
function onBeforeInput(e,n,t){
  if (!e.isComposing && e.inputType && e.inputType!=="insertCompositionText") pushHist(/^(insertText|deleteContent)/.test(e.inputType));
  if (e.isComposing || e.inputType !== "insertText" || !e.data || e.data.length !== 1) return;
  const ch = e.data, v = t.value, s = t.selectionStart, en = t.selectionEnd;
  if (OPEN[ch]){
    const close = OPEN[ch];
    if (s !== en){                         // تغليف المحدد
      e.preventDefault();
      const sel = v.slice(s,en);
      pushHist(true); document.execCommand("insertText", false, ch+sel+close);
      t.setSelectionRange(s+1, s+1+sel.length);
      return;
    }
    const prev = v[s-1] || "", after = v.slice(s,s+2);
    let need;
    if (prev === ch) need = (after === close+close) ? "" : (after[0] === close ? close : close+close);
    else need = (after[0] === close) ? "" : close;
    if (need){ e.preventDefault(); insertText(t, ch+need, 1); }
  } else if (CLOSE.includes(ch) && s === en && v[s] === ch){
    e.preventDefault(); t.setSelectionRange(s+1, s+1);   // تخطَّ القوس الموجود
    checkSug(n,t);
  }
}

/* ---- Markdown ← Roam: تحويل التنسيق داخل السطر ---- */
// ملاحظة: في Markdown القياسي __x__ غامق و*x* و_x_ مائل. أما في Roam فالمائل __x__ والغامق **x**.
function mdInline(s){
  const keep = [];
  s = s.replace(/`[^`\n]+`/g, m => { keep.push(m); return "\u0000"+(keep.length-1)+"\u0000"; });
  s = s.replace(/\\([\\`*_{}\[\]()#+\-.!~|>=])/g, (m,c) => "\u0001"+c.charCodeAt(0)+"\u0001");
  s = s.replace(/(\*\*\*|___)(?=\S)([^\n]+?)(?<=\S)\1/g, "\u0002$2\u0003");                   // غامق+مائل
  s = s.replace(/(^|[^\w])__(?=\S)([^\n_]+?)(?<=\S)__(?!\w)/g, "$1**$2**");              // __x__ غامق في Markdown
  s = s.replace(/(^|[^*\w])\*(?=[^\s*])([^*\n]+?)(?<=[^\s*])\*(?!\*)/g, "$1__$2__");     // *x* مائل
  s = s.replace(/(^|[^\w_])_(?=[^\s_])([^_\n]+?)(?<=[^\s_])_(?![\w_])/g, "$1__$2__");    // _x_ مائل
  s = s.replace(/==(?=\S)([^=\n]+?)(?<=\S)==/g, "^^$1^^");                              // تمييز
  s = s.replace(/<(https?:\/\/[^>\s]+)>/g, "$1").replace(/<br\s*\/?>/gi, "\n");
  s = s.replace(/\u0002/g, "**__").replace(/\u0003/g, "__**");
  s = s.replace(/\u0001(\d+)\u0001/g, (m,c) => String.fromCharCode(+c));
  s = s.replace(/\u0000(\d+)\u0000/g, (m,i) => keep[+i]);
  return s;
}
function buildTable(rows){                           // جدول Roam: كل صف سلسلة خلايا متداخلة
  const root = mk("{{[[table]]}}"); root.keep = true;
  for (const r of rows){
    if (!r.length) continue;
    const first = mk(r[0]); first.keep = true; let cur = first;
    for (let i=1;i<r.length;i++){ const c = mk(r[i]); c.keep = true; cur.children.push(c); cur = c; }
    root.children.push(first);
  }
  return root;
}
const splitRow = l => l.trim().replace(/^\|/,"").replace(/\|$/,"").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g,"|"));
function tableRows(text){                          // نص جدول Markdown ← صفوف (أو null)
  if (text.indexOf("\n")<0) return null;
  const ls = text.split("\n").filter(l => l.trim()!=="");
  if (ls.length<2 || !ls[0].includes("|") || !isSep(ls[1])) return null;
  return [splitRow(ls[0]), ...ls.slice(2).map(splitRow)];
}
function rowsToMd(rows){
  const n = Math.max(...rows.map(r => r.length));
  const f = r => "| " + Array.from({length:n}, (_,i) => (r[i]||"").replace(/\|/g,"\\|").replace(/\n/g," ")).join(" | ") + " |";
  return [f(rows[0]), "|" + Array(n).fill("---").join("|") + "|", ...rows.slice(1).map(f)].join("\n");
}
function nestHeadings(list){                       // ما بعد العنوان يصير ابناً له حتى عنوان بمستواه أو أعلى
  const out = []; let cur = null;
  for (const n of list){
    const m = n.text.match(/^(#{1,6})[ \t]/);
    const lv = n.hl || (m ? m[1].length : 0);
    if (lv){
      while (cur && cur.lv >= lv) cur = cur.up;
      (cur ? cur.n.children : out).push(n);
      cur = {n, lv, up:cur};
    } else (cur ? cur.n.children : out).push(n);
  }
  for (const n of list) n.children = nestHeadings(n.children);
  return out;
}
const isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.includes("-");

/* ---- Markdown نصي ← كتل (عناوين 1-3، قوائم، فقرات، جداول، مهام، أكواد، اقتباس) ---- */
function parseMarkdown(text){
  const lines = text.replace(/\r/g,"").split("\n");
  const items = [];
  for (let i=0;i<lines.length;i++){
    const l = lines[i];
    if (/^\s*```/.test(l)){                       // كتلة كود (تبقى كما هي)
      const buf = [l.trim()]; i++;
      while (i<lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
      buf.push("```");
      items.push({kind:"p", w:0, s:buf.join("\n")}); continue;
    }
    if (l.trim()==="") continue;
    if (l.includes("|") && i+1<lines.length && isSep(lines[i+1])){   // جدول
      const rows = [splitRow(l)]; i += 2;
      while (i<lines.length && lines[i].trim()!=="" && lines[i].includes("|")){ rows.push(splitRow(lines[i])); i++; }
      i--; items.push({kind:"p", w:0, s:rowsToMd(rows)}); continue;
    }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){ items.push({kind:"p", w:0, s:"---"}); continue; }   // خط فاصل
    const hm = l.match(/^\s{0,3}(#{1,6})[ \t]+(.*?)[ \t]*#*[ \t]*$/);
    if (hm){                                       // عنوان: Roam فيه 3 مستويات فقط
      let t = mdInline(hm[2]).replace(/^\*\*(.+)\*\*$/,"$1");
      items.push({kind:"p", w:0, hl:hm[1].length, s:"#".repeat(hm[1].length)+" "+t}); continue;
    }
    const qm = l.match(/^\s*>+[ \t]?(.*)$/);
    if (qm){ items.push({kind:"p", w:0, s:"> "+mdInline(qm[1])}); continue; }
    const m = l.match(/^([ \t]*)([-*•+][ \t]+|\d+[.)][ \t]+)?(.*)$/);
    const w = m[1].replace(/\t/g,"    ").length;
    let body = m[3];
    const tk = body.match(/^\[([ xX])\][ \t]+(.*)$/);              // قائمة مهام
    if (tk) body = (tk[1]===" " ? "{{[[TODO]]}} " : "{{[[DONE]]}} ") + tk[2];
    body = mdInline(body);
    if (m[2]) items.push({kind:"li", w, s:(/\d/.test(m[2]) ? m[2].trim()+" " : "")+body});
    else if (w>0) items.push({kind:"li", w, s:body});
    else items.push({kind:"p", w:0, s:body});
  }
  const ws = items.filter(i => i.kind==="li" && i.w>0).map(i => i.w);
  const unit = ws.length ? Math.min(...ws) : 1;
  const roots = []; let stack = []; let anchored = false;
  for (const it of items){
    const node = it.node || mk(it.s); if (it.hl) node.hl = it.hl; if (it.kind==="li") node.li = true;
    if (it.kind==="p"){ roots.push(node); stack = [node]; anchored = true; continue; }
    let lvl = (anchored ? 1 : 0) + Math.round(it.w/unit);
    lvl = Math.min(lvl, stack.length);
    if (lvl===0) roots.push(node); else stack[lvl-1].children.push(node);
    stack.length = lvl; stack.push(node);
  }
  return nestHeadings(roots);
}

/* ---- HTML (من المتصفح أو محادثة الذكاء) ← كتل بتنسيق Roam ---- */
const INLINE_TAGS = new Set(["A","B","STRONG","I","EM","CODE","SPAN","DEL","S","STRIKE","MARK","U","SUP","SUB","BR","FONT","SMALL","KBD","ABBR","LABEL","CITE","Q","TIME","BDI","BDO","WBR"]);
function inl(node, o){
  if (node.nodeType===3) return o.pre ? node.nodeValue : node.nodeValue.replace(/\s+/g," ");
  if (node.nodeType!==1) return "";
  const tag = node.tagName;
  if (tag==="BR") return "\n";
  if (tag==="SCRIPT"||tag==="STYLE"||tag==="IMG"||tag==="SVG") return "";
  let inner = ""; for (const c of node.childNodes) inner += inl(c,o);
  if (o.noFmt) return inner;
  const wrap = m => { const x = inner.match(/^(\s*)([\s\S]*?)(\s*)$/); return x[2] ? x[1]+m+x[2]+m+x[3] : inner; };
  switch (tag){
    case "STRONG": case "B": return (node.style && /^(normal|400)$/.test(node.style.fontWeight)) ? inner : wrap("**");
    case "EM": case "I": return wrap("__");
    case "CODE": case "KBD": return o.pre ? inner : wrap("`");
    case "DEL": case "S": case "STRIKE": return wrap("~~");
    case "MARK": return wrap("^^");
    case "A": { const h = node.getAttribute("href") || ""; const t = inner.trim();
      return (/^https?:/i.test(h) && t) ? "["+t.replace(/[\[\]]/g,"")+"]("+h+")" : inner; }
    default: return inner;
  }
}
const isBlockEl = el => el.nodeType===1 && !INLINE_TAGS.has(el.tagName);
function listTarget(out){ const last = out[out.length-1]; return (last && last.para) ? last.children : out; }
function listInto(listEl, target){
  const ordered = listEl.tagName==="OL"; let i = 0;
  for (const li of listEl.children){
    if (li.tagName!=="LI") continue; i++;
    let buf = ""; const nested = [];
    for (const c of li.childNodes){
      if (c.nodeType===1 && (c.tagName==="UL"||c.tagName==="OL")) nested.push(c);
      else buf += inl(c,{}) + ((c.nodeType===1 && (c.tagName==="P"||c.tagName==="DIV")) ? "\n" : "");
    }
    const b = mk((ordered ? i+". " : "") + buf.replace(/[ \t]+\n/g,"\n").trim());
    b.li = true; target.push(b);
    nested.forEach(l => listInto(l, b.children));
  }
}
let codeLang = "";
function walkInto(parent, out){
  let buf = "";
  const flush = () => { const t = buf.replace(/[ \t]+\n/g,"\n").trim(); if (t){ const b = mk(t); b.para = true; out.push(b); } buf = ""; };
  for (const c of parent.childNodes){
    if (c.nodeType===3 || (c.nodeType===1 && !isBlockEl(c))){ buf += inl(c,{}); continue; }
    if (c.nodeType!==1) continue;
    flush();
    const tag = c.tagName;
    // وسم اللغة فوق الكود (vba، python…) يُدمج في سياج الكود
    if (tag!=="PRE" && !c.querySelector("pre") && c.nextElementSibling && c.nextElementSibling.tagName==="PRE" && /^[A-Za-z][\w+#.-]{0,14}$/.test(c.textContent.trim())){ codeLang = c.textContent.trim(); continue; }
    if (/^H[1-6]$/.test(tag)){
      const t = inl(c,{noFmt:true}).trim();
      if (t){ const b = mk("#".repeat(+tag[1])+" "+t); b.hl = +tag[1]; b.para = true; out.push(b); }
    } else if (tag==="UL"||tag==="OL") listInto(c, listTarget(out));
    else if (tag==="PRE"){
      const cm = (c.querySelector("code")||c).className.match(/(?:language|lang)-([\w+#.-]+)/);
      const lg = codeLang || (cm ? cm[1] : ""); codeLang = "";
      const b = mk("```"+lg+"\n"+c.textContent.replace(/\n$/,"")+"\n```"); b.para = true; out.push(b);
    }
    else if (tag==="HR"){ const b = mk("---"); b.para = true; out.push(b); }
    else if (tag==="BLOCKQUOTE"){ const tmp = []; walkInto(c,tmp); for (const b of tmp){ b.text = "> "+b.text; out.push(b); } }
    else if (tag==="TABLE"){
      const rows = [...c.querySelectorAll("tr")].map(tr => [...tr.children].map(x => inl(x,{}).trim()));
      if (rows.length){ const tb = mk(rowsToMd(rows)); tb.para = true; out.push(tb); }
    } else if (tag==="STYLE"||tag==="SCRIPT"||tag==="HEAD"){ /* تجاهل */ }
    else walkInto(c,out);
  }
  flush();
}
function htmlToBlocks(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const roots = []; walkInto(doc.body, roots); return nestHeadings(roots);
}

let plainNext = false;       // Ctrl+Shift+V: لصق كنص خام
function onPaste(e,n,t){
  if (plainNext){ plainNext = false; return; }
  const cd = e.clipboardData || window.clipboardData;
  const txt = cd.getData("text/plain") || "", html = cd.getData("text/html") || "";
  const mdLike = /(\*\*|^#{1,6}[ \t]|^\s*[-*•][ \t]|^\s*>|^\s*\|.*\||```)/m.test(txt);   // النص العادي نفسه Markdown
  if (isOb()){                                         // Obsidian: نص Markdown يُقسم إلى أسطر
    let md = null;
    if (html && !mdLike && /<(strong|b|em|i|h[1-6]|ul|ol|li|a|code|pre|table|blockquote|p|div|br)\b/i.test(html)){
      try { md = toObsidian(prune(htmlToBlocks(html), 6, true), true); } catch(err){ md = null; }
    } else if (txt) md = bidiStrip(txt.replace(/\r\n?/g,"\n")).replace(/\n+$/,"");
    if (!md || !md.trim()) return;
    e.preventDefault(); pushHist();
    if (!md.includes("\n")){ pushHist(); document.execCommand("insertText", false, md); return; }
    const s = t.selectionStart, en = t.selectionEnd, v = t.value;
    const nodes = splitUnits(v.slice(0,s)+md+v.slice(en)).map(u => mk(u)), L = loc(n.id);
    L.list.splice(L.index, 1, ...nodes);
    let g = s+md.length, off = 0, target = nodes[nodes.length-1], c = target.text.length;
    for (const nd of nodes){ if (g <= off+nd.text.length){ target = nd; c = g-off; break; } off += nd.text.length+1; }
    startEdit(target.id, c); return;
  }
  let roots = null;
  if (html && !mdLike && /<(strong|b|em|i|h[1-6]|ul|ol|li|a|code|pre|table|blockquote|p|div|br)\b/i.test(html)){
    try { roots = htmlToBlocks(html); } catch(err){ roots = null; }
  } else if (/\r?\n/.test(txt.trim())) roots = parseMarkdown(txt);
  if (!roots || !roots.length) return;                     // لصق عادي
  e.preventDefault(); pushHist();
  if (roots.length===1 && roots[0].children.length===0){   // كتلة واحدة: أدخلها داخل السطر الحالي
    pushHist(); document.execCommand("insertText", false, roots[0].text); return;
  }
  const L = loc(n.id);
  if (n.text.trim()==="" && n.children.length===0) L.list.splice(L.index, 1, ...roots);
  else L.list.splice(L.index+1, 0, ...roots);
  let last = roots[roots.length-1]; while (last.children.length) last = last.children[last.children.length-1];
  startEdit(last.id, last.text.length);
}

let sug = {open:false, items:[], sel:0, start:0, id:null, el:null, kind:"page"};
let sugSeq = 0;
function closeSug(){ sugSeq++; if (sug.el){ sug.el.remove(); sug.el=null; } sug.open=false; }
function checkSug(n,t){
  const s = t.selectionStart, v = t.value;
  if (s !== t.selectionEnd){ closeSug(); return; }
  const before = v.slice(0,s);
  const i = before.lastIndexOf("[["), r2 = before.lastIndexOf("((");
  if (r2 > i && !isOb() && !/\)\)|\n/.test(before.slice(r2+2))){              // (( : ابحث في نصوص الكتل
    const q = before.slice(r2+2), my = ++sugSeq;
    if (!RQ.loc() || RQ.foldStr(q).length < 2){ closeSug(); sugSeq = my; return; }
    RQ.search(q, {limit:10, pre:18, post:70}).then(r => {
      if (my !== sugSeq || document.activeElement !== t) return;
      if (!r.hits.length){ closeSug(); return; }
      sug.items = r.hits.map(h => ({title:h.pre + h.hit + h.post, kind:"ref", uid:h.u, sub:RQ.pageTitle(h.g)}));
      sug.sel = 0; sug.start = r2+2; sug.id = n.id; sug.open = true; sug.kind = "ref"; drawSug(t); sug.el.classList.add("wide");
    }).catch(() => {});
    return;
  }
  const pageCtx = i>=0 && !/\]\]|\n|\[/.test(before.slice(i+2));
  if (!pageCtx && CFG.dest==="obsidian"){
    const tm = before.match(/(^|[\s(،؛,;\u200e\u2066-\u2069])#([^\s#\[\](){}]*)$/);
    const lineSoFar = before.slice(before.lastIndexOf("\n")+1);
    if (tm && !/^\s*#{1,6}$/.test(lineSoFar)){
      const q = tm[2], qn = normKey(q);
      let items = rankFilter(OBS.tagList, q, x => x.t).map(x => ({title:x.t, kind:"tag", sub:String(x.c)}));
      if (q && !OBS.tagKey.has(qn)) items.push({title:q, kind:"newtag"});
      if (!items.length){ closeSug(); return; }
      sug.items = items; sug.sel = 0; sug.start = s - q.length; sug.id = n.id; sug.open = true; sug.kind = "tag";
      drawSug(t); return;
    }
  }
  if (!pageCtx){ closeSug(); return; }
  const q = before.slice(i+2);
  const qn = norm(q.trim());
  let first=[], rest=[];
  for (let k=0;k<S.pages.length;k++){
    const pn = S.pagesN[k];
    if (qn === "") { first.push(S.pages[k]); }
    else { const p = pn.indexOf(qn); if (p===0) first.push(S.pages[k]); else if (p>0) rest.push(S.pages[k]); }
    if (first.length + rest.length >= 300) break;
  }
  let items = first.concat(rest).slice(0,12).map(x => ({title:x, kind:"page"}));
  if (q.trim() && !items.some(it => norm(it.title) === qn)) items.push({title:q.trim(), kind:"new"});
  if (!items.length){ closeSug(); return; }
  sug.items = items; sug.sel = 0; sug.start = i+2; sug.id = n.id; sug.open = true; sug.kind = "page";
  drawSug(t);
}
function drawSug(t){
  if (sug.el) sug.el.remove();
  const ul = el("ul","sug"); sug.el = ul; if (sug.kind==="ref") ul.classList.add("wide");
  sug.items.forEach((it,k) => {
    const li = el("li", k===sug.sel ? "sel" : "");
    li.innerHTML = "<span>"+esc(it.title)+"</span>" + (it.kind==="new"||it.kind==="newtag" ? "<small>جديد</small>" : (it.sub ? "<small>"+esc(it.sub)+"</small>" : ""));
    li.onmousedown = e => { e.preventDefault(); pickSug(k); };

    const c = caretXY(t);

    ul.style.left = Math.max(0, Math.min(c.x, t.clientWidth-250))+"px";

}
function caretXY(t){
  const d = document.createElement("div"), cs = getComputedStyle(t);
  ["direction","fontFamily","fontSize","fontWeight","lineHeight","letterSpacing","paddingTop","paddingRight","paddingBottom","paddingLeft","boxSizing","textAlign","unicodeBidi"].forEach(k => d.style[k] = cs[k]);
  d.style.position = "absolute"; d.style.visibility = "hidden"; d.style.whiteSpace = "pre-wrap"; d.style.overflowWrap = "break-word";
  d.style.width = t.clientWidth+"px"; d.style.top = "0"; d.style.left = "0";
  d.textContent = t.value.slice(0, t.selectionStart);
  const sp = document.createElement("span"); sp.textContent = "\u200b"; d.appendChild(sp);

}
function pickSug(k){
  const it = sug.items[k]; if (!it) return;
  const t = $('textarea[data-id="'+sug.id+'"]'); if (!t) return;
  const s = t.selectionStart;
  t.setSelectionRange(sug.start, s);
  pushHist();
  if (sug.kind==="ref"){ const tl = t.value.slice(s, s+2) === "))" ? "" : "))"; document.execCommand("insertText", false, it.uid + tl); const p0 = sug.start + it.uid.length + 2; t.setSelectionRange(p0, p0); closeSug(); return; }
  if (sug.kind==="tag"){ document.execCommand("insertText", false, it.title.replace(/\s+/g,"_")+" "); closeSug(); return; }
  const after = t.value.slice(s, s+2);
  const tail = after === "]]" ? "" : "]]";
  document.execCommand("insertText", false, it.title + tail);
  const pos = sug.start + it.title.length + 2;
  t.setSelectionRange(pos, pos);
  closeSug();
}

/* ============================================================
   لوحة المفاتيح داخل الكتلة
   ============================================================ */
function caretPos(t){ return [t.selectionStart, t.selectionEnd]; }
function indent(n,t){
  const L = loc(n.id); if (!L || L.index===0) return;
  if (L.list[L.index-1].lazy){ const pv = L.list[L.index-1]; loadLazy(pv).then(() => { const t2 = $('textarea[data-id="'+n.id+'"]'); if (t2) indent(n, t2); }); return; }
  pushHist();
  const [s,e] = caretPos(t);
  const prev = L.list[L.index-1];
  L.list.splice(L.index,1); prev.children.push(n); prev.collapsed = false;
  startEdit(n.id, s, e);
}
function outdent(n,t){
  const L = loc(n.id); if (!L || !L.parent) return;
  pushHist();
  const P = loc(L.parent.id); const [s,e] = caretPos(t);
  L.list.splice(L.index,1); P.list.splice(P.index+1,0,n);
  startEdit(n.id, s, e);
}
function moveSibling(n,t,dir){
  const L = loc(n.id); const j = L.index+dir; if (j<0 || j>=L.list.length) return;
  pushHist();
  const [s,e] = caretPos(t);
  [L.list[L.index], L.list[j]] = [L.list[j], L.list[L.index]];
  startEdit(n.id, s, e);
}
function gotoNeighbor(n, dir, atEnd){
  const vis = visible(); const i = vis.findIndex(x => x.id===n.id); const j = i+dir;
  if (j<0 || j>=vis.length) return false;
  startEdit(vis[j].id, atEnd ? vis[j].text.length : 0);
  return true;
}
function linkWrap(t){                              // Ctrl+K: [نص](رابط)
  pushHist();
  const s=t.selectionStart, e=t.selectionEnd, v=t.value, sel=v.slice(s,e);
  document.execCommand("insertText", false, "["+sel+"]()");
  const pos = s+sel.length+3; t.setSelectionRange(pos,pos);
}
function wrapSel(t, mark){
  pushHist();
  const s=t.selectionStart, e=t.selectionEnd, v=t.value;
  if (s===e){ insertText(t, mark+mark, mark.length); return; }
  document.execCommand("insertText", false, mark+v.slice(s,e)+mark);
  t.setSelectionRange(s+mark.length, e+mark.length);
}
function onKey(e,n,t){
  if (e.isComposing) return;
  if (CAL.open && calKey(e, t)) return;
  if (e.altKey && !e.ctrlKey && !e.shiftKey && e.code==="KeyT" && !isOb()){ e.preventDefault(); todoKey(n, t); return; }
  if (e.altKey && !e.ctrlKey && !e.shiftKey && e.code==="KeyD" && !isOb()){ e.preventDefault(); calOpen(t); return; }
  const s=t.selectionStart, en=t.selectionEnd, v=t.value;

  if (sug.open){                                     // قائمة الاقتراحات لها الأولوية
    if (e.key==="ArrowDown"){ e.preventDefault(); sug.sel=(sug.sel+1)%sug.items.length; drawSug(t); return; }
    if (e.key==="ArrowUp"){ e.preventDefault(); sug.sel=(sug.sel-1+sug.items.length)%sug.items.length; drawSug(t); return; }
    if ((e.key==="Enter" && !e.ctrlKey) || e.key==="Tab"){ e.preventDefault(); pickSug(sug.sel); return; }
    if (e.key==="Escape"){ e.preventDefault(); closeSug(); return; }
  }
  if (e.ctrlKey && e.shiftKey && e.code==="KeyV") plainNext = true;
  if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); doSend(); return; }

  if ((e.ctrlKey||e.metaKey) && e.code==="KeyA" && !e.altKey){
    if (e.shiftKey || v.length===0 || (s===0 && en===v.length)){ e.preventDefault(); selectAll(); return; }
    return;                                        // الضغطة الأولى: السطر كله (تحديد المتصفح)
  }
  if ((e.ctrlKey||e.metaKey) && !e.altKey){
    if (e.code==="KeyZ"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (e.code==="KeyY"){ e.preventDefault(); redo(); return; }
    if (e.code==="KeyS"){ e.preventDefault(); doSend(); return; }
    if (e.code==="KeyK" && !e.shiftKey){ e.preventDefault(); histBreak(); linkWrap(t); return; }
  }
  if (e.ctrlKey && !e.shiftKey && !e.altKey){
    if (e.code==="KeyB"){ e.preventDefault(); histBreak(); wrapSel(t,"**"); return; }
    if (e.code==="KeyI"){ e.preventDefault(); histBreak(); wrapSel(t, isOb() ? "*" : "__"); return; }
    if (e.code==="Backquote"){ e.preventDefault(); histBreak(); wrapSel(t,"`"); return; }
  }
  if (e.ctrlKey && e.shiftKey && e.code==="KeyH"){ e.preventDefault(); histBreak(); wrapSel(t, isOb() ? "==" : "^^"); return; }

  if (e.altKey && e.shiftKey && e.key==="ArrowUp"){ e.preventDefault(); moveSibling(n,t,-1); return; }
  if (e.altKey && e.shiftKey && e.key==="ArrowDown"){ e.preventDefault(); moveSibling(n,t,1); return; }

  if (e.key==="Tab" && isOb()){                      // Obsidian: إزاحة السطر بمسافات (للقوائم المتداخلة)
    e.preventDefault(); pushHist();
    const ls = v.lastIndexOf("\n", s-1)+1;
    if (e.shiftKey){
      const m = v.slice(ls).match(/^( {1,4}|\t)/);
      if (m){ pushHist(true); t.setSelectionRange(ls, ls+m[0].length); document.execCommand("delete"); const p = Math.max(ls, s-m[0].length); t.setSelectionRange(p,p); }
    } else { pushHist(true); t.setSelectionRange(ls, ls); document.execCommand("insertText", false, "    "); t.setSelectionRange(s+4, en+4); }
    return;
  }
  if (e.key==="Tab"){ e.preventDefault(); e.shiftKey ? outdent(n,t) : indent(n,t); return; }

  if (e.key==="Enter" && !e.shiftKey && isOb()){
    e.preventDefault(); pushHist();
    const L = loc(n.id);
    const inFence = ((v.slice(0,s).match(/^\s*```/gm)||[]).length % 2)===1;
    if (inFence || (v.includes("\n") && en < v.length)){ pushHist(true); document.execCommand("insertText", false, "\n"); autosize(t); return; }   // داخل كود أو جدول
    if (n.collapsed && !v.includes("\n") && obsFoldable(n)){      // سطر مطويّ: اكتب بعد كل ما تحته، ويبقى مطوياً
      const at = foldEnd(n), pre = sibPrefix(v);
      n.text = v.slice(0,en);
      const nn = mk(pre + v.slice(en));
      model.splice(at, 0, nn);
      if (headLv(n.text)) n.foldStop = nn.id;        // يبقى العنوان مطوياً والسطر الجديد ظاهراً بعده
      startEdit(nn.id, pre.length); return;
    }
    const m = v.includes("\n") ? null : v.slice(0,s).match(/^([ \t]*)([-*+]|\d+[.)])([ \t]+)(\[[ xX]\][ \t]+)?/);
    if (m && s===en){                                // تكملة القوائم كما في Obsidian
      if (v.slice(m[0].length).trim()===""){        // بند فارغ: اخرج مستوىً واحداً ثم أنهِ القائمة
        const pad = m[1].replace(/\t/g,"    ");
        n.text = pad.length>=4 ? pad.slice(4)+m[2]+m[3] : "";
        startEdit(n.id, n.text.length); return;
      }
      let mark = m[2]; const num = mark.match(/^(\d+)([.)])$/); if (num) mark = (+num[1]+1)+num[2];
      const pre = m[1]+mark+m[3]+(m[4] ? "[ ] " : "");
      n.text = v.slice(0,s); const li = mk(pre+v.slice(s)); n.collapsed = false;
      L.list.splice(L.index+1, 0, li); startEdit(li.id, pre.length); return;
    }
    const ind = (!v.includes("\n") && s===en) ? v.match(/^[ \t]+/) : null;
    if (ind){                                        // سطر مزاح بلا نقطة: يبقى السطر التالي بإزاحته
      if (blankLn(v)){                               // سطر فارغ مزاح: اخرج مستوىً
        const pad = ind[0].replace(/\t/g,"    ");
        n.text = pad.length>=4 ? pad.slice(4) : "";
        startEdit(n.id, n.text.length); return;
      }
      n.text = v.slice(0,en); const nn = mk(ind[0]+v.slice(en)); n.collapsed = false;
      L.list.splice(L.index+1, 0, nn); startEdit(nn.id, ind[0].length); return;
    }
    n.collapsed = false;
    n.text = v.slice(0,en); const nn = mk(v.slice(en)); L.list.splice(L.index+1, 0, nn); startEdit(nn.id, 0); return;
  }
  if (e.key==="Enter" && !e.shiftKey){
    e.preventDefault(); pushHist();
    const L = loc(n.id);
    if (v.trim()==="" && n.children.length===0 && L.parent){ outdent(n,t); return; }
    const before = v.slice(0,en), after = v.slice(en);   // لا نحذف المحدد: ننقسم عند نهايته
    n.text = before;
    const nn = mk(after);
    if (after==="" && n.children.length && !n.collapsed) n.children.unshift(nn);
    else L.list.splice(L.index+1,0,nn);
    startEdit(nn.id, 0);
    return;
  }

  if (e.key==="Backspace" && s===en){
    if (s>0 && OPEN[v[s-1]] === v[s]){               // حذف زوج الأقواس الفارغ
      e.preventDefault(); pushHist(); t.setSelectionRange(s-1,s+1); document.execCommand("delete"); return;
    }
    if (s===0){
      const L = loc(n.id), vis = visible(), i = vis.findIndex(x => x.id===n.id);
      if (i===0) return;
      e.preventDefault(); pushHist();
      const prev = vis[i-1];
      if (n.children.length===0 && !n.lazy){
        const joinAt = prev.text.length;
        prev.text += n.text;
        L.list.splice(L.index,1);
        startEdit(prev.id, joinAt);
      } else if (v===""){ /* كتلة فارغة لها أبناء: لا نحذفها */ }
      return;
    }
  }

  if (e.key==="ArrowUp" || e.key==="ArrowDown"){
    const up = e.key==="ArrowUp";
    const lh = 26, single = !v.includes("\n") && t.scrollHeight <= lh*1.6;
    if (single){ if (gotoNeighbor(n, up?-1:1, up)) e.preventDefault(); return; }
    const before = s;
    setTimeout(() => { if (t.selectionStart===before && t.selectionEnd===before) gotoNeighbor(n, up?-1:1, up); }, 0);
    return;
  }
  if (e.key==="Escape"){ t.blur(); return; }
}

/* ============================================================
   الناتج والإرسال
   ============================================================ */
function prune(nodes, cap=3, md=false){
  const out = [];
  for (const n of nodes){
    const kids = prune(n.children, cap, md);
    const tr = md ? null : tableRows(n.text);
    if (tr){ const tb = prune([buildTable(tr.map(r => r.map(mdInline)))]); tb[0].children.push(...kids); out.push(...tb); continue; }
    if (n.text.trim()!=="" || kids.length || n.keep){
      let str = n.text.replace(/\s+$/,""), heading = 0;
      const hm = str.match(/^(#{1,6})[ \t]+([\s\S]*)$/);
      if (hm){ heading = Math.min(cap,hm[1].length); str = hm[2]; }
      const o = heading ? {string:str, heading, children:kids} : {string:str, children:kids};
      if (n.li) o.li = true;
      if (n.collapsed && kids.length) o.open = false;          // يبقى مطوياً في Roam
      out.push(o);
    }
  }
  return out;
}
function toMd(nodes, depth=0){
  const pad = "    ".repeat(depth); let out = "";
  for (const n of nodes){
    const ls = ((n.heading ? "#".repeat(n.heading)+" " : "") + n.string).split("\n");
    out += pad + "- " + ls[0] + "\n";
    for (let i=1;i<ls.length;i++) out += pad + "  " + ls[i] + "\n";
    out += toMd(n.children, depth+1);
  }
  return out;
}
function hasContent(tree){
  // يوجد نص إن كان في أي كتلة كلام، ما عدا كتلة الرأس التلقائية إن لم تُمسّ
  return flat(model).some(n => (n.text.trim()!=="" || n.keep) && !n.auto);
}

let sending = false;
const getToken = () => (curGraph().token || "").trim();
async function roamCall(kind, body){
  const r = await fetch("https://api.roamresearch.com/api/graph/"+encodeURIComponent(S.graph)+"/"+kind,
    {method:"POST", headers:{"X-Authorization":"Bearer "+getToken(), "Content-Type":"application/json"}, body:JSON.stringify(body)});
  const t = await r.text();
  return {ok:r.ok, status:r.status, text:t};
}
const UID_CH = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-";
function newUid(){ const a = crypto.getRandomValues(new Uint8Array(9)); return [...a].map(x => UID_CH[x%64]).join(""); }
function flattenActions(nodes, parent, out){
  for (const n of nodes){
    const uid = newUid(), blk = {uid, string:n.string};
    if (n.heading) blk.heading = n.heading;
    if (n.open === false) blk.open = false;
    out.push({action:"create-block", location:{"parent-uid":parent, order:"last"}, block:blk});
    flattenActions(n.children, uid, out);
  }
  return out;
}
async function sendToRoam(payload){
  let pageUid;
  if (payload.page.kind==="today"){
    pageUid = payload.page.uid;
    await roamCall("write", {action:"create-page", page:{title:payload.page.daily, uid:pageUid}});   // 400 إن وُجدت: عادي
  } else {
    const ti = payload.page.title.replace(/\\/g,"\\\\").replace(/"/g,'\\"');
    const q = await roamCall("q", {query:'[:find ?u . :where [?e :node/title "'+ti+'"] [?e :block/uid ?u]]'});
    if (!q.ok) throw new Error("استعلام الصفحة فشل ("+q.status+"): "+q.text.slice(0,150));
    pageUid = (JSON.parse(q.text).result) || null;
    if (!pageUid){
      pageUid = newUid();
      const c = await roamCall("write", {action:"create-page", page:{title:payload.page.title, uid:pageUid}});
      if (!c.ok) throw new Error("إنشاء الصفحة فشل ("+c.status+"): "+c.text.slice(0,150));
    }
  }
  const acts = flattenActions(payload.blocks, pageUid, []);
  const btn = $("#btnSend");
  let i = 0, size = 50;                              // دفعات أصغر: Roam يرفض الدفعات الكبيرة
  while (i < acts.length){
    const part = acts.slice(i, i+size);
    const w = await roamCall("write", {action:"batch-actions", actions:part});
    if (!w.ok){
      if (size > 10){ size = Math.max(10, Math.floor(size/2)); continue; }   // جرّب دفعة أصغر
      throw new Error("الكتابة فشلت ("+w.status+") بعد "+i+" كتلة: "+w.text.slice(0,150));
    }
    i += part.length;
    if (acts.length > size && btn) btn.textContent = "جارٍ الإرسال… "+Math.round(i*100/acts.length)+"٪";
  }
  return acts.length;
}
async function doSend(){
  if (ACTIVE === "page"){ await saveDoc(); toast(RQ.pending() ? "يُرسل إلى Roam…" : "حُفظت الوثيقة"); return; }
  if (sending) return;
  const ob = CFG.dest==="obsidian";
  if (ob){
    const body = bidiStrip(obsText()).replace(/^\s*\n/,"").replace(/\s+$/,"");
    if (!body.trim()){ toast("لا يوجد نص للإرسال"); return; }
    sending = true; const btn = $("#btnSend"), old = btn.textContent; btn.textContent = "جارٍ الحفظ…"; btn.disabled = true;
    try {
      const r = await sendToObsidian(body);
      OBS.vals = {}; renderMeta(); pushHist(); freshModel(); render(); obsStatus();
      toast((r.isNew ? "أُنشئ: " : "أُضيف إلى: ")+r.file+" ✓");
    } catch(e){
      console.error(e);
      showOut(body, null, "— فشل الحفظ: "+e.message+" (نصك محفوظ، لم يُمسح)");
    } finally { sending = false; btn.textContent = old; btn.disabled = false; }
    return;
  }
  const tree = prune(model, 3);
  if (!hasContent(tree)){ toast("لا يوجد نص للإرسال"); return; }
  const payload = {graph:S.graph, page:S.page.kind==="today" ? {kind:"today", daily:dailyTitle(), uid:p2(new Date().getMonth()+1)+"-"+p2(new Date().getDate())+"-"+new Date().getFullYear()} : {kind:"page", title:S.page.title}, blocks:tree};
  if (getToken()){
    sending = true; const btn = $("#btnSend"), old = btn.textContent; btn.textContent = "جارٍ الإرسال…"; btn.disabled = true;
    try {
      const n = await sendToRoam(payload);
      pushHist(); freshModel(); render(); toast("أُرسل إلى Roam ✓ ("+n+" كتلة)");
    } catch(e){
      console.error(e);
      showOut(toMd(tree), () => JSON.stringify(payload, null, 2), "— فشل الإرسال: "+e.message+" (نصك محفوظ، لم يُمسح)");
    } finally { sending = false; btn.textContent = old; btn.disabled = false; }
    return;
  }
  showOut(toMd(tree), () => JSON.stringify(payload, null, 2), $("#outnote").textContent);
  $("#outnote").textContent = "— لا يوجد رمز Roam (من ⚙ الإعدادات)، فهذا الناتج للنسخ فقط";
  $("#out").classList.add("open");
}
async function copyText(text){                     // الحافظة مباشرة: بلا مربع نص مؤقت يُثقل الصفحة
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  const ta = el("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok = document.execCommand("copy"); }catch(e){}
  ta.remove(); return ok;
}

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==="class") e.className = v;
    else if (k.startsWith("on")) e[k] = v;
    else if (k==="value") e.value = v;
    else if (k==="checked") e.checked = v;
    else if (k==="hidden") e.hidden = v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c!=null) e.append(c); });
  return e;
}
async function roamFetch(graph, token, kind, body){
  const r = await fetch("https://api.roamresearch.com/api/graph/"+encodeURIComponent(graph)+"/"+kind,
    {method:"POST", headers:{"X-Authorization":"Bearer "+token, "Content-Type":"application/json"}, body:JSON.stringify(body)});
  return {ok:r.ok, status:r.status, text:await r.text()};
}
async function fetchRoamPages(graph, token){
  const r = await roamFetch(graph, token, "q", {query:"[:find ?t :where [?e :node/title ?t]]"});
  if (!r.ok) throw new Error("status "+r.status+": "+r.text.slice(0,150));
  return JSON.parse(r.text).result.map(x => x[0]).filter(Boolean);
}

const flat = (list, out=[]) => { for (const n of list){ out.push(n); flat(n.children, out); } return out; };
function adaptModel(oldHeader){
  let content = model;
  if (oldHeader && model.length===1 && model[0].children.length) content = model[0].children;
  const pristine = flat(content).every(n => !n.text.trim());
  if (pristine) freshModel();
  else if (S.header) model = [mkHeader(content)];
  else model = content;
  render();
}
function graphChanged(oldHeader){
  activate("main");
  syncS(); loadPages(); pagesInfo(); refreshPageButton(); fillGraphSelect(); saveCfg(); rpGraph();
  if (CFG.dest==="roam" && S.header!==oldHeader) adaptModel(oldHeader);
}
function switchDest(d){
  if (d===CFG.dest) return;
  const oldHeader = S.header, prev = CFG.dest;
  let md = "", obsTxt = prev==="obsidian" ? bidiStrip(obsText()) : "";
  if (prev==="roam"){
    const content = (oldHeader && model.length===1 && model[0].children.length) ? model[0].children : model;
    if (!flat(content).every(n => !n.text.trim())) md = toObsidian(prune(content, 6, true), true);
  }
  pushHist(); CFG.dest = d; saveCfg(); applyDest();
  if (d==="obsidian"){
    if (md.trim()){ model = splitUnits(md).map(u => mk(u)); editingId = null; render(); }
    else { freshModel(); render(); }
  }
  else {
    if (obsTxt.trim()){ const roots = parseMarkdown(obsTxt); model = S.header ? [mkHeader(roots)] : roots; render(); }
    else { freshModel(); render(); }
  }
  focusLastBlock();
}

const OBS = {

function idbOpen(){ return new Promise((res,rej) => { const r = indexedDB.open("rqe",1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { const db = await idbOpen(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch(e){ return undefined; } }
async function idbSet(k,v){ try { const db = await idbOpen(); return await new Promise(res => { const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); } catch(e){ return false; } }
async function idbDel(k){ try { const db = await idbOpen(); await new Promise(res => { const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = res; tx.onerror = res; }); } catch(e){} }

const normKey = s => norm(String(s).trim()).replace(/\s+/g," ");
function cleanName(raw){
  let n = String(raw).replace(/[​-‏‪-‮⁠﻿]/g,"").replace(/[\x00-\x1f\\\/:*?"<>|]/g," ");
  n = n.replace(/\s+/g," ").trim().slice(0,80);
  return n.replace(/^[ .]+|[ .]+$/g,"");
}
function cleanTag(s){ return String(s).trim().replace(/^["']|["']$/g,"").replace(/^#+/,"").trim(); }

async function vaultPerm(h, ask){
  const o = {mode:"readwrite"};
  try {
    if ((await h.queryPermission(o))==="granted") return true;
    if (!ask) return false;
    return (await h.requestPermission(o))==="granted";
  } catch(e){ return false; }
}
